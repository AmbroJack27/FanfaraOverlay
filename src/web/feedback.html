<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Fanfara</title>
<script>(function(){try{var m=location.search.match(/[?&]theme=(dark|light)/);var t=m?m[1]:(localStorage.getItem('fanfara-theme')||'dark');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
  /* images and links can't be dragged around (text can still be selected and copied) */
  img,svg,a{-webkit-user-drag:none}


  :root{
    color-scheme: light;
    --bg:#eef1f7; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f3f6fb;
    --fg:#161c2b; --muted:#5b6478; --faint:#9aa3b5; --line:rgba(16,24,40,.12);
    --glow1:rgba(76,141,255,.10); --glow2:rgba(176,120,255,.08); --accent:#c8912a;
    --display:'Oxanium','Segoe UI',ui-sans-serif,system-ui,sans-serif;
    --body:'Archivo','Segoe UI',ui-sans-serif,system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0a0e17; --bg-2:#0d1220; --panel:#161c2b; --panel-2:#1d2437;
    --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.10);
    --glow1:rgba(76,141,255,.12); --glow2:rgba(176,120,255,.10); --accent:#F5C242;
  }
  *{box-sizing:border-box} html,body{height:100%}
  [hidden]{display:none!important}
  body{ margin:0; background:radial-gradient(1200px 600px at 80% -10%, var(--glow1), transparent 60%), radial-gradient(900px 500px at 0% 0%, var(--glow2), transparent 55%), var(--bg); color:var(--fg); font-family:var(--body); -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1300px; margin:0 auto; padding:0 28px }
  .top{ position:sticky; top:0; z-index:15; background:color-mix(in srgb,var(--bg-2) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
  .top .wrap{ display:flex; align-items:center; gap:12px; padding:14px 28px }
  .back{ cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--fg); font:700 12.5px var(--display); margin-right:4px; transition:.15s }
  .back:hover{ border-color:color-mix(in srgb,#4C8DFF 50%, var(--line)) }
  .back svg{ width:16px; height:16px }
  .brand{ display:flex; align-items:center; gap:11px }
  .brand .mk{ width:30px; height:30px; color:var(--accent) }
  .brand b{ font:800 18px/1 var(--display) } .brand span{ font:600 12px/1.3 var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); display:block }
  .tbtn{ margin-left:auto; cursor:pointer; display:grid; place-items:center; width:40px; height:40px; background:var(--panel); border:1px solid var(--line); border-radius:11px; color:var(--fg) }
  .tbtn svg{ width:18px; height:18px } .tbtn .moon{display:none} :root[data-theme="dark"] .tbtn .sun{display:none} :root[data-theme="dark"] .tbtn .moon{display:block}
  :root{ --blue:#4C8DFF; --red:#ff6b8b; --gold:#F5C242; --green:#4ac46a }
  .wrap.narrow{ max-width:760px }
  .intro{ margin:26px 0 18px } .intro h1{ margin:0; font:800 26px var(--display) } .intro p{ margin:6px 0 0; color:var(--muted); font-size:14.5px; line-height:1.5 }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 18px 40px -30px rgba(0,0,0,.5) }
  .lbl{ display:block; font:700 13px var(--display); letter-spacing:.02em; margin:0 0 9px }
  .lbl small{ font:500 12px var(--body); color:var(--muted); letter-spacing:0; margin-left:6px }
  .kinds{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px }
  .kind{ --c:var(--blue); cursor:pointer; display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:13px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--fg); font:700 14px var(--display); text-align:left; transition:.15s }
  .kind svg{ width:20px; height:20px; color:var(--c); flex:0 0 auto }
  .kind:hover{ border-color:color-mix(in srgb,var(--c) 50%,var(--line)) }
  .kind.on{ border-color:var(--c); background:color-mix(in srgb,var(--c) 14%,var(--panel)); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent) }
  .kind[data-k="bug"]{ --c:var(--red) } .kind[data-k="idea"]{ --c:var(--gold) } .kind[data-k="other"]{ --c:var(--blue) }
  textarea,input[type=text]{ width:100%; font:400 14.5px/1.5 var(--body); color:var(--fg); background:var(--panel-2); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; outline:none; transition:border-color .15s }
  textarea{ min-height:170px; resize:vertical }
  textarea:focus,input[type=text]:focus{ border-color:var(--blue); box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent) }
  .count{ text-align:right; font:600 11.5px var(--display); color:var(--faint); margin:6px 2px 18px }
  .count.warn{ color:var(--red) }
  .row{ margin-bottom:18px }
  .chk{ display:flex; gap:11px; align-items:flex-start; cursor:pointer; padding:12px 14px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); margin-bottom:18px }
  .chk input{ margin:3px 0 0; width:17px; height:17px; accent-color:var(--blue); flex:0 0 auto }
  .chk b{ display:block; font:700 13.5px var(--display) } .chk span{ font-size:12.5px; color:var(--muted); line-height:1.45 }
  .info{ display:flex; gap:10px; font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:20px }
  .info svg{ width:16px; height:16px; flex:0 0 auto; margin-top:2px; color:var(--blue) }
  .actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap }
  .send{ cursor:pointer; border:0; border-radius:12px; padding:13px 26px; font:800 14.5px var(--display); color:#10131c; background:linear-gradient(145deg,#ffe08a,var(--gold)); box-shadow:0 10px 22px -12px var(--gold); display:inline-flex; align-items:center; gap:9px }
  .send svg{ width:17px; height:17px }
  .send[disabled]{ opacity:.5; cursor:default; box-shadow:none }
  .msg{ font:600 13px var(--display); color:var(--red) }
  .spin{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(0,0,0,.25); border-top-color:#10131c; animation:spin .8s linear infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .done{ text-align:center; padding:34px 22px }
  .done .ok{ width:64px; height:64px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--green); box-shadow:0 12px 30px -10px var(--green) }
  .done .ok svg{ width:30px; height:30px }
  .done h2{ margin:0 0 6px; font:800 22px var(--display) } .done p{ margin:0 auto 20px; max-width:440px; color:var(--muted); line-height:1.5 }
  .ghost{ cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; padding:11px 18px; border-radius:11px; border:1px solid var(--line); background:var(--panel-2); color:var(--fg); font:700 13.5px var(--display); margin:0 4px }
  @media (max-width:560px){ .kinds{ grid-template-columns:1fr } }
</style></head>
<body>
<div class="top"><div class="wrap">
  <a class="back" id="back" href="home.html?home=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
  <div class="brand"><svg class="mk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><div><b>Fanfara</b><span id="s-sub">Feedback</span></div></div>
  <button class="tbtn" id="theme" aria-label="Tema">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div></div>

<div class="wrap narrow">
  <div class="intro"><h1 id="t-title"></h1><p id="t-sub"></p></div>

  <div class="card" id="form">
    <span class="lbl" id="l-kind"></span>
    <div class="kinds" id="kinds">
      <button class="kind" data-k="bug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="10" height="14" rx="5"/><path d="M12 6V3M9 4l1.5 2M15 4l-1.5 2M3 12h4M17 12h4M4 7l3 2M20 7l-3 2M4 18l3-2M20 18l-3-2"/></svg><span></span></button>
      <button class="kind" data-k="idea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg><span></span></button>
      <button class="kind" data-k="other"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span></span></button>
    </div>
    <label class="lbl" for="text" id="l-text"></label>
    <textarea id="text" maxlength="4000"></textarea>
    <div class="count" id="count">0 / 4000</div>
    <div class="row"><label class="lbl" for="contact" id="l-contact"></label><input type="text" id="contact" maxlength="200" autocomplete="off"></div>
    <label class="chk"><input type="checkbox" id="log"><div><b id="l-log"></b><span id="l-logS"></span></div></label>
    <div class="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><div id="l-info"></div></div>
    <div class="actions"><button class="send" id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg><span id="l-send"></span></button><span class="msg" id="msg"></span></div>
  </div>

  <div class="card done" id="done" hidden>
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="d-title"></h2><p id="d-sub"></p>
    <a class="ghost" id="d-home" href="home.html?home=1"></a><button class="ghost" id="d-again"></button>
  </div>
</div>

<script>
var T={
 it:{sub:'Feedback',title:'Invia un feedback',subt:'Un problema, un’idea o un saluto: il tuo messaggio arriva direttamente a chi sviluppa Fanfara.',kind:'Di cosa si tratta?',bug:'Problema',idea:'Idea',other:'Altro',
     text:'Il tuo messaggio',ph_bug:'Cosa è successo? Cosa stavi facendo (gioco, schermata)? Succede sempre?',ph_idea:'Cosa ti piacerebbe vedere in Fanfara?',ph_other:'Scrivi qui…',

 fr:{sub:'Avis',title:'Envoyer un avis',subt:'Un problème, une idée ou un simple bonjour : ton message arrive directement au développeur de Fanfara.',kind:'De quoi s’agit-il ?',bug:'Problème',idea:'Idée',other:'Autre',
     text:'Ton message',ph_bug:'Que s’est-il passé ? Que faisais-tu (jeu, écran) ? Ça arrive toujours ?',ph_idea:'Qu’aimerais-tu voir dans Fanfara ?',ph_other:'Écris ici…',

 de:{sub:'Feedback',title:'Feedback senden',subt:'Ein Problem, eine Idee oder einfach ein Hallo: Deine Nachricht geht direkt an den Entwickler von Fanfara.',kind:'Worum geht es?',bug:'Problem',idea:'Idee',other:'Sonstiges',

     dTitle:'Danke!',dSub:'Deine Nachricht ist angekommen. Jedes Feedback hilft, Fanfara besser zu machen.',dHome:'Zur Startseite',dAgain:'Noch eins senden'},
 es:{sub:'Comentarios',title:'Enviar comentarios',subt:'Un problema, una idea o un simple saludo: tu mensaje llega directamente al desarrollador de Fanfara.',kind:'¿De qué se trata?',bug:'Problema',idea:'Idea',other:'Otro',
     text:'Tu mensaje',ph_bug:'¿Qué pasó? ¿Qué estabas haciendo (juego, pantalla)? ¿Pasa siempre?',ph_idea:'¿Qué te gustaría ver en Fanfara?',ph_other:'Escribe aquí…',
     contact:'Cómo contactarte',contactS:'opcional',contactPh:'Email o nombre de Discord, si quieres respuesta',
     log:'Adjuntar el registro técnico',logS:'Las últimas líneas del registro de Fanfara, útiles para entender los problemas. Los datos personales (SteamID, nombre de usuario de Windows) se quitan antes de enviar.',
     info:'Con tu mensaje solo enviamos la versión de Fanfara, el idioma y la versión de Windows.',send:'Enviar',sending:'Enviando…',
     errEmpty:'Escribe al menos unas palabras.',errLimit:'Ya has enviado muchos mensajes hoy: inténtalo mañana.',errNet:'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.',
     dTitle:'¡Gracias!',dSub:'Tu mensaje ha llegado. Cada comentario ayuda a mejorar Fanfara.',dHome:'Volver al inicio',dAgain:'Enviar otro'}
};
function qp(k){ var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)')); return m?decodeURIComponent(m[1]):''; }
var LANG=T[qp('lang')]?qp('lang'):'it', S=T[LANG], KIND='bug', BUSY=false;
var HOST=!!(window.chrome && window.chrome.webview);
function $(id){ return document.getElementById(id); }
function themeNow(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
function homeHref(){ return 'home.html?home=1&theme='+themeNow()+'&lang='+LANG; }
function labels(){
  document.documentElement.lang=LANG;
  $('s-sub').textContent=S.sub; $('t-title').textContent=S.title; $('t-sub').textContent=S.subt; $('l-kind').textContent=S.kind;
  document.querySelectorAll('.kind').forEach(function(b){ b.querySelector('span').textContent=S[b.dataset.k]; });
  $('l-text').textContent=S.text; $('l-contact').innerHTML=S.contact+' <small>('+S.contactS+')</small>'; $('contact').placeholder=S.contactPh;
  $('l-log').textContent=S.log; $('l-logS').textContent=S.logS; $('l-info').textContent=S.info; $('l-send').textContent=S.send;
  $('d-title').textContent=S.dTitle; $('d-sub').textContent=S.dSub; $('d-home').textContent=S.dHome; $('d-again').textContent=S.dAgain;
  $('back').href=homeHref(); $('d-home').href=homeHref();
}
function setKind(k){ KIND=k; document.querySelectorAll('.kind').forEach(function(b){ b.classList.toggle('on', b.dataset.k===k); });
  $('text').placeholder=S['ph_'+k]; $('log').checked=(k==='bug'); }
function count(){ var n=$('text').value.length; $('count').textContent=n+' / 4000'; $('count').classList.toggle('warn', n>3800); }
function busy(on){ BUSY=on; $('send').disabled=on; $('l-send').textContent=on?S.sending:S.send;
  var sp=$('send').querySelector('.spin'); if(on && !sp){ $('send').insertAdjacentHTML('afterbegin','<span class="spin"></span>'); $('send').querySelector('svg').style.display='none'; }
  if(!on && sp){ sp.remove(); $('send').querySelector('svg').style.display=''; } }
function send(){
  if(BUSY) return; $('msg').textContent='';
  var text=$('text').value.trim();
  if(text.length<3){ $('msg').textContent=S.errEmpty; $('text').focus(); return; }
  busy(true);
  var payload={action:'feedback', kind:KIND, text:text, contact:$('contact').value.trim(), attachLog:$('log').checked};
  if(HOST){ try{ window.chrome.webview.postMessage(JSON.stringify(payload)); }catch(e){ window.fanfaraFeedbackDone({ok:false}); } }
  else setTimeout(function(){ window.fanfaraFeedbackDone({ok:true}); }, 900);   // preview outside the app
}
window.fanfaraFeedbackDone=function(r){
  busy(false);
  if(r && r.ok){ $('form').hidden=true; $('done').hidden=false; $('text').value=''; $('contact').value=''; count(); window.scrollTo(0,0); return; }
  $('msg').textContent = (r && r.error==='limit') ? S.errLimit : (r && r.error==='empty') ? S.errEmpty : S.errNet;
};
$('kinds').addEventListener('click',function(e){ var b=e.target.closest('.kind'); if(b) setKind(b.dataset.k); });
$('text').addEventListener('input',count);
$('send').addEventListener('click',send);
$('text').addEventListener('keydown',function(e){ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) send(); });
$('d-again').addEventListener('click',function(){ $('done').hidden=true; $('form').hidden=false; setKind(KIND); $('text').focus(); });
$('theme').addEventListener('click',function(){
  var root=document.documentElement, dark=themeNow()==='dark';
  if(dark){ root.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} }
  else { root.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
  try{ window.chrome.webview.postMessage(JSON.stringify({action:'theme', theme:themeNow()})); }catch(e){}
  $('back').href=homeHref(); $('d-home').href=homeHref();
});
labels(); setKind(qp('kind')||'bug'); count();
</script>
