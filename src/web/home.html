<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanfara</title>
<script>(function(){try{var m=location.search.match(/[?&]theme=(dark|light)/);var t=m?m[1]:(localStorage.getItem('fanfara-theme')||'dark');
document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  /* app feel: no text selection or image dragging when holding the mouse (fields stay editable) */
  body{-webkit-user-select:none; user-select:none} img,svg,a{-webkit-user-drag:none} input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text}

  /* ===== Home (Bento). Data arrives from the C# host: fanfaraHome / fanfaraHomeBoard / fanfaraHomeSync ===== */
  :root{
    --bg:#070a12; --tileA:rgba(25,32,52,.86); --tileB:rgba(14,19,32,.92); --soft:rgba(255,255,255,.04); --soft2:rgba(255,255,255,.07);
    --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.09);
    --shadow:0 24px 50px -30px rgba(0,0,0,.75); --aur:.5; --chip:rgba(20,27,43,.72);
    --gold:#F5C242; --blue:#4C8DFF; --purple:#B078FF; --teal:#2fd0c6; --orange:#ff9f45; --green:#4ac46a;
    --common:#8A93A6; --uncommon:#4ac46a; --rare:#4C8DFF; --epic:#B078FF; --legendary:#F5C242;
    --display:'Oxanium','Segoe UI',sans-serif; --body:'Archivo','Segoe UI',sans-serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#eef1f7; --tileA:#ffffff; --tileB:#f8f9fc; --soft:rgba(16,24,40,.035); --soft2:rgba(16,24,40,.06);
    --fg:#161c2b; --muted:#5b6478; --faint:#8f98ab; --line:rgba(16,24,40,.11);
    --shadow:0 16px 36px -24px rgba(16,24,40,.35); --aur:.2; --chip:rgba(255,255,255,.8);
    --gold:#c8912a; --legendary:#c8912a; --common:#6b7487;
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{height:100%; margin:0}
  [hidden]{display:none!important}
  body{background:var(--bg); color:var(--fg); font-family:var(--body); -webkit-font-smoothing:antialiased; overflow-y:auto; transition:background .35s, color .35s}
  svg{display:block}
  .aurora{position:fixed; inset:0; pointer-events:none; overflow:hidden; opacity:var(--aur); transition:opacity .35s}
  /* still glow (no blur filter, no drifting): a moving layer behind the page made Windows draw all the
     text with softer smoothing. Same colours, the soft edge now comes from the gradient itself. */
  .aurora i{position:absolute; border-radius:50%}
  .aurora .x1{width:800px;height:800px;left:calc(-8% - 90px);top:calc(-18% - 90px);background:radial-gradient(circle,#4C8DFF,rgb(76 141 255 / .35) 30%,transparent 70%)}
  .aurora .x2{width:740px;height:740px;right:calc(-8% - 90px);top:calc(-6% - 90px);background:radial-gradient(circle,#B078FF,rgb(176 120 255 / .35) 30%,transparent 70%)}
  .aurora .x3{width:700px;height:700px;left:calc(30% - 90px);bottom:calc(-30% - 90px);background:radial-gradient(circle,#F5C242,rgb(245 194 66 / .35) 30%,transparent 72%);opacity:.6}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,30px) scale(1.08)}66%{transform:translate(-30px,20px) scale(.95)}}

  .app{position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; padding:0 30px 30px; opacity:0; transition:opacity .5s}
  .app.show{opacity:1}
  /* 0.7.0: the navigation bar (nav.js) with sync, bell and theme on the right, always on top */
  .top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:14px 0 12px; margin:0 -30px; padding-left:30px; padding-right:30px;
    background:color-mix(in srgb,var(--bg) 88%,transparent); border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
  /* fixed warning while Steam hides the player's achievements (privacy) */
  .warnbar{display:flex; align-items:center; gap:14px; padding:12px 16px; margin-top:16px; border-radius:16px; background:color-mix(in srgb,#ff6b8b 10%,var(--tileB)); border:1px solid color-mix(in srgb,#ff6b8b 45%,var(--line)); box-shadow:var(--shadow)}
  .warnbar[hidden]{display:none}
  .warnbar .wi{flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font:800 17px var(--display); color:#ff6b8b; background:color-mix(in srgb,#ff6b8b 18%,transparent)}
  .warnbar .wt{flex:1; min-width:0} .warnbar b{display:block; font:800 14.5px var(--display)} .warnbar span{font-size:13px; color:var(--muted); line-height:1.45}
  .warnbar button{cursor:pointer; flex:0 0 auto; padding:9px 14px; border-radius:11px; font:700 13px var(--display); border:1px solid var(--line); background:var(--chip); color:var(--fg)}
  .warnbar button.gold{border:0; color:#1b1405; background:linear-gradient(145deg,#ffe58a,#F5C242)}
  .hello{display:flex; align-items:center; gap:12px; margin:22px 0 4px}
  .hello .av{width:40px; height:40px; font-size:14px; cursor:pointer}
  .hello .av svg{width:20px; height:20px; color:#1a1205}
  .greet{font:800 22px var(--display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .greet span{color:var(--muted); font-weight:600}
  .ver{font:700 11px var(--display); color:var(--muted); letter-spacing:.03em; padding:3px 8px; border-radius:999px; background:var(--chip); border:1px solid var(--line)}
  .ver:empty{display:none}
  .sp{flex:1}
  .chip{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:var(--chip); border:1px solid var(--line); font:600 12px var(--body); color:var(--muted); white-space:nowrap; cursor:pointer}
  .chip:hover{color:var(--fg)}
  .chip .ok{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green)}
  .chip.busy{cursor:default} .chip.busy .ok{background:var(--gold); box-shadow:0 0 8px var(--gold); animation:blink .6s infinite alternate}
  .chip.never .ok{background:var(--faint); box-shadow:none}
  @keyframes blink{to{opacity:.3}}
  .ibtn{display:grid; place-items:center; width:40px; height:40px; border-radius:12px; background:var(--chip); border:1px solid var(--line); color:var(--fg); cursor:pointer; flex:0 0 auto}
  .ibtn svg{width:18px; height:18px} .ibtn .sun{display:none} :root[data-theme="light"] .ibtn .sun{display:block} :root[data-theme="light"] .ibtn .moon{display:none}
  /* the bar needs the room: below 1500px the sync chip keeps only its dot (the text is in its tooltip) */
  @media (max-width:1499px){ #synct{display:none} .chip#sync{padding:8px 11px} }

  /* ===== cards ===== */
  .sec{font:700 12px var(--display); letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:22px 2px 12px}
  .quick{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.95fr); gap:16px}
  .info{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr); gap:16px}
  @media (max-width:1300px){ .quick{grid-template-columns:1fr 1fr} .quick .fan{grid-column:1/-1} .info{grid-template-columns:1fr 1fr} }
  @media (max-width:820px){ .quick,.info{grid-template-columns:1fr} .fan .row{grid-template-columns:1fr} }
  .card{--c:var(--gold); --ct:var(--c); position:relative; overflow:hidden; min-width:0; padding:18px 20px; border-radius:20px;
    background:linear-gradient(165deg,var(--tileA),var(--tileB)); border:1px solid color-mix(in srgb,var(--c) 16%, var(--line)); box-shadow:var(--shadow);
    opacity:0; transform:translateY(18px); transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s, background .35s}
  :root[data-theme="light"] .card{--ct:color-mix(in srgb,var(--c) 72%, #000)}
  .card::before{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(90% 70% at 100% 0%, color-mix(in srgb,var(--c) 12%, transparent), transparent 60%)}
  .card > *{position:relative}
  .card.in{opacity:1; transform:none; transition:opacity .55s ease, transform .7s cubic-bezier(.2,.85,.25,1.05), box-shadow .3s, border-color .3s, background .35s}
  .card.link{cursor:pointer} .card.link.in:hover{transform:translateY(-3px); border-color:color-mix(in srgb,var(--c) 50%, var(--line))}
  .ct{display:flex; align-items:center; gap:10px; margin-bottom:14px; min-height:24px}
  .ct h3{margin:0; font:700 11.5px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ct svg{width:16px; height:16px; color:var(--ct); flex:0 0 auto}
  .ct .go{margin-left:auto; flex:0 0 auto; font:700 12px var(--display); color:var(--muted); cursor:pointer; background:none; border:0; padding:4px 6px; border-radius:8px; white-space:nowrap}
  .ct .go:hover{color:var(--fg); background:var(--soft2)}
  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; color:var(--muted); font-size:13px; padding:14px 10px}
  .empty b{color:var(--fg); font:700 15px var(--display)}

  /* your fanfare */
  .fan .row{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px}
  .well{position:relative; overflow:hidden; border-radius:14px; background:linear-gradient(180deg,#0a0e18,#05070d); border:1px solid rgba(255,255,255,.06); aspect-ratio:16/10}
  .well::before{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(70% 90% at 70% 10%, rgba(245,194,66,.2), transparent 70%)}
  .well iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; color-scheme:normal; pointer-events:none}
  .snm{font:800 21px var(--display); line-height:1.15} .ssub{color:var(--muted); font-size:12.5px; margin-top:3px}
  .btns{display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:7px; border-radius:11px; padding:9px 14px; font:700 13px var(--display); border:1px solid var(--line); background:var(--soft2); color:var(--fg); white-space:nowrap; cursor:pointer; transition:transform .15s, filter .15s}
  .btn svg{width:15px; height:15px}
  .btn:hover{transform:translateY(-1px); filter:brightness(1.08)}
  .btn.pri{border:0; color:#1b1405; background:linear-gradient(145deg,#ffe58a,#F5C242)}
  .lbl{font:700 11px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:12px 0 7px; display:flex; justify-content:space-between; gap:8px}
  .lbl b{color:var(--fg); letter-spacing:0}
  .recent{display:flex; flex-wrap:wrap; gap:6px}
  .rc{cursor:pointer; padding:6px 10px; border-radius:999px; background:var(--soft); border:1px solid var(--line); font:600 12px var(--body); color:var(--muted)}
  .rc:hover{color:var(--fg)}
  .rc.on{color:var(--fg); border-color:color-mix(in srgb,var(--gold) 50%,var(--line)); background:color-mix(in srgb,var(--gold) 12%,transparent)}
  input[type=range]{width:100%; accent-color:var(--gold); cursor:pointer}
  .pos{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:128px; aspect-ratio:16/10; padding:5px; border-radius:9px; border:1px solid var(--line); background:var(--soft)}
  .pos i{border-radius:4px; background:var(--soft2); cursor:pointer} .pos i:hover{background:color-mix(in srgb,var(--gold) 35%,var(--soft2))} .pos i.x{visibility:hidden} .pos i.on{background:var(--gold)}
  .posrow{display:flex; gap:18px; align-items:flex-start; margin-top:4px} .posrow .r{flex:1; min-width:0}
  .saved{font:600 11.5px var(--body); color:var(--green); display:flex; align-items:center; gap:6px; margin-top:12px; opacity:0; transition:opacity .25s}
  .saved::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--green)}
  .saved.on{opacity:1}

  /* album styles */
  .albs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
  .alt{cursor:pointer; position:relative; aspect-ratio:1/1; border-radius:12px; border:2px solid transparent; background:#0b0f1a center/cover; overflow:hidden; padding:0}
  .alt .cv{position:absolute; left:50%; top:44%; width:38%; aspect-ratio:3/4; transform:translate(-50%,-50%); background:center/100% 100% no-repeat; filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
  .alt.classic{background:radial-gradient(circle at 50% 35%,#24304f,#0b0f1a 75%)}
  .alt.classic .cv{background:linear-gradient(160deg,#28376a,#152043); border:2px solid #d9a838; border-radius:2px}
  .alt span.n{position:absolute; left:6px; right:6px; bottom:5px; font:700 10.5px var(--display); color:#fff; text-shadow:0 1px 3px #000; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .alt:hover{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
  .alt.on{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
  .seg3{display:flex; padding:3px; border-radius:11px; background:var(--soft); border:1px solid var(--line); margin-top:12px}
  .seg3 button{flex:1; cursor:pointer; padding:7px 0; border:0; border-radius:8px; background:none; font:700 12px var(--display); color:var(--muted)}
  .seg3 button.on{background:var(--soft2); color:var(--fg); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent)}

  /* 100% toggles */
  .tg{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)} .tg:last-child{border-bottom:0}
  .tg div{flex:1; min-width:0} .tg b{display:block; font:700 13px var(--body)} .tg small{color:var(--muted); font-size:11.5px}
  .mini{cursor:pointer; padding:6px 10px; border-radius:9px; border:1px solid var(--line); background:var(--soft2); font:700 11.5px var(--display); white-space:nowrap}
  .mini:hover{filter:brightness(1.1)}
  .sw{position:relative; width:40px; height:23px; flex:0 0 auto}
  .sw input{opacity:0; width:0; height:0; position:absolute} .sw i{position:absolute; inset:0; border-radius:999px; background:var(--soft2); border:1px solid var(--line); cursor:pointer; transition:.2s}
  .sw i::after{content:''; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.2s}
  .sw input:checked + i{background:var(--gold); border-color:var(--gold)} .sw input:checked + i::after{left:19px}
  .sw input:focus-visible + i{outline:2px solid var(--gold); outline-offset:2px}

  /* achievement art: the real Steam icon, or the rarity crest when the icon is unknown */
  .t-common{--t:var(--common)} .t-uncommon{--t:var(--uncommon)} .t-rare{--t:var(--rare)} .t-epic{--t:var(--epic)} .t-legendary{--t:var(--legendary)}
  [class*="t-"]{--tc:var(--t)}
  :root[data-theme="light"] [class*="t-"]{--tc:color-mix(in srgb,var(--t) 75%, #000)}
  .art{position:relative; display:grid; place-items:center}
  .art img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
  .art.icon img{object-fit:cover; border-radius:18%; border:2px solid color-mix(in srgb,var(--t) 70%, transparent); filter:none}
  .rar{color:var(--tc); font-weight:700}

  /* info row */
  .unl{display:flex; flex-direction:column; gap:10px}
  .u{display:flex; align-items:center; gap:11px; min-width:0}
  .u .art{width:40px; height:40px; flex:0 0 auto}
  .u .tx{min-width:0; flex:1} .u b{display:block; font:700 13px var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .u small{display:block; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .u .new{flex:0 0 auto; font:800 9px var(--display); letter-spacing:.1em; text-transform:uppercase; color:#1a1205; background:var(--gold); padding:3px 6px; border-radius:99px}
  .rank{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap} .rank .big{font:800 40px/1 var(--display); display:flex; align-items:flex-start} .rank .big sup{font-size:17px; margin:2px 0 0 1px}
  .rank span.lbl2{color:var(--muted); font-size:12.5px}
  .seg{display:flex; gap:4px; padding:3px; border-radius:10px; background:var(--soft2); width:max-content; margin-top:10px}
  .seg span{font:700 11px var(--display); padding:6px 11px; border-radius:7px; color:var(--muted); cursor:pointer; transition:.2s}
  .seg span.on{background:var(--orange); color:#1a1205}
  .rows{display:flex; flex-direction:column; gap:5px; margin-top:12px}
  .pr{display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:10px; background:var(--soft); font:600 12.5px var(--body); opacity:0; transform:translateX(10px)}
  .pr.in{opacity:1; transform:none; transition:.45s cubic-bezier(.2,.8,.2,1)}
  .pr .r{width:16px; font:700 12px var(--display); color:var(--muted)} .pr .nm{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .pr b{font:800 13px var(--display)}
  .pr.r1 .r{color:#F5C242}
  .pr.you{background:color-mix(in srgb,var(--orange) 12%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--orange) 50%,transparent)}
  .pr .av{width:22px; height:22px; font-size:9px}
  .note{margin-top:10px; font:600 12px var(--body); color:var(--ct); text-align:center; padding:7px; border-radius:10px; border:1px dashed color-mix(in srgb,var(--orange) 45%,transparent)}
  .lbmsg{margin-top:12px; padding:12px; border-radius:12px; background:var(--soft); font:500 12.5px var(--body); color:var(--muted); line-height:1.45}
  .lbmsg b{display:block; color:var(--fg); font:700 13.5px var(--display); margin-bottom:3px}
  .lbmsg.cta{border:1px dashed color-mix(in srgb,var(--orange) 50%,transparent); background:color-mix(in srgb,var(--orange) 7%,transparent)}
  .av{width:26px; height:26px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; overflow:hidden; font:800 10px var(--display); color:#1a1205; position:relative;
    background:conic-gradient(from 210deg,#ffd868,#F5C242,#c8912a,#ffd868)}
  .av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .alm{display:flex; flex-direction:column; gap:12px}
  .gm{display:flex; align-items:center; gap:10px; min-width:0} .gm .tx{flex:1; min-width:0}
  .gm .t2{display:flex; gap:8px; font:600 12.5px var(--body)} .gm .t2 em{font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .gm .t2 span{margin-left:auto; font:700 12px var(--display); color:var(--ct); white-space:nowrap}
  .gt{position:relative; flex:0 0 auto; width:38px; height:38px; border-radius:10px; overflow:hidden; display:grid; place-items:center; font:800 12px var(--display); color:rgba(255,255,255,.92);
    background:linear-gradient(145deg,#3a4566,#151b2c)}
  .gt img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .bar{height:6px; border-radius:99px; background:var(--soft2); overflow:hidden; margin-top:6px}
  .bar i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#1aa59c,#2fd0c6); transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .left{font:600 11px var(--body); color:var(--muted); margin-top:4px}
  .kv{display:flex; align-items:baseline; gap:8px} .kv b{font:800 30px var(--display)} .kv span{color:var(--muted); font-size:12px}
  .spark{display:flex; align-items:flex-end; gap:6px; height:84px; margin-top:8px}
  .spark i{position:relative; flex:1; height:0; min-height:3px; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,#5fdc7e,#2f9e4f); transition:height .9s cubic-bezier(.2,.85,.25,1.1)}
  .spark i.zero{background:var(--soft2)}
  .spark i::after{content:attr(data-v); position:absolute; left:50%; top:-20px; transform:translateX(-50%); font:700 11px var(--display); color:var(--fg); opacity:0; transition:.15s}
  .spark i:hover::after{opacity:1}
  .days{display:flex; gap:6px; margin-top:6px} .days span{flex:1; text-align:center; font:600 10.5px var(--body); color:var(--muted); text-transform:uppercase}
  .days span.today{color:var(--green)}

  .toast{position:fixed; left:50%; bottom:30px; z-index:90; transform:translate(-50%,30px); opacity:0; pointer-events:none; display:flex; align-items:center; gap:10px;
    padding:12px 18px; border-radius:14px; background:rgba(16,21,35,.96); color:#E8EBF3; border:1px solid rgba(255,255,255,.14); box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
    font:600 13.5px var(--body); transition:opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.2)}
  .toast.on{opacity:1; transform:translate(-50%,0)} .toast i{width:9px; height:9px; border-radius:50%; background:#F5C242}

  /* ---------- intro (first launch only) ---------- */
  #intro{position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:var(--bg); transition:opacity .55s ease, visibility .55s}
  #intro.gone{opacity:0; visibility:hidden}
  .intro-wrap{display:flex; flex-direction:column; align-items:center; gap:18px}
  .logo{width:104px; height:104px; color:var(--gold); animation:logoIn 1s cubic-bezier(.2,.9,.3,1.2) both, glow 1.7s ease-in-out .4s both}
  .logo svg{width:100%; height:100%}

  function N(){ return NT[LANG]||NT.en; }

  var bellOpen=false, lastUnread=-1, NEWS=null, UPST=null;
  function nfmt(k,o){ return fmt(N()[k]||'', o); }
  function notifRow(x){
    var o={who:esc(x.who||'?'), game:esc(x.game||''), n:num(x.n||0), ver:esc(x.ver||'')}, ic='', t='', s='';
    if(x.kind==='friend100'){ ic=x.avatar? '<div class="ic av"><img src="'+esc(x.avatar)+'" alt=""></div>' : '<div class="ic av">'+esc((x.who||'?').charAt(0).toUpperCase())+'</div>'; t=nfmt('friend100',o); s=x.n? nfmt(x.n===1?'friend100s1':'friend100s',o):''; }
    else if(x.kind==='mine100'){ ic='<div class="ic g">'+bsvg('trophy')+'</div>'; t=nfmt('mine100',o); s=x.n? nfmt('mine100s',o):''; }

    else if(x.kind==='updated'){ ic='<div class="ic p">'+bsvg('star')+'</div>'; t=nfmt('updated',o); s=nfmt('updateds',o); }
    else if(x.kind==='styles'){ ic='<div class="ic g">'+bsvg('book')+'</div>'; t=nfmt('styles',o); s=nfmt('styless',o); }
    else return '';
    return '<div class="ni'+(x.read?'':' new')+'" role="button" tabindex="0" data-id="'+esc(x.id)+'">'+ic+'<div class="tx">'+t+(s?'<small>'+s+'</small>':'')+'</div><div class="tm">'+esc(ago(x.ts))+'</div></div>';
  }
  function renderBell(){
    if(!D) return;
    var list=D.notifs||[], un=D.unread||0, b=$('bell');
    b.setAttribute('aria-label', N().bell+(un? ' ('+un+')':'')); b.title=N().bell;
    $('bdg').textContent= un>0 ? (un>9?'9+':String(un)) : '';
    if(lastUnread>=0 && un>lastUnread){ b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring'); }
    lastUnread=un;
    $('npT').textContent=N().bell; $('npRead').textContent=N().readAll; $('npRead').disabled=!un;
    if(!list.length){ $('npL').innerHTML='<div class="ne">'+bsvg('bell')+N().empty+'</div>'; return; }
    var now=Date.now()/1000, day=new Date(); day.setHours(0,0,0,0); var d0=day.getTime()/1000, w0=now-7*86400, g={t:[],w:[],o:[]};
    list.forEach(function(x){ (x.ts>=d0?g.t: x.ts>=w0?g.w:g.o).push(x); });
    var h='';
    [['t','today'],['w','week'],['o','older']].forEach(function(p){ if(g[p[0]].length) h+='<div class="ng">'+esc(N()[p[1]])+'</div>'+g[p[0]].map(notifRow).join(''); });
    $('npL').innerHTML=h;
  }
  function markRead(){
    if(!D || !D.unread) return;

  function setBell(open){
    bellOpen=open; $('np').classList.toggle('open',open); $('bell').classList.toggle('on',open); $('bell').setAttribute('aria-expanded',open?'true':'false');

  }
  function notifGo(x){
    setBell(false);
    if(x.kind==='friend100') location.href=withCtx('classifica.html')+'&tab=friends';
    else if(x.kind==='mine100') location.href=withCtx('collection.html')+(x.appid?'&open='+x.appid:'');
    else if(x.kind==='update'){ if(D && D.update) showUpd(true, true); else post({action:'update-now'}); }
    else if(x.kind==='updated'){ if(HOST) post({action:'news'}); else if(NEWS) showNews(NEWS); }   // the app reads the notes again from GitHub
    else if(x.kind==='styles') location.href=withCtx('settings.html')+'&tab=a';

  $('bell').addEventListener('click', function(e){ e.stopPropagation(); setBell(!bellOpen); });

  document.addEventListener('click', function(){ if(bellOpen) setBell(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(bellOpen) setBell(false); if($('nws').classList.contains('show')) closeNews(); } });

  // update offer (bottom right). «Later» hides it until Fanfara restarts; the bell keeps the entry.
  function later(v){ try{ return sessionStorage.getItem('fan-upd-later')===v; }catch(e){ return false; } }
  function showUpd(on, force){
    var el=$('upd');
    if(!on || !D || !D.update){ el.classList.remove('show'); return; }
    if(!force && !UPST && later(D.update)) return;
    if(!UPST) paintUpd();
    el.classList.add('show');

  function paintUpd(){
    var n=N(), st=UPST&&UPST.state, v=esc((D&&D.update)||''), p=UPST? Math.max(0,Math.min(100,UPST.pct|0)) : 0;
    $('updT').textContent=fmt(n.upT,{ver:(D&&D.update)||''});
    var s=n.upS, acts='<button class="gold" id="updGo">'+esc(n.upNow)+'</button><button id="updNo">'+esc(n.upLater)+'</button>', bar='';
    if(st==='download'){ s=fmt(n.upDl,{p:p}); acts=''; bar='<div class="pb"><i style="width:'+p+'%"></i></div>'; }
    else if(st==='verify'||st==='install'){ s=n.upInst; acts=''; bar='<div class="pb ind"><i></i></div>'; }
    else if(st==='wait'){ s=n.upWait; acts='<button id="updNo">'+esc(n.upLater)+'</button>'; }
    else if(st==='fail'){ s=n.upFail; acts='<button class="gold" id="updGo">'+esc(n.upRetry)+'</button><button id="updNo">'+esc(n.upLater)+'</button>'; }
    $('updS').textContent=s; $('updA').innerHTML=acts?'<div class="ua">'+acts+'</div>':''; $('updP').innerHTML=bar;
    $('updX').hidden= st==='download'||st==='install'||st==='verify';
    var go=$('updGo'), no=$('updNo');
    if(go) go.onclick=function(){ UPST={state:'download',pct:0}; paintUpd(); post({action:'update-now'});
      if(!HOST){ var q=0, t=setInterval(function(){ q+=9; if(q>=100){ clearInterval(t); window.fanfaraUpdate({state:'install',pct:100}); } else window.fanfaraUpdate({state:'download',pct:q}); },180); } };
    if(no) no.onclick=dismissUpd;
  }
  function dismissUpd(){ try{ sessionStorage.setItem('fan-upd-later', (D&&D.update)||''); }catch(e){} $('upd').classList.remove('show'); if(UPST && UPST.state==='fail') UPST=null; }
  $('updX').addEventListener('click', dismissUpd);
  window.fanfaraUpdate=function(u){
    if(!u) return; UPST=u; if(!D) return;
    if(!D.update) D.update='…';
    paintUpd(); $('upd').classList.add('show');
  };

  // «What's new» after an update: the release notes in the player's language (simple markdown)
  function md(src){
    var out=[], inList=false;
    function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/(^|\s)\*([^*]+)\*/g,'$1<i>$2</i>'); }
    String(src||'').replace(/\r/g,'').split('\n').forEach(function(l){
      var m;
      if(/^\s*!\[/.test(l)) return;   // pictures stay on GitHub
      if((m=l.match(/^\s*[-*•]\s+(.*)$/))){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inl(m[1])+'</li>'); return; }
      if(inList){ out.push('</ul>'); inList=false; }
      if((m=l.match(/^\s*#{1,6}\s+(.*)$/))){ out.push('<h4>'+inl(m[1])+'</h4>'); return; }
      if(/^\s*(---+|\*\*\*+)\s*$/.test(l) || !l.trim()) return;
      out.push('<p>'+inl(l)+'</p>');
    });
    if(inList) out.push('</ul>');
    return out.join('');
  }

    NEWS=n; var t=N();
    $('nwsK').textContent=t.newsK; $('nwsT').textContent=fmt(t.newsT,{ver:n.ver||''}); $('nwsOk').textContent=t.newsOk;

  function toggleTheme(){
    var next=themeNow()==='dark'?'light':'dark';
