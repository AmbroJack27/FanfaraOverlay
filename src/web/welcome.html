<style>
:root{
  color-scheme:light;
  --bg:#eef1f7; --bg-2:#fff; --panel:#fff; --panel-2:#f3f6fb; --fg:#161c2b; --muted:#5b6478; --faint:#9aa3b5; --line:rgba(16,24,40,.12);
  --rare:#2f6fe0; --ok:#2f9e4f; --bad:#d64561; --warn:#c8912a; --gold:#c8912a;
  --display:'Oxanium','Segoe UI',ui-sans-serif,system-ui,sans-serif; --body:'Archivo','Segoe UI',ui-sans-serif,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0e17; --bg-2:#0d1220; --panel:#161c2b; --panel-2:#1d2437; --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.10);
  --rare:#4C8DFF; --ok:#4ac46a; --bad:#ff6b8b; --warn:#F5C242; --gold:#F5C242;
}
*{box-sizing:border-box} html,body{margin:0; min-height:100%}
body{background:radial-gradient(1100px 600px at 85% -10%, rgba(76,141,255,.13), transparent 60%), radial-gradient(900px 520px at 0% 110%, rgba(245,194,66,.10), transparent 60%), var(--bg);
  background-attachment:fixed; color:var(--fg); font-family:var(--body); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh}
button{font-family:inherit}
.top{display:flex; align-items:center; gap:14px; padding:16px 28px}
.brand{display:flex; align-items:center; gap:10px} .brand svg{width:30px; height:30px; color:var(--gold)} .brand b{font:800 18px var(--display)}
.brand span{display:block; font:600 11.5px var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.dots{margin-left:auto; display:flex; align-items:center; gap:8px}
.dots i{width:28px; height:6px; border-radius:3px; background:color-mix(in srgb,var(--fg) 14%,transparent); transition:.3s}
.dots i.done{background:color-mix(in srgb,var(--gold) 55%,transparent)} .dots i.on{background:var(--gold); width:44px}
.skip{cursor:pointer; margin-left:14px; background:none; border:0; color:var(--muted); font:600 13px var(--display)} .skip:hover{color:var(--fg)}
.tbtn{cursor:pointer; display:grid; place-items:center; width:36px; height:36px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--fg)}
.tbtn svg{width:17px; height:17px} .tbtn .moon{display:none} :root[data-theme="dark"] .tbtn .sun{display:none} :root[data-theme="dark"] .tbtn .moon{display:block}
.stage{flex:1; display:grid; place-items:start center; padding:6px 24px 28px}
.card{width:min(900px,100%); border-radius:22px; background:var(--panel); border:1px solid var(--line); box-shadow:0 30px 60px -36px rgba(0,0,0,.6); overflow:hidden}
.step{display:none; padding:30px 34px 24px} .step.on{display:block} .step.anim{animation:in .35s ease}
@keyframes in{from{opacity:0; transform:translateY(10px)}}
.kick{font:700 12px var(--display); letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
h1{margin:6px 0 8px; font:800 28px/1.15 var(--display)} h2{margin:6px 0 8px; font:800 24px/1.2 var(--display)}
p.lead{margin:0 0 20px; color:var(--muted); font-size:15px; line-height:1.55; max-width:700px}
.foot{display:flex; align-items:center; gap:10px; padding:16px 34px; border-top:1px solid var(--line); background:var(--panel-2)}
.foot .sp{flex:1} .foot small{color:var(--muted); font-size:12.5px}
.btn{cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px; font:700 14px var(--display); border:1px solid var(--line); background:var(--panel); color:var(--fg)}
.btn:hover{border-color:color-mix(in srgb,var(--rare) 55%,var(--line))} .btn[disabled]{opacity:.5; cursor:default}
.btn.gold{border:0; color:#1b1405; background:linear-gradient(145deg,#ffe58a,#F5C242); box-shadow:0 10px 22px -12px #F5C242}
.btn.small{padding:8px 13px; font-size:13px; border-radius:10px}
details.why{margin-top:16px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2)}
details.why summary{cursor:pointer; list-style:none; padding:11px 14px; font:700 13.5px var(--display); color:var(--muted); display:flex; align-items:center; gap:8px}
details.why summary::-webkit-details-marker{display:none} details.why summary::before{content:"ⓘ"; color:var(--rare); font-size:15px}
details.why[open] summary{color:var(--fg)} details.why p{margin:0; padding:0 14px 13px 38px; color:var(--muted); font-size:14px; line-height:1.6}
/* welcome */
.hero{display:grid; grid-template-columns:1fr 300px; gap:26px; align-items:center}
.demo{position:relative; height:200px; border-radius:16px; overflow:hidden; background:linear-gradient(160deg,#1c2848,#0b1020 70%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.demo .toast{position:absolute; right:14px; top:14px; width:236px; display:flex; gap:10px; align-items:center; padding:10px; border-radius:12px; background:rgba(15,20,36,.92); border:1px solid rgba(245,194,66,.55); box-shadow:0 0 30px -8px #F5C242; color:#fff; animation:pop 3.2s ease-in-out infinite}
@keyframes pop{0%,8%{transform:translateX(120%)} 18%,78%{transform:none} 90%,100%{transform:translateX(120%)}}
.demo .toast .ic{flex:0 0 auto; width:40px; height:40px; border-radius:9px; background:linear-gradient(135deg,#F5C242,#a8741a); display:grid; place-items:center} .demo .toast .ic svg{width:22px; height:22px; color:#2a1a02}
.demo .toast b{display:block; font:800 13px var(--display)} .demo .toast span{font:600 11px var(--display); color:#F5C242}
.demo .scene{position:absolute; left:0; right:0; bottom:0; height:90px; background:linear-gradient(0deg,#0a0f1d,transparent)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 14px}
.chip{cursor:pointer; padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font:700 13px var(--display)}
.chip.on{color:var(--fg); border-color:var(--gold); background:color-mix(in srgb,var(--gold) 12%,var(--panel-2))}
.lbl{font:700 12px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.again{font-size:13px; color:var(--muted); line-height:1.5}
/* checks */
.checks{display:flex; flex-direction:column; gap:10px; margin-bottom:6px}
.chk{display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; padding:13px 14px; border-radius:14px; background:var(--panel-2); border:1px solid var(--line)}
.chk .st{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:800 15px var(--display)}
.chk.ok .st{background:color-mix(in srgb,var(--ok) 18%,transparent); color:var(--ok)}
.chk.bad .st{background:color-mix(in srgb,var(--bad) 18%,transparent); color:var(--bad)}
.chk.unk .st{background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn)}
.chk.wait .st{border:3px solid color-mix(in srgb,var(--rare) 25%,transparent); border-top-color:var(--rare); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chk b{display:block; font:700 14.5px var(--display)} .chk small{color:var(--muted); font-size:13px; line-height:1.45}
.who{display:flex; align-items:center; gap:10px} .who img,.who .av{width:34px; height:34px; border-radius:8px; object-fit:cover} .who .av{background:linear-gradient(135deg,#6a7bd8,#2e3a7a); display:grid; place-items:center; font:800 15px var(--display); color:#fff}
.who b{font:700 14px var(--display)}
.fix{margin-top:12px; padding:16px; border-radius:14px; border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line)); background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.fix h3{margin:0 0 6px; font:800 16px var(--display)} .fix p{margin:0 0 12px; color:var(--muted); font-size:14px; line-height:1.5}
.fix ol{margin:0 0 14px; padding-left:20px; font-size:14px; line-height:1.7}
.steamset{display:grid; grid-template-columns:auto auto; justify-content:start; gap:6px 18px; padding:12px 14px; margin:0 0 14px; border-radius:10px; background:#1b2838; color:#c7d5e0; font:13px Arial,sans-serif}
.steamset .k{color:#8f98a0} .steamset .v{justify-self:start; padding:2px 8px; border-radius:3px; background:#5c7e10; color:#fff; box-shadow:0 0 0 2px #a4d007}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.note{font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5}
/* screens + test */
.mons{display:flex; align-items:flex-end; gap:16px; margin:4px 0 18px; flex-wrap:wrap}
.mon{cursor:pointer; position:relative; border-radius:8px; border:2px solid var(--line); background:var(--panel-2); display:grid; place-items:center; text-align:center; color:var(--muted); font:800 15px/1.2 var(--display); transition:.15s; padding:6px}
.mon::after{content:""; position:absolute; left:40%; right:40%; bottom:-12px; height:10px; background:var(--line); border-radius:0 0 4px 4px}
.mon small{display:block; font:600 11px var(--display)}
.mon.on{border-color:var(--gold); color:var(--fg); background:color-mix(in srgb,var(--gold) 12%,var(--panel-2))}
.mon.auto{width:150px; height:94px}
.ask{display:none; margin-top:14px; padding:14px; border-radius:14px; background:var(--panel-2); border:1px solid var(--line)} .ask.on{display:block}
.ask b{display:block; font:800 15px var(--display); margin-bottom:10px}
.help{display:none; margin-top:12px; padding:14px 16px; border-radius:14px; background:color-mix(in srgb,var(--warn) 9%,var(--panel)); border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line)); font-size:14px; line-height:1.55}
.help.on{display:block} .help h3{margin:0 0 6px; font:800 15px var(--display)} .help ul{margin:6px 0 0; padding-left:20px}
.help.good{background:color-mix(in srgb,var(--ok) 9%,var(--panel)); border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
/* fullscreen modes */
.modes{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px}
.mode{padding:14px; border-radius:14px; background:var(--panel-2); border:1px solid var(--line)}
.mode .ico{height:62px; border-radius:8px; margin-bottom:10px; position:relative; background:linear-gradient(160deg,#25345e,#101628)}
.mode .ico i{position:absolute; right:8px; top:8px; width:46px; height:12px; border-radius:4px; background:#F5C242; box-shadow:0 0 10px #F5C242}
.mode.no .ico i{display:none} .mode.no .ico::after{content:"✕"; position:absolute; inset:0; display:grid; place-items:center; font:800 26px var(--display); color:var(--bad)}
.mode b{display:block; font:800 14.5px var(--display)} .mode small{display:block; margin-top:4px; color:var(--muted); font-size:12.5px; line-height:1.45}
.mode .tag{display:inline-block; margin-top:8px; padding:3px 8px; border-radius:999px; font:800 11px var(--display)}
.mode.yes .tag{color:var(--ok); background:color-mix(in srgb,var(--ok) 15%,transparent)} .mode.no .tag{color:var(--bad); background:color-mix(in srgb,var(--bad) 15%,transparent)}
.prep{display:flex; align-items:center; gap:14px; padding:14px; border-radius:14px; background:color-mix(in srgb,var(--ok) 9%,var(--panel-2)); border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line)); font-size:14px; line-height:1.5}
.prep b{display:block; font-family:var(--display)} .prep .w{display:block; margin-top:6px; font-weight:700; color:var(--fg)} .prep div{flex:1}
/* prefs */
.prefs{display:flex; flex-direction:column; gap:10px}
.pref{display:flex; align-items:center; gap:14px; padding:13px 14px; border-radius:14px; background:var(--panel-2); border:1px solid var(--line)}
.pref div{flex:1} .pref b{display:block; font:700 14.5px var(--display)} .pref small{color:var(--muted); font-size:13px; line-height:1.45}
.sw{cursor:pointer; width:46px; height:26px; border-radius:999px; background:color-mix(in srgb,var(--fg) 18%,transparent); position:relative; border:0; flex:0 0 auto}
.sw::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px} .sw[disabled]{opacity:.45; cursor:default}
input[type=range]{width:170px; accent-color:var(--gold)} .vol{font:800 13px var(--display); min-width:42px; text-align:right}
/* sync */
.sync{padding:18px; border-radius:16px; background:var(--panel-2); border:1px solid var(--line)}
.bar{height:12px; border-radius:6px; background:color-mix(in srgb,var(--fg) 12%,transparent); overflow:hidden; margin:12px 0 8px}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#4C8DFF,#B078FF); border-radius:6px; transition:width .3s}
.bar.ind i{width:35%; animation:ind 1.2s ease-in-out infinite} @keyframes ind{0%{margin-left:-35%} 100%{margin-left:100%}}
.nums{display:flex; gap:22px; font:700 13px var(--display); color:var(--muted)} .nums b{font-size:20px; color:var(--fg); margin-right:4px}
.final{text-align:center; padding:4px 0} .final .big{font-size:52px; line-height:1.1} .final .row{justify-content:center; margin-top:16px} .final p{margin-left:auto; margin-right:auto}
@media (max-width:760px){ .hero{grid-template-columns:1fr} .modes{grid-template-columns:1fr} .top{flex-wrap:wrap} }
</style></head>

    if(CHK && !CHECKING && c.privacy==='private') h+='<div class="fix"><h3>'+esc(T.fixH)+'</h3><p>'+esc(T.fixP)+'</p><ol><li>'+esc(T.fix1)+'</li><li>'+esc(T.fix2)+'</li><li>'+esc(T.fix3)+'</li><li>'+esc(T.fix4)+'</li></ol>'

    return h+why(T.why,T.why1);

  if(i===2){
    var scr=(D.screens||[]).slice().sort(function(a,b){ return a.x-b.x || a.y-b.y; }), many=scr.length>1, h2='';
    if(many){

function render(){
  T=W[LANG]||W.en; document.documentElement.lang=LANG;
  $('tSub').textContent=T.sub; $('skip').textContent=T.skip; $('skip').style.display=cur===N-1?'none':'';
  var d=''; for(var k=0;k<N;k++) d+='<i class="'+(k<cur?'done':k===cur?'on':'')+'"></i>'; $('dots').innerHTML=d;
  var anim=render.last!==cur; render.last=cur;
  $('card').innerHTML='<section class="step on'+(anim?' anim':'')+'">'+stepHTML(cur)+'</section><div class="foot">'
    +(cur?'<button class="btn" id="back">'+esc(T.back)+'</button>':'')+'<small>'+(cur?esc(fmt(T.stepOf,{n:cur})):'')+'</small><span class="sp"></span>'
    +'<button class="btn gold" id="next">'+esc(cur===0?T.start:cur===N-1?T.finish:T.next)+'</button></div>';
  wire();
}
function go(i){ cur=Math.max(0,Math.min(N-1,i)); if(cur===1 && !CHK && !CHECKING) check(); if(cur===N-1) startSync(); render(); window.scrollTo(0,0); }
function check(){ CHECKING=true; post({action:'wz-check'});
  if(!HOST) setTimeout(function(){ window.fanfaraWizardCheck({steam:true, account:true, name:'Pjppo', avatar:'', privacy:qp('demo')==='private'?'private':'public', games:223}); }, 1300); }
function startSync(){
  if(D.syncing) return;
  if(D.syncState==='ok' && D.count>0) return;            // already imported: just show it
  if(D.syncState==='private' && !(CHK && CHK.privacy==='public')) return;   // still hidden: say so, don't hammer Steam
  D.syncing=true; SY=null; post({action:'sync'});
  if(!HOST){ var g=0; var t=setInterval(function(){ g=Math.min(140,g+10); window.fanfaraWizardSync({running:true,done:g,total:140,added:g*12}); if(g>=140){ clearInterval(t); window.fanfaraWizardSync({running:false,state:'ok',count:1727}); } },220); }
}
function wire(){
  var b=$('back'); if(b) b.onclick=function(){ go(cur-1); };
  $('next').onclick=function(){ if(cur<N-1) go(cur+1); else finish('home.html'); };
  Array.prototype.forEach.call(document.querySelectorAll('#langs [data-l]'),function(c){ c.onclick=function(){ LANG=c.dataset.l; post({action:'language', language:LANG}); render(); }; });
  if($('recheck')) $('recheck').onclick=function(){ check(); render(); };
  if($('openSteam')) $('openSteam').onclick=function(){ post({action:'open-privacy'}); };
  Array.prototype.forEach.call(document.querySelectorAll('.mon'),function(m){ m.onclick=function(){ D.monitor=m.dataset.m; post({action:'wz-monitor', monitor:D.monitor}); render(); }; });
  if($('test')) $('test').onclick=function(){ post({action:'test'}); if(!HOST) alert('🔔'); setTimeout(function(){ TESTED=true; if(cur===2){ var a=$('ask'); if(a) a.classList.add('on'); } }, 2500); };
  Array.prototype.forEach.call(document.querySelectorAll('#ask [data-a]'),function(x){ x.onclick=function(){ ANS=x.dataset.a; TESTED=true; render(); }; });
  if($('report')) $('report').onclick=function(){ location.href=page('feedback.html'); };
  function sw(id,fn){ var e=$(id); if(e) e.onclick=function(){ if(e.disabled) return; var on=!e.classList.contains('on'); e.classList.toggle('on',on); fn(on); }; }
  sw('swFix',function(on){ D.gameFix=on; post({action:'save', gameOverlayFix:on}); });
  sw('swStart',function(on){ D.startup=on; post({action:'save', startup:on}); });
  sw('swUpd',function(on){ D.checkUpdates=on; post({action:'save', checkUpdates:on}); });
  sw('swWorld',function(on){ D.joined=on; post({action:on?'lb-join':'lb-leave'}); });
  var v=$('vol'); if(v){ v.oninput=function(){ $('volN').textContent=v.value+'%'; }; v.onchange=function(){ D.volume=+v.value; post({action:'save', volume:D.volume}); }; }
  if($('volTest')) $('volTest').onclick=function(){ post({action:'test', volume:+$('vol').value}); };
  if($('toColl')) $('toColl').onclick=function(){ finish('collection.html'); };
  if($('toHome')) $('toHome').onclick=function(){ finish('home.html'); };
  if($('toStep1')) $('toStep1').onclick=function(){ CHK=null; go(1); };
  if($('retry')) $('retry').onclick=function(){ D.syncState=''; startSync(); render(); };
}
function finish(p){ if(HOST) post({action:'wz-done', page:p}); else location.href=page(p); }

window.fanfaraWizard=function(d){
  try{
    for(var k in d) D[k]=d[k];
    if(d.theme==='dark') document.documentElement.setAttribute('data-theme','dark'); else if(d.theme==='light') document.documentElement.removeAttribute('data-theme');
    if(d.lang && W[d.lang]) LANG=d.lang;
    if(cur===N-1) startSync();
    render();
  }catch(e){}
};
window.fanfaraWizardCheck=function(r){
  CHK=r||{}; CHECKING=false;
  // Steam now shows the achievements but the last import couldn't read them: start it again right away.
  if(CHK.privacy==='public' && (D.syncState==='private' || !D.count) && !D.syncing){ D.syncState=''; D.syncing=true; SY=null; post({action:'sync'}); }
  if(cur===1) render();
};
window.fanfaraWizardSync=function(st){
  if(!st) return;
  if(st.running){ D.syncing=true; if(st.total!=null) SY=st; }
  else { D.syncing=false; if(st.state!=null) D.syncState=st.state; if(st.count!=null) D.count=st.count; }
  if(cur===N-1) render();
};
$('theme').onclick=function(){
  var r=document.documentElement, dark=r.getAttribute('data-theme')==='dark';
  if(dark){ r.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} } else { r.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
  post({action:'theme', theme:themeNow()});
};
(function(){ var s=parseInt(qp('step'),10); if(s>=1 && s<N) go(s); else render(); })();
</script>
</body></html>
