    h+='<div class="rows">';
    if(c.unlock) h+='<div class="row">'+ico('cal')+'<div>'+esc(fullDate(c.unlock))+'<em>'+esc(ago(c.unlock))+'</em></div></div>';
    if(c.p!=null) h+='<div class="row">'+ico('gem')+'<div>'+esc(S.rank.replace('{n}',fmtN(rank)))+'<em>'+esc(S.rankOf.replace('{n}',fmtN(CARDS.length)))+'</em></div></div>';
    if(g && g.t>0) h+='<div class="row">'+ico('pad')+'<div style="flex:1;min-width:0">'+esc(S.prog.replace('{g}',c.game).replace('{u}',fmtN(Math.min(g.u,g.t))).replace('{t}',fmtN(g.t)))
      +'<div class="prog"><i style="width:'+Math.min(100,Math.round(g.u/g.t*100))+'%"></i></div></div></div>';
    h+='<div class="frw" data-app="'+(c.appid||0)+'">'+friendsRow(c)+'</div>';
    h+='</div></div>'+fx(c);
    return h;
  }

  // ---- friends who use Fanfara: who else has this achievement, and who got it first ----
  var FRIENDS={}, HOST=!!(window.chrome && window.chrome.webview);
  var IFR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>';
  function friendsRow(c){
    if(!c.appid || !c.api) return '';
    var d=FRIENDS[c.appid];
    if(d===undefined) return HOST ? '<div class="row fr wait"><span class="spin"></span><div>'+esc(S.frWait)+'</div></div>' : '';
    if(!d || !d.ok || !d.friends || !d.friends.length) return '';          // no Fanfara friends (or friends list private): stay quiet
    var owners=d.friends.filter(function(f){ return f.owns!==false; });
    if(!owners.length) return '<div class="row fr">'+IFR+'<div>'+esc(S.frNoGame)+'</div></div>';
    var have=owners.filter(function(f){ return f.ach && Object.prototype.hasOwnProperty.call(f.ach,c.api); })
      .map(function(f){ return {name:f.name||'', avatar:f.avatar||'', t:f.ach[c.api]||0}; })
      .sort(function(a,b){ return (a.t||9e9)-(b.t||9e9); });
    if(!have.length) return '<div class="row fr">'+IFR+'<div class="me1">'+esc(S.frNone)+'</div></div>';
    var av=have.slice(0,4).map(function(f){ return f.avatar ? '<img src="'+esc(f.avatar)+'" alt="" title="'+esc(f.name)+'">' : '<b title="'+esc(f.name)+'">'+esc((f.name||'?').charAt(0).toUpperCase())+'</b>'; }).join('');
    if(have.length>4) av+='<b>+'+(have.length-4)+'</b>';
    var line=(have.length===1?S.frHave1:S.frHave).replace('{n}',fmtN(have.length)).replace('{m}',fmtN(owners.length)), sub='';
    if(c.unlock){
      var before=have.filter(function(f){ return f.t && f.t<c.unlock; });
      sub = before.length ? esc(S.frPos.replace('{k}',before.length+1).replace('{name}',before[0].name)) : '<span class="me1">'+esc(S.frFirst)+'</span>';
    }
    return '<div class="row fr"><span class="av">'+av+'</span><div>'+esc(line)+(sub?'<em>'+sub+'</em>':'')+'</div></div>';
  }
  window.fanfaraFriendsAch=function(appid, raw){
    FRIENDS[appid]=raw||{ok:false};
    if(cur && cur.fly){ Array.prototype.forEach.call(cur.fly.querySelectorAll('.frw[data-app="'+appid+'"]'), function(el){
      el.innerHTML=friendsRow(cur.c); }); }
  };
  function askFriends(c){
    if(!HOST || !c.appid || !c.api || FRIENDS[c.appid]!==undefined) return;
    try{ window.chrome.webview.postMessage(JSON.stringify({action:'friends-ach', appid:c.appid})); }catch(e){}
  }

  // ---- sound: synthesised live (no audio files), soft air + a gentle cardboard "thup"; follows Fanfara's volume ----
  var AC=null, OUT=null, NOISE=null;
  function audio(){ try{ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); OUT=AC.createGain(); OUT.connect(AC.destination); }
    OUT.gain.value=VOL; if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
  function noise(ctx){ if(NOISE && NOISE.sampleRate===ctx.sampleRate) return NOISE; var len=ctx.sampleRate*1.5, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0); for(var k=0;k<len;k++) d[k]=Math.random()*2-1; NOISE=b; return b; }
  function whoosh(ctx,out,t0,dur,vol,hi){
    var s=ctx.createBufferSource(); s.buffer=noise(ctx);
    var f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;
    f.frequency.setValueAtTime(350,t0); f.frequency.exponentialRampToValueAtTime(hi,t0+dur*0.55); f.frequency.exponentialRampToValueAtTime(600,t0+dur);
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+dur*0.45); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t0); s.stop(t0+dur+0.05);
  }
  function thud(ctx,out,t0,vol){
    var s=ctx.createBufferSource(); s.buffer=noise(ctx);
    var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700; f.Q.value=0.5;
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.11);
    s.connect(f); f.connect(g); g.connect(out); s.start(t0); s.stop(t0+0.13);
    var o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(130,t0); o.frequency.exponentialRampToValueAtTime(70,t0+0.1);
    var g2=ctx.createGain(); g2.gain.setValueAtTime(0.0001,t0); g2.gain.exponentialRampToValueAtTime(vol*0.6,t0+0.01); g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.12);
    o.connect(g2); g2.connect(out); o.start(t0); o.stop(t0+0.14);
  }
  function shimmer(ctx,out,t0,t){
    var notes=t===4?[1568,1976,2349,2637,3136,3951]:t===3?[1760,2217,2637,3520]:[2093,2637];
    notes.forEach(function(fq,k){ var o=ctx.createOscillator(); o.type='sine'; o.frequency.value=fq; var g=ctx.createGain(), st=t0+k*0.055;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(t===4?0.09:0.07,st+0.01); g.gain.exponentialRampToValueAtTime(0.0001,st+(t===4?1.4:0.9));
      o.connect(g); g.connect(out); o.start(st); o.stop(st+1.5); });
    if(t===4){ var o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(55,t0+0.6);
      var g=ctx.createGain(); g.gain.setValueAtTime(0.28,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.7); o.connect(g); g.connect(out); o.start(t0); o.stop(t0+0.75); }
  }
  var SFX={
    open:function(ctx,out,dur,t){ var n=ctx.currentTime+0.01, s=dur/1000; whoosh(ctx,out,n+s*0.08,s*0.9,0.30,2200); thud(ctx,out,n+s*0.97,0.45); if(t>=2) shimmer(ctx,out,n+s*0.97,t); },
    flip:function(ctx,out){ var n=ctx.currentTime+0.01; whoosh(ctx,out,n,0.42,0.20,1800); thud(ctx,out,n+0.38,0.3); },
    close:function(ctx,out){ var n=ctx.currentTime+0.01; whoosh(ctx,out,n,0.5,0.15,1400); }
  };
  function sfx(name,a,b){ if(VOL<=0) return; var ctx=audio(); if(!ctx) return; try{ SFX[name](ctx,OUT,a,b); }catch(e){} }

  // ---- the animation ----
  var stage=document.getElementById('stage'), veil=document.getElementById('veil'), rays=stage.querySelector('.rays'), halo=stage.querySelector('.halo'),
      flash=stage.querySelector('.flash'), hint=document.getElementById('hint'), xb=document.getElementById('close');
  var cur=null, EASE='cubic-bezier(.2,.8,.2,1)', SPIN='cubic-bezier(.45,.05,.25,1)';
  function bigScale(){ var h=Math.min(innerHeight*0.80, 720), w=Math.min(innerWidth*0.86, h*5/7.3); return w/300; }
  function placeAt(r){ return 'translate('+r.left+'px,'+r.top+'px) scale('+(r.width/300)+')'; }
  function centre(){ var s=bigScale(), w=300*s, h=w*7.3/5; return 'translate('+((innerWidth-w)/2)+'px,'+((innerHeight-h)/2)+'px) scale('+s+')'; }
  function fade(el,to,dur,delay){ var o=parseFloat(getComputedStyle(el).opacity)||0; return el.animate([{opacity:o},{opacity:to}],{duration:dur, delay:delay||0, fill:'forwards'}); }
  function burst(t){
    flash.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale('+(t>=3?60:40)+')'}],{duration:700, easing:'ease-out'});
    if(t<3) return;
    for(var k=0, n=(t===4?28:14); k<n; k++){
      var p=document.createElement('span'); p.className='part'; stage.appendChild(p);
      var a=Math.random()*Math.PI*2, r=(t===4?260:180)+Math.random()*160;
      p.animate([{opacity:1, transform:'translate(0,0) scale(1)'},{opacity:0, transform:'translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) scale(.3)'}],
        {duration:900+Math.random()*500, easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=(function(el){ return function(){ el.remove(); }; })(p);
    }
  }
  function openCard(i){
    var c=CARDS[i]; if(!c || cur) return;
    var src=document.querySelector('#grid .ccard[data-i="'+i+'"]'); if(!src) return;
    var r=src.getBoundingClientRect(), t=c.ti, dur=REDUCE?1:950;
    stage.style.setProperty('--tier','var(--'+c.tier+')');
    var fly=document.createElement('div'); fly.className='fly';
    fly.innerHTML='<div class="tilt"><div class="flipper"><div class="fc ff"><div class="ccard tier-'+c.tier+'">'+face(c,'F'+i)+'</div></div>'
      +'<div class="fc fb"><div class="ccard rv tier-'+c.tier+'">'+backFace(c,i)+'</div></div></div></div>';
    stage.appendChild(fly); markLowRes(fly); askFriends(c);
    cur={key:c.key, i:i, c:c, fly:fly, flipper:fly.querySelector('.flipper'), tilt:fly.querySelector('.tilt'), back:false, t:t};
    resetCard(src); src.classList.add('gone'); stage.classList.add('on'); document.body.classList.add('opened');
    hint.innerHTML=esc(S.turn)+' · <kbd>Esc</kbd> '+esc(S.esc); xb.setAttribute('aria-label',S.close);
    sfx('open',dur,t);
    fade(veil,1,dur*0.5); fade(xb,1,300,dur*0.6); fade(hint,1,400,dur);
    var lift='translate('+(r.left-r.width*0.04)+'px,'+(r.top-r.height*0.06)+'px) scale('+(r.width/300*1.08)+')';
    fly.animate([{transform:placeAt(r)},{transform:lift, offset:.18},{transform:centre()}],{duration:dur, easing:EASE, fill:'forwards'});
    cur.flipper.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(0deg)', offset:.15},{transform:'rotateY(360deg)'}],{duration:dur, easing:SPIN, fill:'forwards'});
    var me=cur;
    setTimeout(function(){
      if(cur!==me) return;
      burst(t);
      if(t>=1) fade(halo, t>=3?0.9:0.55, 500);
      if(t>=3) fade(rays, t===4?0.75:0.4, 700);
      var fc=fly.querySelector('.ff .ccard'); if(fc) fc.animate([{filter:'brightness(1.9)'},{filter:'brightness(1)'}],{duration:600, easing:'ease-out'});
    }, Math.max(0,dur-60));
    cur.flipper.addEventListener('click',function(e){ e.stopPropagation(); turn(); });
    xb.focus({preventScroll:true});
  }
  function turn(){
    if(!cur) return; cur.back=!cur.back; sfx('flip');
    cur.flipper.animate([{transform:'rotateY('+(cur.back?0:180)+'deg)'},{transform:'rotateY('+(cur.back?180:360)+'deg)'}],{duration:REDUCE?1:650, easing:SPIN, fill:'forwards'});
  }
  function closeCard(){
    if(!cur) return; var k=cur; cur=null;
    var dur=REDUCE?1:650, src=document.querySelector('#grid .ccard[data-k="'+(window.CSS&&CSS.escape?CSS.escape(k.key):k.key)+'"]');
    sfx('close');
    function done(){ k.fly.remove(); if(src) src.classList.remove('gone'); stage.classList.remove('on'); document.body.classList.remove('opened'); }
    if(k.back) k.flipper.animate([{transform:'rotateY(180deg)'},{transform:'rotateY(360deg)'}],{duration:dur*0.6, easing:EASE, fill:'forwards'});
    if(src){ var r=src.getBoundingClientRect(); k.fly.animate([{transform:centre()},{transform:placeAt(r)}],{duration:dur, easing:EASE, fill:'forwards'}).onfinish=done; }
    else k.fly.animate([{opacity:1},{opacity:0}],{duration:dur*0.6, fill:'forwards'}).onfinish=done;   // its page was re-rendered: just fade
    [veil,rays,halo,xb,hint].forEach(function(el){ fade(el,0,dur*0.8); });
  }
  document.getElementById('grid').addEventListener('click',function(e){ var card=e.target.closest('.ccard'); if(!card) return; openCard(+card.dataset.i); });
  veil.addEventListener('click',closeCard); xb.addEventListener('click',closeCard);
  document.addEventListener('keydown',function(e){
    if(!cur) return;
    if(e.key==='Escape') closeCard();
    else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); turn(); }
  });
  stage.addEventListener('pointermove',function(e){
    if(!cur || REDUCE) return; var px=e.clientX/innerWidth-.5, py=e.clientY/innerHeight-.5;
    cur.tilt.style.transform='rotateX('+(-py*10).toFixed(2)+'deg) rotateY('+(px*14).toFixed(2)+'deg)';
    cur.fly.style.setProperty('--mx',((px+.5)*100).toFixed(1)+'%'); cur.fly.style.setProperty('--my',((py+.5)*100).toFixed(1)+'%');
    Array.prototype.forEach.call(cur.fly.querySelectorAll('.glare'),function(g){ g.style.opacity='1'; });
  });
  window.addEventListener('resize',function(){ if(cur) cur.fly.animate([{transform:centre()}],{duration:1, fill:'forwards'}); });

  (function(){
    var root=document.documentElement;
    document.getElementById('theme').addEventListener('click',function(){
      var dark=root.getAttribute('data-theme')==='dark';
      if(dark){ root.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} }
      else { root.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
      try{ window.chrome.webview.postMessage(JSON.stringify({action:'theme', theme:(root.getAttribute('data-theme')==='dark'?'dark':'light')})); }catch(e){}
      updateBack();
    });
    document.getElementById('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b)return; active=b.dataset.f; page=0; chips(); render(); });
  })();

  (function(){ var m=location.search.match(/[?&]lang=([a-z]{2})/); setLang(m?m[1]:'it'); count(); chips(); render(); })();
</script>
