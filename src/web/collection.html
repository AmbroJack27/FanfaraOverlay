<style>

  *{box-sizing:border-box} html,body{height:100%}

      +'<path d="M150 56 L226 86 Q226 184 150 240 Q74 184 74 86 Z" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.22"/>';
    return '<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'
      +'<radialGradient id="'+bg+'" cx="50%" cy="42%" r="80%"><stop offset="0%" stop-color="'+a+'" stop-opacity="0.85"/><stop offset="46%" stop-color="'+a+'" stop-opacity="0.32"/><stop offset="100%" stop-color="#05070d"/></radialGradient>'
      +'<linearGradient id="'+sh+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+a+'" stop-opacity="0.9"/><stop offset="60%" stop-color="'+a+'" stop-opacity="0.45"/><stop offset="100%" stop-color="#0a0d16" stop-opacity="0.92"/></linearGradient>'
      +'<radialGradient id="'+vg+'" cx="50%" cy="46%" r="72%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.5"/></radialGradient>'
      +'</defs><rect width="300" height="300" fill="#05070d"/><rect width="300" height="300" fill="url(#'+bg+')"/>'+shield+'<rect width="300" height="300" fill="url(#'+vg+')"/></svg>';
  }
  function artEm(c,i){
    var g=GLYPH[c.g]||GLYPH.star, a=c.accent, ink=c.ink, gl='gl'+i, ca='ca'+i;
    return '<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'
      +'<radialGradient id="'+ca+'" cx="50%" cy="44%" r="55%"><stop offset="0%" stop-color="'+ink+'" stop-opacity="0.6"/><stop offset="100%" stop-color="'+ink+'" stop-opacity="0"/></radialGradient>'
      +'<linearGradient id="'+gl+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="'+ink+'"/><stop offset="100%" stop-color="'+a+'"/></linearGradient>'
      +'</defs><circle cx="150" cy="142" r="74" fill="url(#'+ca+')"/>'
      +'<g transform="translate(150 146) scale(4.8) translate(-12 -12)" stroke="url(#'+gl+')" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))"><path d="'+g+'"/></g></svg>';
  }
  function emLayer(c,i){
    if(c.icon) return '<div class="layer em"><img src="'+esc(c.icon)+'" alt="" onerror="this.style.display=\'none\'"></div>';
    return '<div class="layer em">'+artEm(c,i)+'</div>';
  }
  function gems(t){ var s=''; for(var k=0;k<5;k++) s+='<i'+(k<=t?' class="on"':'')+'></i>'; return s; }
  var SPARKS=[[12,30,0],[80,22,.8],[22,72,1.6],[86,64,2.2],[50,12,1.1]];
  function fx(c){
    var t=c.ti, h='';
    if(t===2) h+='<div class="sweep"></div>';
    if(t>=3) h+='<div class="foil"></div>';
    if(t===4) SPARKS.forEach(function(p){ h+='<span class="spark" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:'+p[2]+'s"></span>'; });
    return h+'<div class="glare"></div>';
  }
  function hdrUrl(c){ return c.appid ? 'https://cdn.cloudflare.steamstatic.com/steam/apps/'+c.appid+'/header.jpg' : ''; }
  // One card. `big` = the popup version (full description + full unlock date).
  function face(c,i,big){
    var hdr=hdrUrl(c);
    return '<div class="in"><div class="hd"><div class="nm">'+esc(c.name)+'</div><div class="stars">'+gems(c.ti)+'</div></div>'
      +'<div class="win" style="--acc:'+c.accent+'">'+(hdr?'<div class="hdr" style="background-image:url(\''+hdr+'\')"></div>':'')+emLayer(c,i)+'</div>'
      +'<div class="ty">'+esc(c.game)+'</div>'
      +(c.desc?'<div class="tx">'+esc(c.desc)+'</div>':'<div class="tx"></div>')
      +'<div class="bt"><div class="pct">'+fmtPct(c.p)+'<small>'+esc(S.players)+'</small></div>'
      +(big?'':'<div class="date">'+esc(S.unl)+'<br>'+fmtDate(c.unlock)+'</div>')+'</div>'
      +(big && c.unlock?'<div class="unlock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'+esc(S.unlocked)+' '+fmtFull(c.unlock)+'</div>':'')
      +'</div>'+fx(c);
  }
  // Old games only have 64 px icons on Steam: mark those cards so the icon is shown smaller and sharpened.
  function markLowRes(root){
    Array.prototype.forEach.call(root.querySelectorAll('.layer.em img'), function(im){
      function chk(){ if(im.naturalWidth && im.naturalWidth<128){ var cd=im.closest('.ccard'); if(cd) cd.classList.add('lo'); } }
      if(im.complete) chk(); else im.addEventListener('load',chk);
    });
  }

  var CARDS=[], active='all', page=0; var PER=25;

  function setLang(l){ LANG=STR[l]?l:'en'; S=STR[LANG]||STR.en; TL=TIERLAB[LANG]||TIERLAB.en; LF=LABF[LANG]||LABF.en; LOCALE=LOCMAP[LANG]||'en-GB';
    document.documentElement.lang=LANG;
    document.getElementById('s-sub').textContent=S.sub; document.getElementById('t-title').textContent=S.title;
    document.getElementById('t-sub').textContent=S.subt; document.getElementById('foot').textContent=S.foot;
    document.getElementById('empty-big').textContent=S.emptyBig; document.getElementById('empty-sub').textContent=S.emptySub;
    updateBack();
  }
  function updateBack(){
    var t=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    document.getElementById('back').setAttribute('href','home.html?home=1&theme='+t+'&lang='+LANG);
  }

  window.fanfaraInit=function(payload){
    try{
      if(payload.theme==='dark') document.documentElement.setAttribute('data-theme','dark');
      else if(payload.theme==='light') document.documentElement.removeAttribute('data-theme');
      setLang(payload.lang||'it');
      CARDS=(payload.items||[]).map(function(r){
        var col=colorFor(r.game); var ti=tierIdx(r.p==null?null:r.p);
        return { name:r.name||'', game:r.game||'', desc:r.desc||'', p:(r.p==null?null:r.p), unlock:r.unlock||0, icon:r.icon||'', appid:r.appid||0,
          g:glyphFor(r.api||r.name), accent:col.accent, ink:col.ink, ti:ti, tier:TIERID[ti], tlab:TL[ti] };
      });
      CARDS.sort(function(a,b){ return (a.p==null?101:a.p)-(b.p==null?101:b.p); });
      count(); chips(); render();
    }catch(e){}
  };

  var ORDER=['all','legendary','epic','rare','uncommon','common'];
  function chips(){
    document.getElementById('chips').innerHTML=ORDER.map(function(id,idx){
      var lab=LF[idx];
      return '<button class="chip tier-'+id+(id==='all'?' all':'')+(id===active?' on':'')+'" data-f="'+id+'">'+lab+'</button>';
    }).join('');
  }
  function render(){
    var filtered=[];
    CARDS.forEach(function(c,i){ if(active==='all'||c.tier===active) filtered.push({c:c,i:i}); });
    var total=filtered.length, pages=Math.max(1,Math.ceil(total/PER));
    if(page>=pages) page=pages-1; if(page<0) page=0;
    var slice=filtered.slice(page*PER, page*PER+PER);

    var grid=document.getElementById('grid');
    grid.innerHTML=slice.map(function(o){ return '<div class="ccard tier-'+o.c.tier+'" data-i="'+o.i+'">'+face(o.c,o.i,false)+'</div>'; }).join('');
    markLowRes(grid);
    document.getElementById('empty').className = CARDS.length? 'empty':'empty show';
    Array.prototype.forEach.call(grid.querySelectorAll('.ccard'), function(card){ tiltCard(card,10); });

    var pager=document.getElementById('pager');
    if(total>PER){
      pager.style.display='flex';
      pager.innerHTML='<button id="prev"'+(page<=0?' disabled':'')+'>‹ '+S.prev+'</button>'
        +'<span class="info">'+S.pg.replace('{c}',page+1).replace('{t}',pages)+'</span>'
        +'<button id="next"'+(page>=pages-1?' disabled':'')+'>'+S.next+' ›</button>';
      document.getElementById('prev').onclick=function(){ if(page>0){page--; render(); window.scrollTo(0,0);} };
      document.getElementById('next').onclick=function(){ if(page<pages-1){page++; render(); window.scrollTo(0,0);} };
    } else pager.style.display='none';
  }
  function count(){
    var leg=CARDS.filter(function(c){return c.p!=null && c.p<1;}).length;
    document.getElementById('count').innerHTML=CARDS.length+' '+S.cards+' · <b>'+leg+' '+S.leg+'</b>';
  }

  var REDUCE=false; try{ REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var activeCard=null;
  function resetCard(card){
    if(!card) return;
    var em=card.querySelector('.layer.em'), g=card.querySelector('.glare');
    card.style.transition='transform .4s cubic-bezier(.2,.8,.2,1)'; card.style.transform='';
    if(em){ em.style.transition='transform .4s cubic-bezier(.2,.8,.2,1)'; em.style.transform=''; }
    if(g) g.style.opacity='0';
  }
  function tiltCard(card,max){
    if(REDUCE) return;
    var g=card.querySelector('.glare'), em=card.querySelector('.layer.em');
    card.addEventListener('pointermove',function(e){
      var r=card.getBoundingClientRect();
      if(r.width<10 || r.height<10) return;               // layout not ready — skip (prevents a stuck card)
      var px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      if(px<0||px>1||py<0||py>1) return;                  // pointer outside — ignore stray value
      activeCard=card;
      card.style.transition='transform .08s ease';
      card.style.transform='rotateX('+((0.5-py)*max).toFixed(2)+'deg) rotateY('+((px-0.5)*max).toFixed(2)+'deg) scale(1.04)';
      if(em){ var d=parseFloat(getComputedStyle(card).getPropertyValue('--depth'))||8; em.style.transition='transform .08s ease';
        em.style.transform='translate('+((px-0.5)*d).toFixed(1)+'px,'+((py-0.5)*d).toFixed(1)+'px)'; }
      card.style.setProperty('--mx',(px*100).toFixed(1)+'%'); card.style.setProperty('--my',(py*100).toFixed(1)+'%');
      if(g) g.style.opacity='1';
    });
    function leave(){ if(activeCard===card) activeCard=null; resetCard(card); }
    card.addEventListener('pointerleave',leave);
    card.addEventListener('pointercancel',leave);
  }
  // Scrolling while hovering can leave a card tilted — reset the active one on any scroll.
  window.addEventListener('scroll',function(){ var c=activeCard; activeCard=null; resetCard(c); }, true);

  var modal=document.getElementById('modal');
  function openCard(i){
    var c=CARDS[i]; if(!c) return;
    var dc=document.getElementById('dialogCard');
    dc.innerHTML='<div class="ccard big tier-'+c.tier+'">'+face(c,'M'+i,true)+'</div>';
    markLowRes(dc);
    modal.hidden=false;
    var big=document.getElementById('dialogCard').querySelector('.ccard'); if(big) tiltCard(big,12);
    document.getElementById('close').focus();
  }
  function closeCard(){ modal.hidden=true; }
  document.getElementById('grid').addEventListener('click',function(e){ var card=e.target.closest('.ccard'); if(!card)return; openCard(+card.dataset.i); });
  document.getElementById('close').addEventListener('click',closeCard);
  modal.addEventListener('click',function(e){ if(e.target.hasAttribute('data-close')) closeCard(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !modal.hidden) closeCard(); });

  (function(){
    var root=document.documentElement;
    document.getElementById('theme').addEventListener('click',function(){
      var dark=root.getAttribute('data-theme')==='dark';
      if(dark){ root.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} }
      else { root.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
      try{ window.chrome.webview.postMessage(JSON.stringify({action:'theme', theme:(root.getAttribute('data-theme')==='dark'?'dark':'light')})); }catch(e){}
      updateBack();
    });
    document.getElementById('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b)return; active=b.dataset.f; page=0; chips(); render(); });
  })();

  (function(){ var m=location.search.match(/[?&]lang=([a-z]{2})/); setLang(m?m[1]:'it'); count(); chips(); render(); })();
</script>
</body></html>
