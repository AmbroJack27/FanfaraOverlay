<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanfara — runtime</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Press+Start+2P&family=Share+Tech+Mono&family=Cinzel:wght@700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
  /* Transparent full-screen overlay. The C# host calls window.fanfara.show(...). All 15 styles
     and the full sound library are ported from the Fanfara prototype. Position is user-chosen. */
  :root{
    color-scheme: dark;
    --panel:#161c2b; --panel-2:#1d2437;
    --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.09);
    --common:#8A93A6; --uncommon:#4ac46a; --rare:#4C8DFF; --epic:#B078FF; --legendary:#F5C242;
    --display:'Oxanium', ui-sans-serif, system-ui, sans-serif;
    --body:'Archivo', ui-sans-serif, system-ui, sans-serif;
  }
  html,body{height:100%}
  body{margin:0; background:transparent; color:var(--fg); font-family:var(--body); overflow:hidden}

  .tier-common{--tier:var(--common)} .tier-uncommon{--tier:var(--uncommon)}
  .tier-rare{--tier:var(--rare)} .tier-epic{--tier:var(--epic)} .tier-legendary{--tier:var(--legendary)}

  /* ---------- notification zone: position chosen by the user ---------- */
  /* Global size of the whole overlay (layout + text scale together, crisply). Raise for bigger notifications. */
  :root{ --ui-scale:1.32; }
  #zone{position:fixed; z-index:5; display:flex; width:min(440px,calc(100% - 32px)); zoom:var(--ui-scale)}
  #zone.pos-bottom-center{left:50%; transform:translateX(-50%); bottom:clamp(60px,12vh,140px); justify-content:center}
  #zone.pos-top-center{left:50%; transform:translateX(-50%); top:clamp(40px,8vh,110px); justify-content:center}
  #zone.pos-center{left:50%; top:50%; transform:translate(-50%,-50%); justify-content:center}
  #zone.pos-top-right{right:28px; top:clamp(32px,7vh,90px); justify-content:flex-end}
  #zone.pos-bottom-right{right:28px; bottom:clamp(32px,7vh,90px); justify-content:flex-end}
  #zone.pos-top-left{left:28px; top:clamp(32px,7vh,90px); justify-content:flex-start}
  #zone.pos-bottom-left{left:28px; bottom:clamp(32px,7vh,90px); justify-content:flex-start}

  /* ===== STYLE 1 — CONSOLE ===== */
  .plaque{position:relative; width:100%; display:flex; align-items:center; gap:14px;
    padding:14px 18px 14px 15px; border-radius:15px; overflow:hidden;
    background:linear-gradient(150deg, rgba(29,36,55,.94), rgba(15,19,29,.96));
    border:1px solid var(--line); backdrop-filter:blur(8px); box-shadow:0 20px 50px -18px rgba(0,0,0,.75)}
  .plaque .accent{position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0;
    background:var(--tier); box-shadow:0 0 12px var(--tier)}
  .plaque .icon{flex:0 0 auto; width:52px; height:52px; border-radius:13px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(150deg, color-mix(in srgb,var(--tier) 32%, var(--panel-2)), var(--panel-2));
    border:1px solid color-mix(in srgb,var(--tier) 45%, transparent)}
  .plaque .icon svg{width:26px;height:26px}
  .plaque .txt{min-width:0; flex:1 1 auto}
  .plaque .eyebrow{font:700 11px var(--display); letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  .plaque .name{font:700 20px var(--display); line-height:1.15; margin:2px 0 3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .plaque .meta{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .plaque .meta .rarity{color:var(--tier); font-weight:700}
  .plaque.tier-uncommon{border-color:color-mix(in srgb,var(--tier) 28%, transparent)}
  .plaque.tier-rare{border-color:color-mix(in srgb,var(--tier) 40%, transparent); box-shadow:0 20px 50px -18px rgba(0,0,0,.75), 0 0 22px -8px var(--tier)}
  .plaque.tier-epic{border-color:color-mix(in srgb,var(--tier) 50%, transparent); box-shadow:0 20px 50px -18px rgba(0,0,0,.75), 0 0 30px -8px var(--tier)}
  .plaque.tier-legendary{border-color:color-mix(in srgb,var(--tier) 62%, transparent); box-shadow:0 22px 54px -18px rgba(0,0,0,.8), 0 0 40px -6px var(--tier)}
  .plaque.enter{animation:rise .58s cubic-bezier(.18,.9,.24,1.08) both}
  .plaque.enter .icon{animation:pop .6s .04s cubic-bezier(.2,.85,.28,1.4) both}
  .plaque.enter .shine i{animation:sweep 1.05s .22s ease-out}
  .plaque.leave{animation:fall .42s ease-in forwards}
  @keyframes rise{from{opacity:0; transform:translateY(46px) scale(.955)} to{opacity:1; transform:translateY(0) scale(1)}}
  @keyframes pop{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)}}
  @keyframes fall{to{opacity:0; transform:translateY(26px) scale(.98)}}

  /* ===== STYLE 2 — MINIMAL ===== */
  .mini{position:relative; width:100%; display:flex; align-items:center; gap:10px; overflow:hidden;
    padding:9px 13px; border-radius:11px; backdrop-filter:blur(8px);
    background:linear-gradient(180deg, rgba(24,30,45,.92), rgba(15,19,29,.94));
    border:1px solid var(--line); box-shadow:0 12px 30px -14px rgba(0,0,0,.7)}
  .mini .m-accent{width:3px; align-self:stretch; border-radius:3px; background:var(--tier)}
  .mini .m-ico{flex:0 0 auto; width:24px; height:24px; color:var(--tier); display:grid; place-items:center}
  .mini .m-ico svg{width:19px; height:19px}
  .mini .m-name{font:600 14px var(--body); flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mini .m-rar{font:600 11px var(--display); letter-spacing:.03em; color:var(--tier); white-space:nowrap}
  .mini.tier-legendary,.mini.tier-epic{border-color:color-mix(in srgb,var(--tier) 34%, transparent)}
  .mini.enter{animation:slidein .4s cubic-bezier(.2,.8,.2,1) both}
  .mini.leave{animation:slideout .3s ease-in forwards}
  @keyframes slidein{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:translateX(0)}}
  @keyframes slideout{to{opacity:0; transform:translateX(24px)}}

  /* ===== STYLE 3 — ARCADE ===== */
  .arc{position:relative; width:100%; text-align:center; padding:14px 18px; border-radius:14px; overflow:hidden;
    background:linear-gradient(150deg, rgba(29,36,55,.94), rgba(13,17,26,.97));
    border:1px solid var(--line); backdrop-filter:blur(8px); box-shadow:0 20px 50px -18px rgba(0,0,0,.78)}
  .arc > *{position:relative; z-index:1}
  .arc.tier-uncommon{border-color:color-mix(in srgb,var(--tier) 28%, transparent)}
  .arc.tier-rare{border-color:color-mix(in srgb,var(--tier) 40%, transparent); box-shadow:0 20px 50px -18px rgba(0,0,0,.78), 0 0 24px -8px var(--tier)}
  .arc.tier-epic{border-color:color-mix(in srgb,var(--tier) 50%, transparent); box-shadow:0 20px 50px -18px rgba(0,0,0,.78), 0 0 32px -8px var(--tier)}
  .arc.tier-legendary{border-color:color-mix(in srgb,var(--tier) 62%, transparent); box-shadow:0 22px 54px -18px rgba(0,0,0,.82), 0 0 44px -6px var(--tier)}
  .arc .a-bar{height:2px; width:58%; margin:0 auto 9px; background:linear-gradient(90deg,transparent,var(--tier),transparent); box-shadow:0 0 16px var(--tier)}
  .arc .a-bar.b2{margin:9px auto 0}
  .arc .a-label{font:700 13px var(--display); letter-spacing:.42em; text-transform:uppercase; color:var(--tier); margin-left:.42em}
  .arc .a-name{font:800 clamp(20px,4.4vw,29px) var(--display); line-height:1.05; margin:7px 0 9px; text-transform:uppercase;
    text-shadow:0 0 26px color-mix(in srgb,var(--tier) 55%, transparent)}
  .arc .a-rar{font:700 11.5px var(--display); letter-spacing:.15em; text-transform:uppercase; color:var(--muted)}
  .arc .a-rar b{color:var(--tier)}
  .arc.enter{animation:arcin .6s cubic-bezier(.15,.8,.2,1.05) both}
  .arc.enter .a-name{animation:arcname .6s .05s cubic-bezier(.2,.7,.2,1.3) both}
  .arc.enter .a-bar{animation:arcbar .6s ease-out both}
  .arc.leave{animation:arcout .4s ease-in forwards}
  @keyframes arcin{from{opacity:0; transform:scale(.85)} to{opacity:1; transform:scale(1)}}
  @keyframes arcname{from{opacity:0; transform:translateY(10px) scale(.92); letter-spacing:.18em} to{opacity:1; transform:none; letter-spacing:normal}}
  @keyframes arcbar{from{width:0; opacity:0} to{width:58%; opacity:1}}
  @keyframes arcout{to{opacity:0; transform:scale(1.04)}}
  .arc.flash::before{content:""; position:absolute; inset:0; z-index:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--tier) 40%, transparent), transparent 66%);
    animation:flash 1s ease-out forwards}

  /* ===== STYLE 4 — ARCADE 3D ===== */
  .a3{width:100%}
  .a3-stage{position:relative; width:100%; transform-style:preserve-3d; animation:a3-float 7s ease-in-out infinite}
  .a3-slab{position:relative; transform-style:preserve-3d; text-align:center; padding:20px 22px 18px; border-radius:16px;
    background:linear-gradient(160deg,#26304a,#0e131e 74%);
    border:1px solid color-mix(in srgb,var(--tier) 42%, rgba(255,255,255,.16));
    box-shadow:0 30px 60px -20px rgba(0,0,0,.85), 0 0 46px -12px var(--tier),
      inset 0 1px 0 rgba(255,255,255,.16), inset 0 -3px 10px rgba(0,0,0,.55)}
  .a3-slab::before{content:""; position:absolute; inset:0; border-radius:inherit; transform:translateZ(-18px);
    background:linear-gradient(160deg,#141a29,#080b12); box-shadow:0 26px 42px -16px rgba(0,0,0,.8)}
  .a3-slab::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; transform:translateZ(1px);
    background:linear-gradient(125deg, rgba(255,255,255,.15), transparent 42%)}
  .a3-glow{position:absolute; inset:0; border-radius:inherit; transform:translateZ(2px); pointer-events:none; opacity:.5;
    background:radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--tier) 32%, transparent), transparent 62%)}
  .a3-ico{position:relative; transform:translateZ(48px); color:var(--tier); display:inline-grid; place-items:center; margin-bottom:2px}
  .a3-ico svg{width:30px; height:30px; filter:drop-shadow(0 0 10px var(--tier))}
  .a3-bar{height:2px; width:58%; margin:6px auto 10px; transform:translateZ(14px);
    background:linear-gradient(90deg,transparent,var(--tier),transparent); box-shadow:0 0 16px var(--tier)}
  .a3-label{transform:translateZ(22px); font:700 12px var(--display); letter-spacing:.4em; text-transform:uppercase; color:var(--tier); margin-left:.4em}
  .a3-name{transform:translateZ(36px); font:800 clamp(21px,4.6vw,30px) var(--display); text-transform:uppercase; line-height:1.05; margin:8px 0 9px;
    text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 26px color-mix(in srgb,var(--tier) 60%, transparent)}
  .a3-rar{transform:translateZ(22px); font:700 11.5px var(--display); letter-spacing:.15em; text-transform:uppercase; color:var(--muted)}
  .a3-rar b{color:var(--tier)}
  .a3.tier-common .a3-glow{opacity:.28}
  .a3.tier-legendary .a3-slab{box-shadow:0 30px 66px -20px rgba(0,0,0,.9), 0 0 62px -8px var(--tier),
    inset 0 1px 0 rgba(255,255,255,.2), inset 0 -3px 10px rgba(0,0,0,.55)}
  @keyframes a3-float{0%{transform:perspective(1200px) rotateY(-10deg) rotateX(5deg)} 50%{transform:perspective(1200px) rotateY(10deg) rotateX(-3deg)} 100%{transform:perspective(1200px) rotateY(-10deg) rotateX(5deg)}}
  .a3.enter{animation:a3-in .7s cubic-bezier(.2,.8,.25,1.03) both}
  @keyframes a3-in{0%{opacity:0; transform:translateY(30px) scale(.9)} 100%{opacity:1; transform:translateY(0) scale(1)}}
  .a3.leave{animation:a3-out .45s ease-in forwards}
  @keyframes a3-out{to{opacity:0; transform:translateY(20px) scale(.96)}}
  .a3.flash .a3-glow{animation:a3-burst 1s ease-out}
  @keyframes a3-burst{0%{opacity:.5} 25%{opacity:1} 100%{opacity:.5}}

  /* ===== STYLE 5 — SCUDO 3D ===== */
  .sh{width:min(320px, calc(100% - 32px))}
  .sh-stage{position:relative; width:100%; transform-style:preserve-3d; animation:a3-float 7s ease-in-out infinite}
  .sh-svg{display:block; width:100%; height:auto; color:var(--tier);
    filter:drop-shadow(0 14px 16px rgba(0,0,0,.6)) drop-shadow(0 0 12px color-mix(in srgb,var(--tier) 55%, transparent))}
  .sh-edge{fill:color-mix(in srgb,var(--tier) 42%, #05070c)}
  .sh-rim{fill:none; stroke:currentColor; stroke-width:3; stroke-linejoin:miter; stroke-miterlimit:6;
    filter:drop-shadow(0 0 3px color-mix(in srgb,var(--tier) 80%, transparent))}
  .sh.tier-legendary .sh-svg{filter:drop-shadow(0 16px 18px rgba(0,0,0,.66)) drop-shadow(0 0 22px color-mix(in srgb,var(--tier) 78%, transparent))}
  .sh-content{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center; padding:17% 23% 0}
  .sh-emblem{color:var(--tier); line-height:0}
  .sh-emblem svg{width:28px; height:28px; filter:drop-shadow(0 0 8px var(--tier))}
  .sh-divider{width:60%; height:2px; margin:5px auto 4px; background:linear-gradient(90deg,transparent,var(--tier),transparent); box-shadow:0 0 10px var(--tier)}
  .sh-name{font:800 clamp(14px,3.6vw,18px) var(--display); text-transform:uppercase; line-height:1.04; margin:0 0 2px; text-wrap:balance;
    text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 12px color-mix(in srgb,var(--tier) 55%, transparent)}
  .sh-rar{font:700 10px var(--display); letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
  .sh-rar b{color:var(--tier)}
  .sh.enter{animation:a3-in .7s cubic-bezier(.2,.8,.25,1.03) both}
  .sh.leave{animation:a3-out .45s ease-in forwards}
  .sh.flash .sh-svg{animation:sh-burst .9s ease-out}
  @keyframes sh-burst{0%{filter:drop-shadow(0 14px 16px rgba(0,0,0,.6)) drop-shadow(0 0 12px color-mix(in srgb,var(--tier) 55%, transparent))}
    30%{filter:drop-shadow(0 14px 16px rgba(0,0,0,.6)) drop-shadow(0 0 28px color-mix(in srgb,var(--tier) 95%, transparent)) brightness(1.22)}
    100%{filter:drop-shadow(0 14px 16px rgba(0,0,0,.6)) drop-shadow(0 0 12px color-mix(in srgb,var(--tier) 55%, transparent))}}

  /* ===== STYLE 6 — NASTRO ===== */
  .nb{width:100%; display:flex; justify-content:center}
  .nb-ribbon{position:relative; display:flex; align-items:center; gap:15px; padding:16px 44px;
    background:linear-gradient(180deg,#1c2336,#10141f); border-top:2px solid var(--tier); border-bottom:2px solid var(--tier);
    clip-path:polygon(0 0, 100% 0, calc(100% - 16px) 50%, 100% 100%, 0 100%, 16px 50%);
    box-shadow:0 14px 34px -14px rgba(0,0,0,.7), 0 0 24px -10px var(--tier)}
  .nb-emblem{color:var(--tier); line-height:0} .nb-emblem svg{width:30px;height:30px;filter:drop-shadow(0 0 6px var(--tier))}
  .nb-name{font:800 24px var(--display); text-transform:uppercase; line-height:1.1}
  .nb-rar{font:700 12px var(--display); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .nb-rar b{color:var(--tier)}
  .nb.enter{animation:nb-in .5s cubic-bezier(.2,.8,.25,1.05) both}
  @keyframes nb-in{0%{opacity:0; transform:scaleX(.15)} 60%{opacity:1} 100%{opacity:1; transform:scaleX(1)}}
  .nb.leave{animation:nb-out .38s ease-in forwards}
  @keyframes nb-out{to{opacity:0; transform:scaleX(.4)}}

  /* ===== STYLE 7 — PIXEL ===== */
  .px{width:100%; display:flex; justify-content:center}
  .px-box{max-width:380px; background:#0b0f18; border:4px solid var(--tier); padding:20px 22px; text-align:center;
    box-shadow:0 0 0 4px #05070c, 8px 8px 0 0 rgba(0,0,0,.5), 0 0 22px -6px var(--tier)}
  .px-emblem{color:var(--tier); line-height:0} .px-emblem svg{width:30px;height:30px}
  .px-name{font:400 13px 'Press Start 2P', monospace; color:#fff; line-height:1.55; margin:12px 0 9px; text-transform:uppercase; word-break:break-word}
  .px-rar{font:400 9.5px 'Press Start 2P', monospace; color:var(--tier); line-height:1.6}
  .px.enter{animation:px-in .4s steps(4,end) both}
  @keyframes px-in{0%{opacity:0; transform:scale(.4)} 100%{opacity:1; transform:scale(1)}}
  .px.leave{animation:px-out .2s steps(3,end) forwards}
  @keyframes px-out{to{opacity:0; transform:scale(.6)}}

  /* ===== STYLE 8 — NEON ===== */
  .ne{width:100%; display:flex; justify-content:center}
  .ne-card{position:relative; overflow:hidden; padding:24px 30px; text-align:center; border-radius:4px; width:100%;
    background:linear-gradient(180deg,#150e28,#0a0716); border:2px solid var(--tier);
    box-shadow:0 0 18px var(--tier), inset 0 0 18px color-mix(in srgb,var(--tier) 30%, transparent)}
  .ne-grid{position:absolute; left:-20%; right:-20%; bottom:-12px; height:52%; opacity:.5; pointer-events:none;
    background:repeating-linear-gradient(90deg, color-mix(in srgb,var(--tier) 45%, transparent) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(0deg, color-mix(in srgb,var(--tier) 45%, transparent) 0 1px, transparent 1px 16px);
    transform:perspective(200px) rotateX(62deg); transform-origin:bottom}
  .ne-emblem{position:relative; color:var(--tier); line-height:0} .ne-emblem svg{width:30px;height:30px; filter:drop-shadow(0 0 8px var(--tier))}
  .ne-name{position:relative; font:800 26px var(--display); text-transform:uppercase; color:#fff; margin-top:6px;
    text-shadow:0 0 8px var(--tier), 0 0 18px var(--tier)}
  .ne-rar{position:relative; font:700 12.5px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--tier); text-shadow:0 0 8px var(--tier)}
  .ne.enter{animation:ne-in .5s ease-out both}
  @keyframes ne-in{0%{opacity:0; transform:translateY(16px) scale(.96); filter:brightness(2.2)} 100%{opacity:1; transform:none; filter:brightness(1)}}
  .ne.leave{animation:a3-out .4s ease-in forwards}

  /* ===== STYLE 9 — TERMINALE ===== */
  .tm{width:100%}
  .tm-panel{background:rgba(6,10,8,.92); border:1px solid var(--tier); border-left:3px solid var(--tier); padding:15px 18px;
    font-family:'Share Tech Mono', ui-monospace, monospace; box-shadow:0 10px 30px -12px rgba(0,0,0,.8), 0 0 20px -8px var(--tier)}
  .tm-head{font-size:12px; letter-spacing:.2em; color:var(--tier); margin-bottom:8px; opacity:.85}
  .tm-line{font-size:17px; color:#d4f0e0; line-height:1.5} .tm-name{color:var(--tier); font-weight:700}
  .tm-dim{color:var(--muted); font-size:14px; margin-top:3px} .tm-dim b{color:var(--tier)}
  .tm-cur{color:var(--tier); animation:tm-blink 1s steps(1) infinite}
  @keyframes tm-blink{50%{opacity:0}}
  .tm.enter{animation:tm-in .32s steps(7,end) both}
  @keyframes tm-in{0%{opacity:0; clip-path:inset(0 100% 0 0)} 100%{opacity:1; clip-path:inset(0 0 0 0)}}
  .tm.leave{animation:a3-out .3s ease-in forwards}

  /* ===== STYLE 10 — LOOT ===== */
  .lt{position:relative; width:100%; display:flex; justify-content:center}
  .lt-beam{position:absolute; top:-150px; left:50%; width:120px; height:210px; transform:translateX(-50%); pointer-events:none; opacity:.8;
    background:linear-gradient(to top, color-mix(in srgb,var(--tier) 55%, transparent), transparent); filter:blur(7px)}
  .lt-card{position:relative; width:100%; display:flex; align-items:center; gap:16px; padding:16px 22px; border-radius:8px;
    background:linear-gradient(180deg, color-mix(in srgb,var(--tier) 18%, #12121a), #0a0a12);
    border:1px solid var(--tier); box-shadow:0 14px 34px -14px rgba(0,0,0,.75), 0 0 26px -8px var(--tier)}
  .lt-emblem{flex:0 0 auto; width:52px;height:52px;border-radius:9px;display:grid;place-items:center;color:var(--tier);
    background:color-mix(in srgb,var(--tier) 20%, #0a0a12); border:1px solid color-mix(in srgb,var(--tier) 45%, transparent)}
  .lt-emblem svg{width:28px;height:28px}
  .lt-info{min-width:0; text-align:left}
  .lt-kicker{font:700 10px var(--display); letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
  .lt-name{font:800 23px var(--display); text-transform:uppercase; color:#fff; line-height:1.1; margin:1px 0 2px;
    text-shadow:0 0 14px color-mix(in srgb,var(--tier) 55%, transparent)}
  .lt-rar{font:700 12.5px var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--tier)}
  .lt.enter{animation:lt-in .5s cubic-bezier(.2,.8,.25,1.05) both}
  @keyframes lt-in{0%{opacity:0; transform:translateY(22px) scale(.94)} 100%{opacity:1; transform:none}}
  .lt.enter .lt-beam{animation:lt-beam .7s ease-out both}
  @keyframes lt-beam{0%{opacity:0; transform:translateX(-50%) scaleY(.3)} 40%{opacity:.9} 100%{opacity:.5; transform:translateX(-50%) scaleY(1)}}
  .lt.leave{animation:a3-out .4s ease-in forwards}

  /* ===== 3D wrapper for the extra layouts ===== */
  .l3{width:100%; display:flex; justify-content:center}
  .l3-stage{position:relative; display:flex; justify-content:center; width:100%; transform-style:preserve-3d; animation:l3-float 7s ease-in-out infinite}

  /* ===== CD PROJEKT styles (unique box per game) ===== */
/* ===================== THE WITCHER ===================== */
  .wi{width:min(330px,100%);padding:17px 20px;position:relative;display:flex;align-items:center;gap:16px;overflow:hidden;border-radius:7px;
    background:
      radial-gradient(120px 90px at 20% 42%,rgba(217,140,58,.22),transparent 72%),

    border:1px solid #6a5a3a;box-shadow:0 16px 34px -12px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,220,160,.12),inset 0 0 40px rgba(0,0,0,.5)}
  .wi::before{content:"";position:absolute;inset:4px;border:1px solid rgba(201,160,90,.28);border-radius:5px;pointer-events:none}
  .wi .halo{position:absolute;left:14px;top:50%;width:92px;height:92px;transform:translateY(-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(180,210,255,.28),rgba(217,140,58,.14) 45%,transparent 70%);filter:blur(2px)}
  .wi .em{position:relative;width:60px;height:60px;flex:0 0 auto;color:#d8e6ff;filter:drop-shadow(0 0 10px rgba(150,200,255,.85)) drop-shadow(0 0 3px rgba(217,160,90,.6))}
  .wi .txt{position:relative}
  .wi .lab{font:700 10px 'Cinzel',serif;letter-spacing:.2em;text-transform:uppercase;color:#d9a34a}
  .wi .nm{font:900 20px 'Cinzel',serif;color:#f4ead2;line-height:1.05;text-shadow:0 1px 0 #0c0a08,0 0 14px rgba(180,210,255,.25)}
  .wi .rr{font:800 11px var(--body);color:#c9b48a;margin-top:3px;letter-spacing:.02em}
  .wi .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
  .wi .sheen i{position:absolute;top:-20%;left:-40%;width:34%;height:140%;transform:skewX(-18deg);
    background:linear-gradient(100deg,transparent,rgba(220,235,255,.22),transparent)}
  .wi .emb{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
  .wi .emb i{position:absolute;bottom:14%;width:4px;height:4px;border-radius:50%;background:#ffc46a;box-shadow:0 0 7px #ffb04a;opacity:0}
  .wi .emb i:nth-child(1){left:16%}.wi .emb i:nth-child(2){left:30%}.wi .emb i:nth-child(3){left:22%}.wi .emb i:nth-child(4){left:11%}
  .wi.enter{animation:wi-in .6s cubic-bezier(.2,.85,.3,1.05) both}
  .wi.enter::before{animation:wi-rune 3.4s ease-in-out infinite}
  .wi.enter .halo{animation:wi-glow 2.6s ease-in-out infinite}
  .wi.enter .em{animation:wi-cast .8s cubic-bezier(.2,.8,.2,1.1) both}
  .wi.enter .sheen i{animation:wi-sheen 3.6s .4s ease-in-out infinite}
  /* each Sign animates like its own magic, in its own colour */
  .wi.tier-common .em{color:#cfe0ff}
  .wi.tier-uncommon .em{color:#ff7a2e}
  .wi.tier-rare .em{color:#b885ff}
  .wi.tier-epic .em{color:#ffcf47}
  .wi.tier-legendary .em{color:#5fe0ff}
  .wi.enter.tier-common .em{animation:wi-cast .8s cubic-bezier(.2,.8,.2,1.1) both, sig-aard 2.4s .8s ease-out infinite}
  .wi.enter.tier-uncommon .em{animation:wi-cast .8s cubic-bezier(.2,.8,.2,1.1) both, sig-igni 1.15s .8s ease-in-out infinite}
  .wi.enter.tier-rare .em{animation:wi-cast .8s cubic-bezier(.2,.8,.2,1.1) both, sig-yrden 6s .8s linear infinite}
  .wi.enter.tier-epic .em{animation:wi-cast .8s cubic-bezier(.2,.8,.2,1.1) both, sig-quen 2.6s .8s ease-in-out infinite}
  .wi.enter.tier-legendary .em{animation:wi-cast .8s cubic-bezier(.2,.8,.2,1.1) both, sig-axii 5s .8s linear infinite}
  @keyframes sig-aard{0%,38%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(150,200,255,.7))}10%{transform:scale(1.17);filter:drop-shadow(0 0 18px rgba(170,215,255,1))}24%{transform:scale(.97)}}
  @keyframes sig-igni{0%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 8px rgba(255,120,40,.8)) brightness(1)}25%{transform:scale(1.08) rotate(-2.5deg);filter:drop-shadow(0 0 15px rgba(255,150,40,1)) brightness(1.3)}50%{transform:scale(.95) rotate(2.5deg);filter:drop-shadow(0 0 9px rgba(255,110,30,.9))}75%{transform:scale(1.06) rotate(-1.5deg);filter:drop-shadow(0 0 16px rgba(255,160,50,1)) brightness(1.25)}100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 8px rgba(255,120,40,.8)) brightness(1)}}
  @keyframes sig-yrden{0%{transform:rotate(0);filter:drop-shadow(0 0 9px rgba(170,110,255,.8))}50%{filter:drop-shadow(0 0 16px rgba(190,140,255,1))}100%{transform:rotate(360deg);filter:drop-shadow(0 0 9px rgba(170,110,255,.8))}}
  @keyframes sig-quen{0%,100%{transform:scale(1);filter:drop-shadow(0 0 9px rgba(255,200,80,.75))}50%{transform:scale(1.09);filter:drop-shadow(0 0 20px rgba(255,215,100,1))}}
  @keyframes sig-axii{0%{transform:rotate(0) scale(1);filter:drop-shadow(0 0 10px rgba(80,220,255,.85))}50%{transform:rotate(180deg) scale(1.06);filter:drop-shadow(0 0 20px rgba(120,235,255,1))}100%{transform:rotate(360deg) scale(1);filter:drop-shadow(0 0 10px rgba(80,220,255,.85))}}
  @keyframes wi-in{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  @keyframes wi-glow{0%,100%{opacity:.7;transform:translateY(-50%) scale(1)}50%{opacity:1;transform:translateY(-50%) scale(1.1)}}
  @keyframes wi-cast{0%{opacity:0;transform:scale(.3) rotate(-30deg);filter:brightness(2.4) drop-shadow(0 0 2px #cfe0ff)}100%{opacity:1;transform:none}}
  @keyframes wi-breathe{0%,100%{filter:drop-shadow(0 0 9px rgba(150,200,255,.7)) drop-shadow(0 0 3px rgba(217,160,90,.5));transform:scale(1)}50%{filter:drop-shadow(0 0 16px rgba(180,220,255,1)) drop-shadow(0 0 5px rgba(217,160,90,.8));transform:scale(1.05)}}
  @keyframes wi-rune{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes wi-sheen{0%{left:-40%}42%{left:130%}100%{left:130%}}
  /* legendary: silver wolf medallion glow + rising embers */
  .tier-legendary .wi{border-color:#b9c7e0;box-shadow:0 16px 34px -12px rgba(0,0,0,.85),0 0 32px -4px rgba(150,200,255,.5),inset 0 1px 0 rgba(255,220,160,.14)}

  @keyframes wi-ember{0%{opacity:0;transform:translateY(0) scale(.6)}18%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1)}}

  /* ===================== CYBERPUNK 2077 ===================== */
  .cp{width:min(330px,100%);padding:16px 18px;position:relative;display:flex;align-items:center;gap:15px;overflow:hidden;font-family:'Chakra Petch',sans-serif;
    background:linear-gradient(180deg,#121007,#060503);border:1px solid #fcee0a;
    clip-path:polygon(0 0,100% 0,100% 70%,90% 100%,0 100%)}
  .cp::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(252,238,10,.05) 0 2px,transparent 2px 4px);pointer-events:none}
  .cp .yl{position:absolute;right:0;top:0;bottom:0;width:8px;background:#fcee0a;box-shadow:-2px 0 10px rgba(252,238,10,.6)}
  .cp .glitch{position:absolute;left:0;right:0;top:26%;height:3px;background:#00e5ff;opacity:0;mix-blend-mode:screen}
  .cp .em{position:relative;width:52px;height:52px;flex:0 0 auto;filter:drop-shadow(0 0 8px currentColor)}
  .cp .lab{font:700 9px 'Share Tech Mono',monospace;letter-spacing:.24em;color:#00e5ff;position:relative}
  .cp .nm{font:800 19px 'Chakra Petch',sans-serif;color:#fcee0a;line-height:1.02;position:relative;
    text-shadow:2px 0 0 rgba(0,229,255,.6),-2px 0 0 rgba(255,0,90,.45)}
  .cp .rr{font:700 10.5px 'Share Tech Mono',monospace;letter-spacing:.12em;color:#fcee0a;margin-top:3px;position:relative}
  .cp.enter{animation:cp-in .5s both, cp-jump 4s 1s steps(1) infinite}
  .cp.enter::before{animation:cp-drift 1.4s linear infinite}
  .cp.enter .em{animation:cp-jolt .5s steps(3) both, cp-empulse 1.8s .5s ease-in-out infinite}
  .cp.enter .nm{animation:cp-shift .45s steps(2) both, cp-glitch 3.2s 1s steps(1) infinite}
  .cp.enter .glitch{animation:cp-scan 2.4s .2s ease-out infinite}
  .cp.enter .yl{animation:cp-barflick 2.2s ease-in-out infinite}
  @keyframes cp-in{0%{opacity:0;transform:translateX(16px) skewX(-6deg)}100%{opacity:1;transform:none}}
  @keyframes cp-jolt{0%{opacity:0;transform:translate(-5px,2px) scale(.7)}35%{opacity:.6;transform:translate(4px,-2px)}65%{opacity:.4;transform:translate(-2px,1px)}100%{opacity:1;transform:none}}
  @keyframes cp-shift{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:none}}
  @keyframes cp-scan{0%{opacity:0;top:8%}18%{opacity:.9}36%{opacity:0;top:92%}100%{opacity:0;top:92%}}
  @keyframes cp-drift{0%{background-position:0 0}100%{background-position:0 4px}}
  @keyframes cp-empulse{0%,100%{filter:drop-shadow(0 0 6px currentColor)}50%{filter:drop-shadow(0 0 13px currentColor)}}
  @keyframes cp-jump{0%,92%,100%{transform:none}93%{transform:translate(-2px,1px)}95%{transform:translate(2px,-1px)}97%{transform:translate(-1px,0)}}
  @keyframes cp-glitch{0%,88%,100%{transform:none;text-shadow:2px 0 0 rgba(0,229,255,.6),-2px 0 0 rgba(255,0,90,.45)}90%{transform:translateX(-3px);text-shadow:3px 0 0 rgba(0,229,255,.9),-3px 0 0 rgba(255,0,90,.7)}93%{transform:translateX(3px)}96%{transform:translateX(-1px)}}
  @keyframes cp-barflick{0%,100%{opacity:1}45%{opacity:.5}50%{opacity:.9}}
  .tier-legendary .cp{box-shadow:0 0 34px -4px rgba(255,176,42,.55)}

  .wi.leave,.cp.leave{animation:a3-out .4s ease-in forwards}
  @media (prefers-reduced-motion: reduce){ .wi.enter,.cp.enter,.wi.enter .em,.cp.enter .em,.wi .sheen i,.wi .emb i,.cp .glitch,.cp .yl{animation:none !important} }
  /* ===== BASE styles (original abstract, 3D) ===== */
/* shared centred layout for graphic styles */
  .cen{width:min(320px,100%);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;text-align:center}
  .cen .nm{font:900 18px var(--body);color:#fff;line-height:1.04;position:relative}
  .cen .rr{font:800 11px var(--body);margin-top:1px;position:relative;letter-spacing:.03em}

  /* 1 — ONDA : equaliser bars */
  .on{color:#46d6ff}
  .on .eq{display:flex;align-items:flex-end;gap:5px;height:66px}
  .on .eq i{width:7px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,currentColor,color-mix(in srgb,currentColor 30%,transparent));transform-origin:bottom;box-shadow:0 0 10px currentColor}
  .on .rr{color:#6fe0ff}
  .on.enter .eq i{animation:eqbar 1s ease-in-out infinite}
  .on.enter .nm,.on.enter .rr{animation:fade .5s .2s both}
  @keyframes eqbar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 2 — PULSAR : concentric sonar rings */
  .pu{color:#ff5aa0}
  .pu .pulse{position:relative;width:80px;height:80px;display:grid;place-items:center}
  .pu .pulse b{position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor}
  .pu .pulse i{position:absolute;inset:0;margin:auto;width:14px;height:14px;border:2px solid currentColor;border-radius:50%;opacity:0}
  .pu .rr{color:#ff86bd}
  .pu.enter .pulse i{animation:ring 2s ease-out infinite}
  .pu.enter .nm,.pu.enter .rr{animation:fade .5s .2s both}
  @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(5.4)}}

  /* 3 — MOSAICO : Bauhaus tile grid */
  .mo{width:min(320px,100%);padding:16px 18px;display:flex;align-items:center;gap:16px;border-radius:4px;position:relative;
    background:#121620;border:1px solid #3a4150;box-shadow:0 16px 32px -12px rgba(0,0,0,.8)}

  .mo .tiles span{border-radius:2px;background:#232a38;transform:scale(0)}
  .mo .nm{font:900 18px var(--body);color:#fff;line-height:1.05}
  .mo .lab{font:700 10px var(--body);letter-spacing:.18em;text-transform:uppercase;color:#8793a6}
  .mo .rr{font:800 11px var(--body);color:#e7edf5;margin-top:3px}
  .mo.enter .tiles span{animation:mopop .4s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes mopop{to{transform:scale(1)}}

  /* 4 — NUMERO : giant typographic numeral */
  .nu{width:min(320px,100%);min-height:150px;padding:16px 20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(180deg,#15171c,#0b0c0f);border:1px solid #2a2e36;border-radius:10px}
  .nu .big{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font:900 150px 'Archivo Black',sans-serif;line-height:.8;color:color-mix(in srgb,var(--tier) 26%,transparent);letter-spacing:-.04em}
  .nu .lab{font:700 10px 'Share Tech Mono',monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--tier);position:relative}
  .nu .nm{font:900 22px 'Archivo Black',sans-serif;color:#fff;line-height:1;position:relative;margin-top:2px}
  .nu .rr{font:700 11px 'Share Tech Mono',monospace;color:var(--muted);margin-top:4px;position:relative;letter-spacing:.1em}
  .nu.enter .big{animation:slamN .55s cubic-bezier(.2,.8,.2,1.2) both}
  .nu.enter .nm{animation:fade .5s .12s both}
  @keyframes slamN{0%{opacity:0;transform:translateY(-50%) scale(1.8)}100%{opacity:1;transform:translateY(-50%) scale(1)}}

  /* 5 — CARICA : progress / xp meter */
  .ca{width:min(320px,100%);padding:16px 18px;position:relative;border-radius:12px;
    background:linear-gradient(180deg,#0d1a12,#07120b);border:1px solid #2a7a4a;box-shadow:0 16px 32px -12px rgba(0,0,0,.8)}
  .ca .lab{font:700 10px 'Share Tech Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#4ade80}
  .ca .nm{font:900 18px var(--body);color:#eafff0;line-height:1.05;margin:2px 0 10px}
  .ca .bar{height:14px;border-radius:999px;background:#0a1f14;border:1px solid #1f4a30;overflow:hidden;position:relative}
  .ca .bar b{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#2ea65a,#5affa0);box-shadow:0 0 14px rgba(90,255,160,.7)}
  .ca .pips{display:flex;justify-content:space-between;margin-top:5px}
  .ca .pips i{width:2px;height:6px;background:#1f4a30;border-radius:1px}
  .ca .rr{font:800 11px var(--body);color:#5affa0;margin-top:6px;text-align:right}
  .ca.enter .bar b{animation:fill 1s .15s cubic-bezier(.3,.8,.3,1) forwards}
  @keyframes fill{from{width:0}to{width:var(--w)}}

  /* 6 — CORIANDOLI : confetti burst (light, playful) */
  .co{width:min(320px,100%);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;border-radius:16px;
    background:linear-gradient(180deg,#201a33,#14102a);border:1px solid #4a3a7a}
  .co .confetti{position:absolute;inset:0;pointer-events:none}
  .co .confetti i{position:absolute;top:44%;left:50%;width:8px;height:12px;border-radius:2px;opacity:0}
  .co .nm{position:relative;font:900 19px var(--body);color:#fff}
  .co .rr{position:relative;font:800 11px var(--body);color:#c9b8ff}
  .co.enter .confetti i{animation:conf .9s ease-out forwards}
  @keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}

  /* 7 — NEBULA : flowing aurora gradient */
  .ne{width:min(320px,100%);min-height:160px;padding:18px;position:relative;overflow:hidden;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;
    background:#0a0818;border:1px solid #3a2a6a}
  .ne .aur{position:absolute;inset:-30% -10%;background:
      radial-gradient(40% 50% at 30% 40%,rgba(120,90,255,.6),transparent 70%),
      radial-gradient(45% 55% at 70% 55%,rgba(60,200,220,.5),transparent 70%),
      radial-gradient(40% 50% at 55% 30%,rgba(255,90,170,.4),transparent 70%);
    filter:blur(10px)}
  .ne .lab{position:relative;font:700 10px var(--body);letter-spacing:.2em;text-transform:uppercase;color:#cbbcff}
  .ne .nm{position:relative;font:900 20px var(--body);color:#fff;line-height:1.04}
  .ne .rr{position:relative;font:800 11px var(--body);color:#bfeaff;margin-top:2px}
  .ne.enter .aur{animation:aur 7s ease-in-out infinite}
  .ne.enter .nm,.ne.enter .lab,.ne.enter .rr{animation:fade .6s .2s both}
  @keyframes aur{0%,100%{transform:translate(0,0) rotate(0) scale(1)}33%{transform:translate(6%,-4%) rotate(8deg) scale(1.08)}66%{transform:translate(-5%,4%) rotate(-6deg) scale(1.05)}}

  /* 8 — TRATTO : minimalist drawn line */
  .tt{width:min(320px,100%);min-height:150px;padding:18px 20px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px;
    background:#0d0f12;border:1px solid #23262c;border-radius:10px}
  .tt .ink{width:120px;height:40px;color:#f2f5f8}
  .tt .ink path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .tt .nm{font:900 18px var(--body);color:#f2f5f8}
  .tt .rr{font:700 11px 'Share Tech Mono',monospace;color:#7a828f;letter-spacing:.14em}
  .tt.enter .ink path{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.1s .2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* 9 — PIEGA : origami fold */
  .pg{width:min(320px,100%);min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative;
    background:linear-gradient(180deg,#1a1710,#0d0b07);border:1px solid #7a5e2a;border-radius:8px}
  .pg .fold{width:72px;height:72px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
  .pg .nm{font:900 18px var(--body);color:#f4e9d2}
  .pg .rr{font:800 11px var(--body);color:#e0b86a}
  .pg.enter .fold{animation:unfold .8s cubic-bezier(.2,.8,.3,1.05) both}
  @keyframes unfold{0%{opacity:0;transform:perspective(500px) rotateX(85deg) scale(.8)}100%{opacity:1;transform:none}}

  /* 10 — ORBITA : orbiting particles */
  .ob{color:#6aa8ff}
  .ob .orbit{position:relative;width:92px;height:92px;display:grid;place-items:center}
  .ob .orbit>b{position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor}
  .ob .orbit i{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,currentColor 40%,transparent)}
  .ob .orbit i::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;transform:translateX(-50%)}
  .ob .rr{color:#9ac4ff}
  .ob.enter .orbit i{animation:spin var(--sp,4s) linear infinite}
  .ob.enter .nm,.ob.enter .rr{animation:fade .5s .2s both}
  @keyframes spin{to{transform:rotate(360deg)}}

  .on.leave,.pu.leave,.mo.leave,.nu.leave,.ca.leave,.co.leave,.ne.leave,.tt.leave,.pg.leave,.ob.leave{animation:a3-out .4s ease-in forwards}
  /* leave + reduced-motion for package boxes */
  .ff.leave,.ct.leave,.cc.leave,.xg.leave,.vs.leave,.som.leave,.kh.leave,.tr.leave,.dx.leave,.ha.leave,.fz.leave,.gw.leave,.fb.leave,.ae.leave,.mc.leave,.ac.leave,.r6.leave,.gr.leave,.td.leave,.sc.leave,.fc.leave,.ry.leave,.an.leave{animation:a3-out .4s ease-in forwards}
  @media (prefers-reduced-motion: reduce){ .ff.enter,.ct.enter,.cc.enter,.xg.enter,.vs.enter,.som.enter,.kh.enter,.tr.enter,.dx.enter,.ha.enter,.fz.enter,.gw.enter,.fb.enter,.ae.enter,.mc.enter,.ac.enter,.r6.enter,.gr.enter,.td.enter,.sc.enter,.fc.enter,.ry.enter,.an.enter,
    .ff.enter .em,.ct.enter .em,.cc.enter .em,.xg.enter .em,.vs.enter .em,.som.enter .em,.kh.enter .em,.tr.enter .em,.dx.enter .em,.ha.enter .em,.fz.enter .em,.gw.enter .em,.fb.enter .em,.ae.enter .em,.mc.enter .em,.ac.enter .em,.r6.enter .em,.gr.enter .em,.td.enter .em,.sc.enter .em,.fc.enter .em,.ry.enter .em,.an.enter .em{animation:none !important} }
</style>

<body>
<div id="zone" class="pos-bottom-center"></div>
<script>
  const GLYPH = '<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">'+
    '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>'+
    '<path d="M4 22h16"/><path d="M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22"/>'+
    '<path d="M14 14.7V17c0 .6.5 1 1 1.2 1.1.6 2 2 2 3.8"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';

  const zone = document.getElementById("zone");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let style = "arcade", currentSound = "classic", current = null, timer = null, seqTok = 0;

  function tierFromPercent(p){
    if(p<1) return {id:"legendary", label:"Leggendario", fx:5};
    if(p<5) return {id:"epic", label:"Epico", fx:4};
    if(p<10) return {id:"rare", label:"Raro", fx:3};
    if(p<40) return {id:"uncommon", label:"Non comune", fx:2};
    return {id:"common", label:"Comune", fx:1};
  }

  function buildConsole(t){
    const el = document.createElement("div"); el.className = "plaque tier-"+t.id;
    el.innerHTML =
      '<span class="accent"></span><div class="icon">'+GLYPH+'</div>'+
      '<div class="txt"><div class="eyebrow">Obiettivo sbloccato</div>'+
      '<div class="name">'+t.name+'</div>'+
      '<div class="meta"><span class="rarity">'+t.label+'</span> · '+t.pct+' dei giocatori</div></div>'+
      '<div class="shine"><i></i></div><div class="sparks"></div>';
    return el;
  }
  function buildMinimal(t){
    const el = document.createElement("div"); el.className = "mini tier-"+t.id;
    el.innerHTML =
      '<span class="m-accent"></span><span class="m-ico">'+GLYPH+'</span>'+
      '<span class="m-name">'+t.name+'</span><span class="m-rar">'+t.label+'</span>';
    return el;
  }
  function buildArcade(t){
    const el = document.createElement("div"); el.className = "arc tier-"+t.id;
    el.innerHTML =
      '<div class="a-bar"></div><div class="a-label">Obiettivo sbloccato</div>'+
      '<div class="a-name">'+t.name+'</div>'+
      '<div class="a-rar"><b>'+t.label+'</b> · '+t.pct+' dei giocatori</div>'+
      '<div class="a-bar b2"></div><div class="sparks"></div>';
    return el;
  }
  function buildArcade3D(t){
    const el = document.createElement("div"); el.className = "a3 tier-"+t.id;
    el.innerHTML =
      '<div class="a3-stage"><div class="a3-slab">'+
        '<div class="a3-glow"></div><div class="a3-ico">'+GLYPH+'</div>'+
        '<div class="a3-bar"></div><div class="a3-label">Obiettivo sbloccato</div>'+
        '<div class="a3-name">'+t.name+'</div>'+
        '<div class="a3-rar"><b>'+t.label+'</b> · '+t.pct+' dei giocatori</div>'+
        '<div class="sparks"></div>'+
      '</div></div>';
    return el;
  }
  const SHIELD = {
    common:    "M50 6 L82 18 L82 58 L50 112 L18 58 L18 18 Z",
    uncommon:  "M30 6 L50 13 L70 6 L84 20 L82 60 L50 116 L18 60 L16 20 Z",
    rare:      "M50 6 L74 14 L92 12 L80 28 L82 60 L50 114 L18 60 L20 28 L8 12 L26 14 Z",
    epic:      "M50 3 L58 13 L72 7 L70 21 L88 20 L78 34 L82 60 L50 116 L18 60 L22 34 L12 20 L30 21 L28 7 L42 13 Z",
    legendary: "M50 2 L60 12 L78 5 L74 20 L96 15 L82 30 L90 46 L80 60 L50 118 L20 60 L10 46 L18 30 L4 15 L26 20 L22 5 L40 12 Z",
  };
  function buildShield(t){
    const d = SHIELD[t.id] || SHIELD.common;
    const el = document.createElement("div"); el.className = "sh tier-"+t.id;
    el.innerHTML =
      '<div class="sh-stage">'+
        '<svg class="sh-svg" viewBox="0 0 100 122" preserveAspectRatio="xMidYMid meet">'+
          '<defs>'+
            '<linearGradient id="shFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34415f"/><stop offset="1" stop-color="#0c111b"/></linearGradient>'+
            '<linearGradient id="shGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.24"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
          '</defs>'+
          '<path class="sh-edge" transform="translate(0 3.4)" d="'+d+'"/>'+
          '<path class="sh-body" d="'+d+'" fill="url(#shFace)"/>'+
          '<path class="sh-gloss" d="'+d+'" fill="url(#shGloss)"/>'+
          '<path class="sh-rim" d="'+d+'"/>'+
        '</svg>'+
        '<div class="sh-content">'+
          '<div class="sh-emblem">'+GLYPH+'</div>'+
          '<div class="sh-divider"></div>'+
          '<div class="sh-name">'+t.name+'</div>'+
          '<div class="sh-rar"><b>'+t.label+'</b> · '+t.pct+'</div>'+
        '</div>'+
        '<div class="sparks"></div>'+
      '</div>';
    return el;
  }
  function buildBanner(t){
    const el=document.createElement("div"); el.className="nb tier-"+t.id;
    el.innerHTML='<div class="nb-ribbon"><div class="nb-emblem">'+GLYPH+'</div>'+
      '<div class="nb-txt"><div class="nb-name">'+t.name+'</div>'+
      '<div class="nb-rar"><b>'+t.label+'</b> · '+t.pct+'</div></div></div><div class="sparks"></div>';
    return el;
  }
  function buildPixel(t){
    const el=document.createElement("div"); el.className="px tier-"+t.id;
    el.innerHTML='<div class="px-box"><div class="px-emblem">'+GLYPH+'</div>'+
      '<div class="px-name">'+t.name+'</div><div class="px-rar">'+t.label+' '+t.pct+'</div></div><div class="sparks"></div>';
    return el;
  }
  function buildNeon(t){
    const el=document.createElement("div"); el.className="ne tier-"+t.id;
    el.innerHTML='<div class="ne-card"><div class="ne-grid"></div><div class="ne-emblem">'+GLYPH+'</div>'+
      '<div class="ne-name">'+t.name+'</div><div class="ne-rar">'+t.label+' · '+t.pct+'</div></div>';
    return el;
  }
  function buildTerminal(t){
    const el=document.createElement("div"); el.className="tm tier-"+t.id;
    el.innerHTML='<div class="tm-panel"><div class="tm-head">▚ ACHIEVEMENT.SYS</div>'+
      '<div class="tm-line">&gt; unlock: <span class="tm-name">'+t.name+'</span><span class="tm-cur">_</span></div>'+
      '<div class="tm-line tm-dim">&gt; rarity: <b>'+t.label+'</b> // '+t.pct+'</div></div>';
    return el;
  }
  function buildLoot(t){
    const el=document.createElement("div"); el.className="lt tier-"+t.id;
    el.innerHTML='<div class="lt-beam"></div><div class="lt-card"><div class="lt-emblem">'+GLYPH+'</div>'+
      '<div class="lt-info"><div class="lt-kicker">Oggetto ottenuto</div>'+
      '<div class="lt-name">'+t.name+'</div><div class="lt-rar"><b>'+t.label+'</b> · '+t.pct+'</div></div></div><div class="sparks"></div>';
    return el;
  }
  function build3D(t, base){
    const inner = base(t);
    const el = document.createElement("div"); el.className = "l3 tier-"+t.id;
    const stage = document.createElement("div"); stage.className = "l3-stage";
    while(inner.firstChild) stage.appendChild(inner.firstChild);
    el.appendChild(stage);
    return el;
  }
  const STAR_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.5 6.1 20.4l1.1-6.45-4.7-4.6 6.5-.95z"/></svg>';
  const DIAMOND_SVG='<svg viewBox="0 0 24 24"><defs><linearGradient id="dgn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafcff"/><stop offset="0.5" stop-color="#9fe3ff"/><stop offset="1" stop-color="#4bb8e6"/></linearGradient></defs><g stroke="rgba(255,255,255,.55)" stroke-width="0.4"><path fill="url(#dgn)" d="M6 4 H18 L21 9 H3 Z"/><path fill="url(#dgn)" d="M3 9 H21 L12 21 Z"/></g><g stroke="rgba(255,255,255,.5)" stroke-width="0.4" fill="none"><path d="M6 4 L9 9 L12 21 M18 4 L15 9 L12 21 M9 9 H15"/></g></svg>';
  const TROPHY_METAL_SVG='<svg viewBox="0 0 24 24"><defs><linearGradient id="psmetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="0.35" stop-color="var(--metal)"/><stop offset="1" stop-color="var(--metal2)"/></linearGradient></defs><g fill="url(#psmetal)" stroke="rgba(0,0,0,.3)" stroke-width="0.4"><path d="M6 3 H18 V6.4 C18 10.6 15.3 13 12 13 C8.7 13 6 10.6 6 6.4 Z"/><path d="M11 12.8 H13 V15.6 H11 Z"/><path d="M8.2 15.5 H15.8 L16.9 18.6 H7.1 Z"/><path d="M6.5 18.6 H17.5 V20.3 H6.5 Z"/></g><path d="M6 4.6 C2.4 4.6 2.4 10.2 7 10.4 M18 4.6 C21.6 4.6 21.6 10.2 17 10.4" stroke="url(#psmetal)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>';
  const SPK='<div class="spk"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  const PS_METAL={common:"Bronzo",uncommon:"Argento",rare:"Oro",epic:"Oro",legendary:"Platino"};

  function buildXbox(t){
    const el=document.createElement("div"); el.className="xb tier-"+t.id;
    el.innerHTML='<div class="ring">'+(t.id==="legendary"?DIAMOND_SVG:STAR_SVG)+'</div>'+
      '<div class="xb-info"><div class="xb-lab">Obiettivo sbloccato</div>'+
      '<div class="xb-name">'+t.name+'</div><div class="xb-rar">'+t.label+' · '+t.pct+'</div></div>'+SPK;
    return el;
  }
  function buildPlaystation(t){
    const el=document.createElement("div"); el.className="ps tier-"+t.id;
    el.innerHTML='<div class="ps-tro">'+TROPHY_METAL_SVG+'</div>'+
      '<div class="ps-info"><div class="ps-lab">Trofeo sbloccato</div>'+
      '<div class="ps-name">'+t.name+'</div><div class="ps-mt">'+(PS_METAL[t.id]||"Bronzo")+' · '+t.pct+'</div></div>'+SPK;
    return el;
  }
  function buildSwitch(t){
    const el=document.createElement("div"); el.className="ni tier-"+t.id;
    el.innerHTML='<div class="ni-em">'+STAR_SVG+'</div>'+
      '<div class="ni-info"><div class="ni-lab">Obiettivo!</div>'+
      '<div class="ni-name">'+t.name+'</div><div class="ni-rar">'+t.label+' · '+t.pct+'</div></div>'+SPK;
    return el;
  }

  /* ===== package per-rarity emblems (ported from previews) ===== */
  function mhEmblem(i){return [
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 3 C8 6 5 13 7 21"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 3 C8 6 6 12 7 20"/><path d="M20 6 C15 9 13 14 14 21"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 21 C4 11 9 4 21 3 C14 7 13 13 12 21 Z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12 C8 6 16 5 22 4 C20 9 15 11 12 12 C16 13 19 15 21 20 C14 17 7 16 2 12 Z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8 L7 13 L12 4 L17 13 L21 8 L19.5 18 H4.5 Z"/><rect x="4.5" y="18.5" width="15" height="2.4"/><circle cx="12" cy="3.2" r="1.4"/></svg>'
][i];}
function mmEmblem(i){return [
  '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8" rx="1.8"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="9" width="16" height="6" rx="3"/><rect x="10.6" y="9" width="2.8" height="6" opacity=".4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 L5 13 H11 L10 22 L19 10 H12 Z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5.5" width="12" height="15" rx="2"/><rect x="9" y="2.5" width="6" height="3.2" rx="1"/><path d="M12.4 8 L9.6 14 H11.6 L10.8 18.5 L15 11.5 H12.2 Z" fill="#0f2746"/></svg>',
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 a8 8 0 0 1 8 8 v5 h-4.5 v-4 a3.5 3.5 0 0 0-7 0 v4 H4 v-5 a8 8 0 0 1 8-8 Z"/><circle cx="16" cy="8" r="1.4" fill="#0f2746"/></svg>'
][i];}
function ddEmblem(i){return [
  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2h2v12h-2z"/><path d="M7.5 13.5h9v2h-9z"/><rect x="11" y="15.5" width="2" height="5.5"/></svg>',

  let _rvb=null,_rvbSend=null;

      if(o.detune) osc.detune.value=(i-(a.length-1)/2)*o.detune; if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide,t0+dur);
      osc.connect(f); osc.start(t0); osc.stop(t0+dur+0.1); });
    const peak=o.gain||0.14, atk=o.attack||0.03; amp.gain.setValueAtTime(0.0001,t0); amp.gain.linearRampToValueAtTime(peak,t0+atk); amp.gain.exponentialRampToValueAtTime(0.0005,t0+dur);
    f.connect(amp); amp.connect(c.destination); const rs=c.createGain(); rs.gain.value=(o.reverb!=null?o.reverb:0.35)*peak*4; amp.connect(rs); rs.connect(reverbBus(c)); }

    osc.type="sine"; osc.frequency.value=freq*m; g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime((gain||0.18)*a,t0+0.006); g.gain.exponentialRampToValueAtTime(0.0005,t0+dur);
    osc.connect(g); g.connect(c.destination); const rs=c.createGain(); rs.gain.value=(rev!=null?rev:0.4)*(gain||0.18)*a*4; g.connect(rs); rs.connect(reverbBus(c)); osc.start(t0); osc.stop(t0+dur+0.05); }); }

  fl.type='lowpass';fl.frequency.setValueAtTime(4600,t0);fl.frequency.exponentialRampToValueAtTime(900,t0+0.22);fl.Q.value=4;
  gg.gain.setValueAtTime(0.0001,t0);gg.gain.linearRampToValueAtTime(g,t0+0.004);gg.gain.exponentialRampToValueAtTime(0.0004,t0+0.24);
  o.connect(fl);o2.connect(fl);fl.connect(gg);gg.connect(c.destination);
  const rs=c.createGain();rs.gain.value=0.2*g*4;gg.connect(rs);rs.connect(reverbBus(c));
  o.start(t0);o2.start(t0);o.stop(t0+0.32);o2.stop(t0+0.32);}
  function wiSfx(c,n,t){ voiceSweep(c,n,55,2.0,{types:['sawtooth','sine'],detune:7,gain:0.1,cutoff0:150,cutoff1:850,attack:0.32,vib:2.5,vibRate:4,breath:0.018,reverb:0.5});
    voiceSweep(c,n,82.4,2.0,{types:['triangle'],gain:0.05,cutoff0:200,cutoff1:1000,attack:0.38,vib:3,breath:0.012,reverb:0.5});
    [0.0,0.9].forEach(t=>voiceSweep(c,n+t,48,0.32,{types:['sine'],gain:0.08,cutoff0:120,cutoff1:200,attack:0.012,reverb:0.2}));
    const mel=[[293.7,0.0],[349.2,0.24],[440,0.48],[392,0.72],[587.3,1.0]];
    mel.forEach(([f,d])=>{ pluck(c,n+d,f,0.11); pluck(c,n+d,f*2,0.04); });
    bellR(c,n+0.55,880,1.4,0.045,0.55);
    if((t.fx===5)){
      [329.6,392,493.9].forEach(f=>voiceSweep(c,n+1.0,f,1.4,{types:['triangle','sine'],detune:5,gain:0.045,cutoff0:500,cutoff1:1700,attack:0.32,vib:3,breath:0.01,reverb:0.6}));
      voiceSweep(c,n+1.0,46,1.5,{types:['sine'],gain:0.09,cutoff0:120,cutoff1:420,reverb:0.5});
      pluck(c,n+1.3,880,0.1); pluck(c,n+1.3,1760,0.04); bellR(c,n+1.35,1318.5,1.3,0.05,0.6);
    } }
  function cpSfx(c,n,t){ // filtered whoosh riser into the hit
    voiceSweep(c,n,70,0.45,{types:['sawtooth'],gain:0.05,cutoff0:200,cutoff1:3200,fatk:0.42,attack:0.22,reverb:0.12});
    noiseB(c,n,0.42,0.05,1800);
    // sub impact with pitch drop
    voiceSweep(c,n+0.2,120,0.5,{types:['sine','sawtooth'],detune:10,gain:0.14,cutoff0:200,cutoff1:700,glide:48,reverb:0.12});
    // driving detuned saw bass ostinato (A1 / E1)
    [[55,0.22],[55,0.42],[73.4,0.6]].forEach(([f,t])=>voiceSweep(c,n+t,f,0.2,{types:['sawtooth','sawtooth'],detune:16,gain:0.1,cutoff0:200,cutoff1:1300,attack:0.005,reverb:0.1}));
    // bright arpeggio (A minor) with synthwave echo
    [440,523.3,659.3,880].forEach((f,k)=>{ const t=n+0.22+k*0.08; syn(c,t,f,0.08); syn(c,t+0.19,f,0.03); });
    // digital glitches
    noiseB(c,n+0.3,0.05,0.09,3600); noiseB(c,n+0.48,0.04,0.06,2400);

    if((t.fx===5)){

      voiceSweep(c,n+0.66,36,1.0,{types:['sine','sawtooth'],detune:8,gain:0.13,cutoff0:110,cutoff1:420,glide:30,reverb:0.1});
      noiseB(c,n+0.9,0.06,0.07,5000);

  /* BASE SFX */

  function moSfx(c,n,t){ const seq=[523.3,659.3,784,587.3,880]; const k=(t.fx===5)?5:4; for(let x=0;x<k;x++){ bellR(c,n+x*0.1,seq[x%seq.length],0.35,0.12,0.25); } if((t.fx===5))bellR(c,n+0.5,1046.5,0.5,0.1,0.3); }

  function coSfx(c,n,t){ noiseB(c,n,0.04,0.16,2000); voiceSweep(c,n,300,0.2,{types:['sine'],gain:0.1,cutoff1:1600,glide:900,attack:0.004,reverb:0.2}); const notes=[784,988,1318.5,1760,2093]; const k=(t.fx===5)?5:3; for(let x=0;x<k;x++){ bellR(c,n+0.08+x*0.06,notes[x],0.4,0.08,0.4); } if((t.fx===5)){noiseB(c,n+0.3,0.05,0.08,3500);bellR(c,n+0.4,2637,0.5,0.05,0.45);} }
  function neSfx(c,n,t){ [196,261.6,329.6,392].forEach(f=>voiceSweep(c,n,f,1.8,{types:['sine','triangle'],detune:5,gain:0.045,cutoff0:400,cutoff1:1900,attack:0.5,vib:2,breath:0.008,reverb:0.65})); bellR(c,n+0.4,1046.5,1.4,0.04,0.6); if((t.fx===5)){bellR(c,n+0.8,1568,1.2,0.04,0.6);voiceSweep(c,n+0.6,98,1.4,{types:['sine'],gain:0.07,cutoff1:500,reverb:0.5});} }
  function ttSfx(c,n,t){ noiseB(c,n,0.3,0.06,2600); noiseB(c,n+0.02,0.25,0.04,1600); voiceSweep(c,n+0.1,440,0.6,{types:['triangle'],gain:0.06,cutoff0:800,cutoff1:2200,attack:0.05,reverb:0.4}); if((t.fx===5))bellR(c,n+0.4,880,0.7,0.06,0.45); }
  function pgSfx(c,n,t){ [0,0.14,0.28].forEach((t,x)=>noiseB(c,n+t,0.12,0.05,1400+x*500)); voiceSweep(c,n+0.1,392,0.7,{types:['triangle','sine'],detune:4,gain:0.07,cutoff0:700,cutoff1:2000,attack:0.04,reverb:0.4}); bellR(c,n+0.34,784,0.7,0.06,0.4); if((t.fx===5))bellR(c,n+0.5,1176,0.6,0.05,0.45); }
