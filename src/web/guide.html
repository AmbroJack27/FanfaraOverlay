<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guida Fanfara</title>
<script>(function(){try{var m=location.search.match(/[?&]theme=(dark|light)/);var t=m?m[1]:(localStorage.getItem('fanfara-theme')||'dark');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
  :root{
    color-scheme: light;
    --bg:#eef1f7; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f3f6fb;
    --fg:#161c2b; --muted:#5b6478; --faint:#9aa3b5; --line:rgba(16,24,40,.12);
    --glow1:rgba(76,141,255,.10); --glow2:rgba(176,120,255,.08); --accent:#c8912a;
    --display:'Oxanium','Segoe UI',ui-sans-serif,system-ui,sans-serif;
    --body:'Archivo','Segoe UI',ui-sans-serif,system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0a0e17; --bg-2:#0d1220; --panel:#161c2b; --panel-2:#1d2437;
    --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.10);
    --glow1:rgba(76,141,255,.12); --glow2:rgba(176,120,255,.10); --accent:#F5C242;
  }
  *{box-sizing:border-box} html,body{height:100%}
  [hidden]{display:none!important}
  body{ margin:0; background:radial-gradient(1200px 600px at 80% -10%, var(--glow1), transparent 60%), radial-gradient(900px 500px at 0% 0%, var(--glow2), transparent 55%), var(--bg); color:var(--fg); font-family:var(--body); -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1300px; margin:0 auto; padding:0 28px }
  .top{ position:sticky; top:0; z-index:15; background:color-mix(in srgb,var(--bg-2) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
  .top .wrap{ display:flex; align-items:center; gap:12px; padding:14px 28px }
  .back{ cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--fg); font:700 12.5px var(--display); margin-right:4px; transition:.15s }
  .back:hover{ border-color:color-mix(in srgb,#4C8DFF 50%, var(--line)) }
  .back svg{ width:16px; height:16px }
  .brand{ display:flex; align-items:center; gap:11px }
  .brand .mk{ width:30px; height:30px; color:var(--accent) }
  .brand b{ font:800 18px/1 var(--display) } .brand span{ font:600 12px/1.3 var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); display:block }
  .tbtn{ margin-left:auto; cursor:pointer; display:grid; place-items:center; width:40px; height:40px; background:var(--panel); border:1px solid var(--line); border-radius:11px; color:var(--fg) }
  .tbtn svg{ width:18px; height:18px } .tbtn .moon{display:none} :root[data-theme="dark"] .tbtn .sun{display:none} :root[data-theme="dark"] .tbtn .moon{display:block}
  .intro{ margin:22px 0 16px } .intro h1{ margin:0; font:800 26px var(--display) } .intro p{ margin:4px 0 0; color:var(--muted); font-size:14.5px }
  .g-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; grid-auto-rows:1fr; padding-bottom:44px }
  .g-card{ --ac:#4C8DFF; display:flex; gap:15px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:17px 18px; transition:border-color .15s, transform .15s }
  .g-card:hover{ border-color:color-mix(in srgb,var(--ac) 45%, var(--line)); transform:translateY(-2px) }
  .g-ic{ flex:0 0 auto; width:46px; height:46px; border-radius:13px; display:grid; place-items:center; color:var(--ac); background:color-mix(in srgb,var(--ac) 16%, transparent); border:1px solid color-mix(in srgb,var(--ac) 32%, transparent) }
  .g-ic svg{ width:23px; height:23px }
  .g-tx{ min-width:0 } .g-tx h3{ margin:0 0 6px; font:800 16px var(--display); color:var(--fg) }
  .g-tx p{ margin:0 0 7px; font:400 13.5px/1.55 var(--body); color:var(--muted) } .g-tx p:last-child{ margin-bottom:0 }
</style></head>
<body>
<div class="top"><div class="wrap">
  <a class="back" id="back" href="home.html?home=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
  <div class="brand"><svg class="mk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><div><b>Fanfara</b><span id="s-sub">Guida</span></div></div>
  <button class="tbtn" id="theme" aria-label="Tema">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</div></div>

<div class="wrap">
  <div class="intro"><h1 id="t-title">Guida di Fanfara</h1><p id="t-sub">Tutto quello che puoi fare, spiegato semplice.</p></div>
  <div class="g-grid" id="grid"></div>
</div>

<script src="guide.js"></script>
<script>
  var TITLES={ it:['Guida di Fanfara','Tutto quello che puoi fare, spiegato semplice.'],
    en:['Fanfara Guide','Everything you can do, explained simply.'],
    fr:['Guide de Fanfara','Tout ce que tu peux faire, expliqué simplement.'],
    de:['Fanfara-Anleitung','Alles, was du tun kannst, einfach erklärt.'],
    es:['Guía de Fanfara','Todo lo que puedes hacer, explicado fácil.'] };
  var SUBS={ it:'Guida', en:'Guide', fr:'Guide', de:'Anleitung', es:'Guía' };
  var GUIDE_ICONS={
    welcome:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
    home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
    how:'<circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z"/>',
    style:'<path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h7M15 17h5"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="17" r="2"/>',
    position:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16M3 10h11"/>',
    history:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/><path d="M12 8v4l3 2"/>',
    collection:'<rect x="3" y="4" width="13" height="16" rx="2"/><path d="M8 2.5l10 2.2a2 2 0 0 1 1.5 2.4l-2.3 10.6"/>',
    sync:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
    language:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
    theme:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    startup:'<path d="M12 3v9M6.3 6.3a9 9 0 1 0 11.4 0"/>',
    games:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
    framegen:'<path d="M12 3l9 5-9 5-9-5zM3 14l9 5 9-5"/>',
    steamtip:'<path d="M8.7 3.5A5 5 0 0 1 17 7v4m0 3H4l2-2V7M15 18a3 3 0 0 1-6 0M3 3l18 18"/>',
    testsave:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
    opensource:'<path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/>'
  };
  var GUIDE_AC=['#4C8DFF','#B078FF','#F5C242','#4ac46a','#ff6b8b','#2fd0c6'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function L(){ try{ var p=location.search.match(/[?&]lang=([a-z]{2})/); if(p)return p[1]; }catch(e){} return 'it'; }
  function themeNow(){ return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; }
  function updateBack(){ document.getElementById('back').setAttribute('href','home.html?home=1&theme='+themeNow()+'&lang='+L()); }

  function render(){
    var lang = (window.FAN_GUIDE && FAN_GUIDE[L()]) ? L() : 'it';
    var g = (window.FAN_GUIDE && FAN_GUIDE[lang]) || [];
    document.documentElement.lang=lang;
    var t=TITLES[lang]||TITLES.it;
    document.getElementById('t-title').textContent=t[0]; document.getElementById('t-sub').textContent=t[1];
    document.getElementById('s-sub').textContent=SUBS[lang]||SUBS.it;
    document.getElementById('grid').innerHTML=g.map(function(s,i){
      var ic=GUIDE_ICONS[s.k]||GUIDE_ICONS.welcome, ac=GUIDE_AC[i%GUIDE_AC.length];
      return '<div class="g-card" style="--ac:'+ac+'">'
        +'<div class="g-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div>'
        +'<div class="g-tx"><h3>'+esc(s.h)+'</h3>'+(s.p||[]).map(function(x){return '<p>'+esc(x)+'</p>';}).join('')+'</div></div>';
    }).join('');
    updateBack();
  }

  document.getElementById('theme').addEventListener('click',function(){
    var root=document.documentElement, dark=themeNow()==='dark';
    if(dark){ root.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} }
    else { root.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
    try{ window.chrome.webview.postMessage(JSON.stringify({action:'theme', theme:themeNow()})); }catch(e){}
    updateBack();
  });

  render();
</script>
</body></html>
