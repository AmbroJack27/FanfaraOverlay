<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronologia Fanfara</title>
<script>(function(){try{var m=location.search.match(/[?&]theme=(dark|light)/);var t=m?m[1]:(localStorage.getItem('fanfara-theme')||'dark');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  /* app feel: no text selection or image dragging when holding the mouse (fields stay editable) */
  body{-webkit-user-select:none; user-select:none} img,svg,a{-webkit-user-drag:none} input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text}

  :root{
    color-scheme:light;
    --bg:#eef1f7; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f3f6fb; --panel-3:#e8edf6;
    --fg:#161c2b; --muted:#5b6478; --faint:#9aa3b5; --line:rgba(16,24,40,.12);
    --common:#6b7488; --uncommon:#2f9e4f; --rare:#2f6fe0; --epic:#8b43e0; --legendary:#B8860B; --gold:#c8912a;
    --heat0:#e3e8f1; --shadow:0 18px 40px -26px rgba(16,24,40,.45); --art:.16;
    --display:'Oxanium','Segoe UI',ui-sans-serif,system-ui,sans-serif;
    --body:'Archivo','Segoe UI',ui-sans-serif,system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0a0e17; --bg-2:#0d1220; --panel:#151b2a; --panel-2:#1b2234; --panel-3:#222a3f;
    --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.08);
    --common:#8A93A6; --uncommon:#4ac46a; --rare:#4C8DFF; --epic:#B078FF; --legendary:#F5C242; --gold:#F5C242;
    --heat0:#1a2133; --shadow:0 24px 50px -30px rgba(0,0,0,.8); --art:.28;
  }
  .t0{--tier:var(--common)} .t1{--tier:var(--uncommon)} .t2{--tier:var(--rare)} .t3{--tier:var(--epic)} .t4{--tier:var(--legendary)}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); line-height:1.45}
  .wrap{max-width:1240px; margin:0 auto; padding:0 28px}

  /* ---------- top bar ---------- */
  .top{position:sticky; top:0; z-index:20; background:var(--bg-2); border-bottom:1px solid var(--line)}
  .top .wrap{display:flex; align-items:center; gap:14px; height:64px}
  .back{cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--fg); font:700 12.5px var(--display)}
  .back:hover{border-color:color-mix(in srgb,var(--rare) 50%,var(--line))}
  .back svg{width:16px; height:16px}
  .brand{display:flex; align-items:center; gap:10px; min-width:0} .brand .mark{width:28px; height:28px; flex:0 0 auto; color:var(--gold)}
  .brand b{display:block; font:800 18px/1 var(--display)} .brand span{display:block; font:600 10.5px var(--display); letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:3px}
  .hdr-actions{margin-left:auto; display:flex; align-items:center; gap:10px}
  .local{display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font:600 11.5px var(--display); color:var(--muted); white-space:nowrap}
  .local svg{width:13px; height:13px; color:var(--uncommon)}
  .tbtn{cursor:pointer; width:36px; height:36px; display:grid; place-items:center; border-radius:10px; background:var(--panel); border:1px solid var(--line); color:var(--fg)}
  .tbtn svg{width:17px; height:17px} .tbtn .moon{display:none}
  :root[data-theme="dark"] .tbtn .sun{display:none} :root[data-theme="dark"] .tbtn .moon{display:block}

  /* ---------- shared bits ---------- */
  .ico{position:relative; flex:0 0 auto; width:52px; height:52px; border-radius:12px; padding:2px; display:grid; place-items:center; color:var(--tier);
    background:linear-gradient(145deg,color-mix(in srgb,var(--tier) 90%,#fff),color-mix(in srgb,var(--tier) 60%,#000)); box-shadow:0 0 0 1px color-mix(in srgb,var(--tier) 40%,transparent), 0 6px 16px -8px var(--tier)}
  .ico img{display:block; width:100%; height:100%; border-radius:10px; object-fit:cover; background:#0b0f18}
  .ico .ph{width:100%; height:100%; border-radius:10px; background:#0b0f18; display:grid; place-items:center} .ico .ph svg{width:24px; height:24px}
  .t4 .ico{box-shadow:0 0 0 1px var(--tier), 0 0 22px -4px var(--tier)}
  .gems{display:inline-flex; gap:3px; vertical-align:middle}
  .gems i{width:7px; height:7px; transform:rotate(45deg); border-radius:1px; background:color-mix(in srgb,var(--fg) 14%,transparent)}
  .gems i.on{background:var(--tier); box-shadow:0 0 5px color-mix(in srgb,var(--tier) 70%,transparent)}
  .pct{font:800 16px/1 var(--display); color:var(--tier); font-variant-numeric:tabular-nums}
  .tl{font:700 10px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--tier); white-space:nowrap}
  .hcard{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 20px; box-shadow:var(--shadow)}

  /* ---------- header: title, stats, 16-week calendar ---------- */
  .hero{display:grid; grid-template-columns:1fr auto; gap:22px; align-items:stretch; margin-top:24px}
  .h-title{font:800 26px/1.1 var(--display); margin:0}
  .h-sub{color:var(--muted); font-size:13.5px; margin-top:6px}
  .h-sub b{color:var(--fg)} .h-sub .rr{color:var(--tier); font-weight:700}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px}
  .st{background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0}
  .st small{display:block; font:700 10px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .st b{display:block; font:800 26px/1.15 var(--display); margin-top:4px; font-variant-numeric:tabular-nums}
  .st span{display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .st.rarest b{color:var(--legendary)}
  .st .mini{display:flex; align-items:flex-end; gap:3px; height:26px; margin-top:6px}
  .st .mini i{flex:1; border-radius:3px 3px 1px 1px; background:color-mix(in srgb,var(--uncommon) 75%,transparent); min-height:2px}
  .st .mini i.z{background:color-mix(in srgb,var(--fg) 10%,transparent)}
  .heat h4{margin:0 0 10px; font:700 11px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; gap:16px}
  .hm-months{display:flex; font:600 10px var(--display); color:var(--faint); margin-bottom:4px}
  .hm-months span{flex:0 0 16px; width:16px; overflow:visible; white-space:nowrap}
  .hm{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,13px); gap:3px}
  .hm i{width:13px; height:13px; border-radius:3px; background:var(--heat0)}
  .hm i.c{cursor:pointer} .hm i.c:hover{outline:2px solid var(--fg); outline-offset:1px}
  .hm i.sel{outline:2px solid var(--fg); outline-offset:1px}
  .l1{background:color-mix(in srgb,var(--gold) 30%,var(--heat0))!important} .l2{background:color-mix(in srgb,var(--gold) 55%,var(--heat0))!important}
  .l3{background:color-mix(in srgb,var(--gold) 80%,var(--heat0))!important} .l4{background:var(--gold)!important; box-shadow:0 0 6px color-mix(in srgb,var(--gold) 60%,transparent)}
  .hm-leg{display:flex; align-items:center; gap:4px; justify-content:flex-end; margin-top:8px; font-size:11px; color:var(--muted)}
  .hm-leg i{width:11px; height:11px; border-radius:3px; display:inline-block; background:var(--heat0)}

  /* ---------- filters (stay on top while scrolling) ---------- */
  .filters{position:sticky; top:64px; z-index:10; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 0; margin-top:10px; background:linear-gradient(var(--bg) 82%,transparent)}
  .search{flex:1 1 240px; display:flex; align-items:center; gap:9px; height:40px; padding:0 14px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--faint)}
  .search svg{width:15px; height:15px; flex:0 0 auto} .search input{flex:1; min-width:0; border:0; outline:0; background:none; color:var(--fg); font:500 13.5px var(--body)}
  .search:focus-within{border-color:color-mix(in srgb,var(--rare) 55%,transparent)}
  .fsel{height:38px; padding:0 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); color:var(--fg); font:600 12.5px var(--display); cursor:pointer}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 13px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font:600 12.5px var(--body); color:var(--muted); cursor:pointer}
  .chip i{width:8px; height:8px; transform:rotate(45deg); border-radius:1px; background:var(--tier)}
  .chip.on{color:var(--fg); border-color:color-mix(in srgb,var(--tier,var(--gold)) 70%,var(--line)); background:color-mix(in srgb,var(--tier,var(--gold)) 14%,var(--panel))}
  .chip.all{--tier:var(--gold)}
  .dayf{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 8px 0 13px; border-radius:999px; background:color-mix(in srgb,var(--gold) 16%,var(--panel)); border:1px solid color-mix(in srgb,var(--gold) 60%,var(--line)); font:700 12.5px var(--display)}
  .dayf button{width:22px; height:22px; border-radius:50%; border:0; background:color-mix(in srgb,var(--fg) 12%,transparent); color:var(--fg); cursor:pointer; font:700 12px var(--display); line-height:1}

  /* ---------- timeline ---------- */
  .tlay{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start}
  .line{position:relative; padding-left:86px; min-width:0}
  .line::before{content:""; position:absolute; left:70px; top:0; bottom:0; width:2px; background:linear-gradient(var(--line),color-mix(in srgb,var(--fg) 14%,transparent),var(--line))}
  .gday{position:sticky; top:132px; z-index:5; margin:20px 0 14px -86px; display:flex; align-items:center; gap:10px; pointer-events:none}
  .gday b{font:800 12px var(--display); letter-spacing:.06em; padding:6px 12px; border-radius:99px; background:var(--panel-3); border:1px solid var(--line); box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}
  .gday span{font-size:12px; color:var(--muted); padding:4px 9px; border-radius:8px; background:var(--bg)}
  .dgrp{position:relative}   /* each day keeps its own sticky label, so labels never pile up */
  .ev{position:relative; margin-bottom:10px}
  .ev .when{position:absolute; left:-86px; width:52px; top:22px; text-align:right; font:700 12.5px var(--display); color:var(--muted); font-variant-numeric:tabular-nums}
  .ev .dot{position:absolute; left:-22px; top:24px; width:12px; height:12px; border-radius:50%; background:var(--tier); box-shadow:0 0 0 4px var(--bg), 0 0 10px var(--tier)}
  .ev .box{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px}
  .ev .tx{flex:1; min-width:0}
  .ev .nm{font:700 14.5px/1.3 var(--display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ev .gm{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ev .gm b{color:var(--fg); font-weight:600}
  .ev .rt{flex:0 0 auto; text-align:right}
  .ev .rt .tl{margin-top:5px}
  .ev.big .dot{width:18px; height:18px; left:-25px; top:46px}
  .ev.big .when{top:44px}
  .ev.big .box{position:relative; overflow:hidden; padding:20px; min-height:112px; border-color:color-mix(in srgb,var(--tier) 55%,var(--line)); box-shadow:0 0 0 1px color-mix(in srgb,var(--tier) 25%,transparent), 0 20px 40px -24px var(--tier)}
  .ev.big .box .bgart{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:var(--art); filter:saturate(1.2)}
  .ev.big .box::before{content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(90deg,var(--panel) 25%,color-mix(in srgb,var(--panel) 60%,transparent) 70%,transparent)}
  .ev.big .box > :not(.bgart){position:relative; z-index:2}
  .ev.big .ico{width:68px; height:68px; border-radius:15px} .ev.big .ico img,.ev.big .ico .ph{border-radius:13px}
  .ev.big .nm{font-size:18px; white-space:normal}
  .ev.big .kick{font:800 10px var(--display); letter-spacing:.16em; color:var(--tier); text-transform:uppercase; margin-bottom:3px; display:flex; align-items:center; gap:7px}
  .ev.big .pct{font-size:20px}

  /* ---------- side column ---------- */
  .side{position:sticky; top:132px; display:flex; flex-direction:column; gap:14px}
  .side h4{margin:0 0 10px; font:700 11px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px}
  .cal h4 b{color:var(--fg); letter-spacing:.03em; font-size:13px; text-transform:capitalize; flex:1; text-align:center}
  .cal h4 button{width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--fg); cursor:pointer; font:700 13px var(--display)}
  .cal h4 button[disabled]{opacity:.35; cursor:default}
  .cal .ctot{display:block; text-align:center; font:600 11.5px var(--body); color:var(--muted); margin:-4px 0 10px; letter-spacing:0; text-transform:none}
  .cgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
  .cgrid .w{font:700 10px var(--display); color:var(--faint); text-transform:uppercase}
  .cgrid .d{position:relative; aspect-ratio:1; display:grid; place-items:center; border-radius:8px; font:600 12px var(--display); color:var(--muted)}
  .cgrid .d.has{color:var(--fg); background:color-mix(in srgb,var(--gold) calc(var(--k)*100%),var(--panel-2)); cursor:pointer}
  .cgrid .d.has:hover{outline:2px solid var(--fg); outline-offset:-2px}
  .cgrid .d.has.hi{color:#1a1205}
  .cgrid .d.today{box-shadow:inset 0 0 0 2px var(--gold)}
  .cgrid .d.sel{outline:2px solid var(--fg); outline-offset:-2px}
  .cgrid .d .rd{position:absolute; bottom:3px; width:5px; height:5px; border-radius:50%; background:var(--tier)}
  .drow{display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:8px; font-size:12.5px; margin-top:7px}
  .drow .bar{height:8px; border-radius:99px; background:color-mix(in srgb,var(--fg) 8%,transparent); overflow:hidden}
  .drow .bar i{display:block; height:100%; background:var(--tier); border-radius:99px}
  .drow b{font:700 12px var(--display); text-align:right}
  .trow{display:flex; align-items:center; gap:10px; margin-top:9px}
  .trow .th{width:64px; height:30px; border-radius:6px; object-fit:cover; background:#0b0f18; flex:0 0 auto}
  .trow div{flex:1; min-width:0; font:600 12.5px var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .trow b{font:800 13px var(--display); color:var(--gold)}
  .side .none{font-size:12.5px; color:var(--muted)}

  .more{display:flex; justify-content:center; margin:22px 0 10px}
  .more button{height:42px; padding:0 22px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:700 13px var(--display); cursor:pointer}
  .more button:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
  .nores{color:var(--muted); padding:40px 0; text-align:center; font-size:13.5px}
  .empty{text-align:center; color:var(--muted); padding:70px 20px; font-size:14px}
  .empty .big{font:700 17px var(--display); color:var(--fg); margin-bottom:8px}
  .foot-note{color:var(--faint); font-size:11.5px; text-align:center; padding:22px 0 36px}

  @media (max-width:1080px){ .hero{grid-template-columns:1fr} .heat{justify-self:start} }
  @media (max-width:980px){ .tlay{grid-template-columns:1fr} .side{display:none} .gday{position:static} }
  @media (max-width:720px){ .stats{grid-template-columns:repeat(2,1fr)} .wrap{padding:0 16px} .local{display:none} .heat{display:none} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style></head>

<div class="top"><div class="wrap">
  <a class="back" id="back" href="home.html?home=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
  <div class="brand">

<div class="wrap">
  <div id="main">

      <div class="hcard">

</div>

    es:{sub:'Historial',local:'Solo en este equipo',title:'Tu historial',search:'Buscar logro o juego…',all:'Todos',today:'Hoy',yday:'Ayer',
        foot:'Tu historial se guarda en tu ordenador y nunca sale de este dispositivo.',
        emptyBig:'Aún no hay logros',emptySub:'Juega con Fanfara abierto, o sincroniza tu historial desde el Inicio.',
        tdN:'Hoy has desbloqueado <b>{n}</b> {w}',tdRare:' · el más raro <span class="rr {t}">{name} {p}</span>',tdNone:'Hoy aún no hay logros.',
        kUnl:'Desbloqueados',sUnl:'con Fanfara',kRare:'El más raro',kGames:'Juegos',sGames:'con logros',kWeek:'Últimos 7 días',
        heat:'Últimas 16 semanas',less:'menos',more:'más',one:'logro',many:'logros',
        allDates:'Todas las fechas',thisWeek:'Últimos 7 días',thisMonth:'Este mes',moreDays:'Cargar más días',noRes:'Sin resultados para estos filtros.',
        kick:'Logro {t}',mRar:'Rareza del mes',mGames:'Juegos del mes',mNone:'Ningún logro este mes.',prevM:'Mes anterior',nextM:'Mes siguiente'}
  };
  var TIERLAB={ it:['Comune','Non comune','Raro','Epico','Leggendario'], en:['Common','Uncommon','Rare','Epic','Legendary'],
    fr:['Commun','Peu commun','Rare','Épique','Légendaire'], de:['Gewöhnlich','Ungewöhnlich','Selten','Episch','Legendär'],
    es:['Común','Poco común','Raro','Épico','Legendario'] };
  var LOCMAP={it:'it-IT',en:'en-GB',fr:'fr-FR',de:'de-DE',es:'es-ES'};
  var LANG='it', S=STR.it, TL=TIERLAB.it, LOCALE='it-IT';
  var CDN='https://cdn.cloudflare.steamstatic.com/steam/apps/';
  var TROPHY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function tierIdx(p){ if(p==null) return 0; if(p<1)return 4; if(p<5)return 3; if(p<10)return 2; if(p<40)return 1; return 0; }
  function fmtPct(p){ return p==null ? '—' : p.toLocaleString(LOCALE,{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
  function fmtTime(ep){ try{ return new Date(ep*1000).toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
  function dk(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function dkey(ep){ return dk(new Date(ep*1000)); }
  function words(n){ return n===1?S.one:S.many; }
  function gems(t){ var h=''; for(var i=0;i<5;i++) h+='<i'+(i<=t?' class="on"':'')+'></i>'; return '<span class="gems">'+h+'</span>'; }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function dayName(ep){ var d=new Date(ep*1000), n=new Date();
    var diff=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
    var full=cap(d.toLocaleDateString(LOCALE,{weekday:'long',day:'numeric',month:'long'}));
    if(d.getFullYear()!==n.getFullYear()) full=cap(d.toLocaleDateString(LOCALE,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
    return diff===0?{lab:S.today,sub:full}:diff===1?{lab:S.yday,sub:full}:{lab:full,sub:''}; }
  function rarest(list){ return list.reduce(function(a,r){ return (r.p!=null && (a==null||r.p<a.p))?r:a; },null); }
  function icon(r){ return '<span class="ico">'+(r.icon?'<img src="'+esc(r.icon)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<span class=ph>'+TROPHY.replace(/"/g,'&quot;')+'</span>\'">':'<span class="ph">'+TROPHY+'</span>')+'</span>'; }
  // big library picture of the game, falling back to the classic small one
  function heroImg(appid){ if(!appid) return ''; return '<img class="bgart" src="'+CDN+appid+'/library_hero.jpg" alt="" loading="lazy" onerror="this.onerror=function(){this.remove()};this.src=\''+CDN+appid+'/header.jpg\'">'; }

  var DATA=[], GAMES=[], FT=-1, WHEN='all', DAYF=null, SHOW=7, STEP=7, MON=null;

  function setLang(l){ LANG=STR[l]?l:'en'; S=STR[LANG]; TL=TIERLAB[LANG]; LOCALE=LOCMAP[LANG];
    document.documentElement.lang=LANG;
    $('s-sub').textContent=S.sub; $('s-local').textContent=S.local; $('t-title').textContent=S.title; $('q').placeholder=S.search;
    $('t-heat').textContent=S.heat; $('t-less').textContent=S.less; $('t-more').textContent=S.more; $('more').textContent=S.moreDays;
    $('foot').textContent=S.foot; $('empty-big').textContent=S.emptyBig; $('empty-sub').textContent=S.emptySub;
    updateBack(); }
  function updateBack(){ var t=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    $('back').setAttribute('href','home.html?home=1&theme='+t+'&lang='+LANG); }

  // called by the app with { theme, lang, items:[{name,game,desc,p,unlock,api,appid,icon}], games:[{appid,u,t,n,h}] }
  window.fanfaraInit=function(payload){
    try{
      if(payload.theme==='dark') document.documentElement.setAttribute('data-theme','dark');
      else if(payload.theme==='light') document.documentElement.removeAttribute('data-theme');
      setLang(payload.lang||'it');
      DATA=(payload.items||[]).filter(function(r){ return r.unlock; }).map(function(r){
        return { name:(r.name||'').trim(), game:r.game||'', desc:(r.desc||'').trim(), p:(r.p==null?null:r.p), unlock:r.unlock, icon:r.icon||'', appid:r.appid||0, t:tierIdx(r.p) };
      }).sort(function(a,b){ return b.unlock-a.unlock; });
      GAMES=payload.games||[];
      renderAll();
    }catch(e){}
  };

  function renderAll(){ header(); chips(); whenSel(); render(); }

  function header(){
    var now=Date.now()/1000, today=dkey(now);
    var td=DATA.filter(function(r){ return dkey(r.unlock)===today; }), tr=rarest(td);
    $('hsub').innerHTML = td.length ? S.tdN.replace('{n}',td.length).replace('{w}',words(td.length))
      +(tr? S.tdRare.replace('{t}','t'+tr.t).replace('{name}',esc(tr.name)).replace('{p}',fmtPct(tr.p)):'') : S.tdNone;
    var bars=[], mx=1; for(var i=6;i>=0;i--){ var k=dkey(now-i*86400), c=0; for(var j=0;j<DATA.length && DATA[j].unlock>now-8*86400;j++) if(dkey(DATA[j].unlock)===k) c++; bars.push(c); mx=Math.max(mx,c); }
    var wk=bars.reduce(function(a,b){return a+b;},0), ra=rarest(DATA);
    var games={}; DATA.forEach(function(r){ games[r.appid||r.game]=1; });
    var ng=Math.max(Object.keys(games).length, GAMES.filter(function(g){return g.u>0;}).length);
    $('stats').innerHTML=
      '<div class="st"><small>'+S.kUnl+'</small><b>'+DATA.length.toLocaleString(LOCALE)+'</b><span>'+S.sUnl+'</span></div>'+
      '<div class="st rarest"><small>'+S.kRare+'</small><b>'+(ra?fmtPct(ra.p):'—')+'</b><span>'+(ra?esc(ra.name)+' · '+esc(ra.game):'')+'</span></div>'+
      '<div class="st"><small>'+S.kGames+'</small><b>'+ng+'</b><span>'+S.sGames+'</span></div>'+
      '<div class="st"><small>'+S.kWeek+'</small><b>'+wk+'</b><div class="mini">'+bars.map(function(c){return '<i class="'+(c?'':'z')+'" style="height:'+Math.max(8,c/mx*100)+'%"></i>';}).join('')+'</div></div>';
    // 16 weeks, Monday first, ending this week
    var end=new Date(); end.setHours(0,0,0,0); var start=new Date(end); start.setDate(end.getDate()-((end.getDay()+6)%7)-15*7);
    var counts={}; DATA.forEach(function(r){ var k=dkey(r.unlock); counts[k]=(counts[k]||0)+1; });
    var h='', months='', tot=0, lastM=-1;
    for(var w=0; w<16; w++){ var f=new Date(start); f.setDate(start.getDate()+w*7);
      var lab=''; if(f.getMonth()!==lastM){ if((w>0 || f.getDate()<=8) && w<15) lab=f.toLocaleDateString(LOCALE,{month:'short'}); lastM=f.getMonth(); }
      months+='<span>'+esc(lab)+'</span>';
      for(var d=0; d<7; d++){ var x=new Date(start); x.setDate(start.getDate()+w*7+d); var key=dk(x), c2=counts[key]||0; tot+=x<=end?c2:0;
        var l=c2===0?'':c2<3?'l1':c2<6?'l2':c2<10?'l3':'l4';
        h+= x>end ? '<i style="visibility:hidden"></i>' : '<i class="'+l+(c2?' c':'')+(DAYF===key?' sel':'')+'" data-k="'+key+'" title="'+esc(x.toLocaleDateString(LOCALE,{day:'numeric',month:'long'}))+': '+c2+' '+words(c2)+'"></i>'; } }
    $('hm').innerHTML=h; $('hmM').innerHTML=months; $('hmTot').textContent=tot+' '+words(tot);
  }

  function chips(){
    var h='<span class="chip all'+(FT<0?' on':'')+'" data-t="-1">'+S.all+'</span>';
    for(var t=4;t>=0;t--) h+='<span class="chip t'+t+(FT===t?' on':'')+'" data-t="'+t+'"><i></i>'+TL[t]+'</span>';
    $('chips').innerHTML=h;
  }
  function whenSel(){
    var years={}; DATA.forEach(function(r){ years[new Date(r.unlock*1000).getFullYear()]=1; });
    var ys=Object.keys(years).sort(function(a,b){return b-a;});
    $('when').innerHTML='<option value="all">'+S.allDates+'</option><option value="w">'+S.thisWeek+'</option><option value="m">'+S.thisMonth+'</option>'
      +ys.map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('');
    $('when').value=WHEN;
  }

  function filtered(){
    var q=$('q').value.trim().toLowerCase(), now=Date.now()/1000, n=new Date();
    return DATA.filter(function(r){
      if(FT>=0 && r.t!==FT) return false;
      if(q && r.name.toLowerCase().indexOf(q)<0 && r.game.toLowerCase().indexOf(q)<0) return false;
      if(DAYF){ if(dkey(r.unlock)!==DAYF) return false; }
      else if(WHEN==='w'){ if(r.unlock<now-7*86400) return false; }
      else if(WHEN==='m'){ var d=new Date(r.unlock*1000); if(d.getFullYear()!==n.getFullYear()||d.getMonth()!==n.getMonth()) return false; }
      else if(WHEN!=='all'){ if(String(new Date(r.unlock*1000).getFullYear())!==WHEN) return false; }
      return true;
    });
  }

  function render(){
    $('empty').hidden=!!DATA.length; $('main').hidden=!DATA.length;
    var list=filtered(), days=[], cur=null;
    list.forEach(function(r){ var k=dkey(r.unlock); if(!cur||cur.k!==k){ cur={k:k,items:[]}; days.push(cur);} cur.items.push(r); });
    var shown=days.slice(0,SHOW), h='';
    shown.forEach(function(g){
      var dn=dayName(g.items[0].unlock);
      h+='<section class="dgrp"><div class="gday"><b>'+esc(dn.lab)+'</b><span>'+(dn.sub?esc(dn.sub)+' · ':'')+g.items.length+' '+words(g.items.length)+'</span></div>';
      g.items.forEach(function(r){
        var big=r.t>=3;
        h+='<div class="ev t'+r.t+(big?' big':'')+'"><span class="when">'+fmtTime(r.unlock)+'</span><span class="dot"></span><div class="box">'+(big?heroImg(r.appid):'')
          +icon(r)+'<div class="tx">'+(big?'<div class="kick">'+gems(r.t)+esc(S.kick.replace('{t}',TL[r.t].toLowerCase()))+'</div>':'')
          +'<div class="nm">'+esc(r.name)+'</div><div class="gm"><b>'+esc(r.game)+'</b>'+(r.desc?' · '+esc(r.desc):'')+'</div></div>'
          +'<div class="rt"><div class="pct">'+fmtPct(r.p)+'</div>'+(big?'':'<div class="tl">'+TL[r.t]+'</div>')+'</div></div></div>';
      });
      h+='</section>';
    });
    $('tline').innerHTML= h || '<div class="nores">'+S.noRes+'</div>';
    $('moreBox').hidden = days.length<=SHOW;
    $('dayf').hidden=!DAYF;
    if(DAYF){ var p=DAYF.split('-'); $('dayfT').textContent=cap(new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(LOCALE,{weekday:'long',day:'numeric',month:'long'})); }
    Array.prototype.forEach.call(document.querySelectorAll('#hm i'),function(i){ i.classList.toggle('sel', i.dataset.k===DAYF); });
    side();
  }

  // side column: one month (calendar, rarity mix, games) — starts on the current month
  function side(){
    if(!DATA.length) return;
    var n=new Date(); if(!MON) MON={y:n.getFullYear(), m:n.getMonth()};
    var y=MON.y, m=MON.m, first=new Date(y,m,1), off=(first.getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
    var oldest=new Date(DATA[DATA.length-1].unlock*1000), canPrev=(y>oldest.getFullYear()||(y===oldest.getFullYear()&&m>oldest.getMonth())), canNext=(y<n.getFullYear()||(y===n.getFullYear()&&m<n.getMonth()));
    var mon=DATA.filter(function(r){ var d=new Date(r.unlock*1000); return d.getFullYear()===y && d.getMonth()===m; });
    var cnt={}, best={}; mon.forEach(function(r){ var d=new Date(r.unlock*1000).getDate(); cnt[d]=(cnt[d]||0)+1; if(best[d]==null||r.t>best[d]) best[d]=r.t; });
    var mx=1; for(var k in cnt) mx=Math.max(mx,cnt[k]);
    var wd=''; for(var i=0;i<7;i++){ wd+='<span class="w">'+esc(new Date(2024,0,1+i).toLocaleDateString(LOCALE,{weekday:'narrow'}))+'</span>'; }
    var cal='<div class="cgrid">'+wd; for(i=0;i<off;i++) cal+='<span></span>';
    for(var d=1; d<=dim; d++){ var c=cnt[d]||0, kk=c?(0.18+0.82*c/mx):0, key=y+'-'+(m+1)+'-'+d, isT=(y===n.getFullYear()&&m===n.getMonth()&&d===n.getDate());
      cal+='<span class="d'+(c?' has':'')+(kk>0.6?' hi':'')+(isT?' today':'')+(DAYF===key?' sel':'')+'"'+(c?' data-k="'+key+'"':'')+' style="--k:'+kk.toFixed(2)+'" title="'+c+' '+words(c)+'">'+d+(c&&best[d]>=3?'<i class="rd t'+best[d]+'"></i>':'')+'</span>'; }
    cal+='</div>';
    var tc=[0,0,0,0,0]; mon.forEach(function(r){ tc[r.t]++; }); var tmx=Math.max(1,Math.max.apply(null,tc));
    var dist=''; for(var t=4;t>=0;t--) dist+='<div class="drow t'+t+'"><span>'+TL[t]+'</span><div class="bar"><i style="width:'+(tc[t]/tmx*100)+'%"></i></div><b>'+tc[t]+'</b></div>';
    var gc={}; mon.forEach(function(r){ var id=r.appid||r.game; (gc[id]=gc[id]||{n:0,g:r.game,a:r.appid}).n++; });
    var tops=Object.keys(gc).map(function(k){return gc[k];}).sort(function(a,b){return b.n-a.n;}).slice(0,5);
    $('side').innerHTML='<div class="hcard cal"><h4><button id="mPrev" title="'+esc(S.prevM)+'"'+(canPrev?'':' disabled')+'>‹</button><b>'+esc(first.toLocaleDateString(LOCALE,{month:'long',year:'numeric'}))+'</b><button id="mNext" title="'+esc(S.nextM)+'"'+(canNext?'':' disabled')+'>›</button></h4>'
      +'<span class="ctot">'+mon.length+' '+words(mon.length)+'</span>'+cal+'</div>'
      +'<div class="hcard dist"><h4>'+S.mRar+'</h4>'+dist+'</div>'
      +'<div class="hcard tops"><h4>'+S.mGames+'</h4>'+(tops.length? tops.map(function(g){ return '<div class="trow">'+(g.a?'<img class="th" src="'+CDN+g.a+'/header.jpg" alt="" onerror="this.style.visibility=\'hidden\'">':'<span class="th"></span>')+'<div>'+esc(g.g)+'</div><b>'+g.n+'</b></div>'; }).join('') : '<div class="none">'+S.mNone+'</div>')+'</div>';
    $('mPrev').onclick=function(){ if(!canPrev) return; MON.m--; if(MON.m<0){MON.m=11;MON.y--;} side(); };
    $('mNext').onclick=function(){ if(!canNext) return; MON.m++; if(MON.m>11){MON.m=0;MON.y++;} side(); };
  }

  function pickDay(key){ DAYF = (DAYF===key? null : key); SHOW=STEP; render(); window.scrollTo({top:Math.min(window.scrollY, document.querySelector('.filters').offsetTop-64), behavior:'smooth'}); }

  (function(){
    var root=document.documentElement;
    $('theme').addEventListener('click',function(){
      var dark=root.getAttribute('data-theme')==='dark';
      if(dark){ root.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} }
      else { root.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
      try{ window.chrome.webview.postMessage(JSON.stringify({action:'theme', theme:(root.getAttribute('data-theme')==='dark'?'dark':'light')})); }catch(e){}
      updateBack();
    });
    $('chips').addEventListener('click',function(e){ var c=e.target.closest('.chip'); if(!c) return; FT=+c.dataset.t; SHOW=STEP; chips(); render(); });
    $('q').addEventListener('input',function(){ SHOW=STEP; render(); });
    $('when').addEventListener('change',function(e){ WHEN=e.target.value; DAYF=null; SHOW=STEP; render(); });
    $('more').addEventListener('click',function(){ SHOW+=STEP; render(); });
    $('dayfX').addEventListener('click',function(){ DAYF=null; render(); });
    $('hm').addEventListener('click',function(e){ var i=e.target.closest('i.c'); if(i) pickDay(i.dataset.k); });
    $('side').addEventListener('click',function(e){ var d=e.target.closest('.d[data-k]'); if(d) pickDay(d.dataset.k); });
  })();

  // Render an empty state immediately so the window never looks blank before data arrives.
  (function(){ var m=location.search.match(/[?&]lang=([a-z]{2})/); setLang(m?m[1]:'it'); renderAll(); })();
</script>
