<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronologia Fanfara</title>
<script>(function(){try{var m=location.search.match(/[?&]theme=(dark|light)/);var t=m?m[1]:(localStorage.getItem('fanfara-theme')||'dark');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
  .back{ cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--fg); font:700 12.5px var(--display); letter-spacing:.02em; margin-right:4px; transition:.15s }
  .back:hover{ border-color:color-mix(in srgb,var(--rare) 50%, var(--line)) }
  .back svg{ width:16px; height:16px }
  :root{
    color-scheme: light;
    --bg:#eef1f7; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f3f6fb;
    --fg:#161c2b; --muted:#5b6478; --faint:#9aa3b5; --line:rgba(16,24,40,.12);
    --glow1:rgba(76,141,255,.10); --glow2:rgba(176,120,255,.08);
    --common:#6b7488; --uncommon:#2f9e4f; --rare:#2f6fe0; --epic:#8b43e0; --legendary:#B8860B;
    --display:'Oxanium','Segoe UI',ui-sans-serif,system-ui,sans-serif;
    --body:'Archivo','Segoe UI',ui-sans-serif,system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0a0e17; --bg-2:#0d1220; --panel:#161c2b; --panel-2:#1d2437;
    --fg:#E8EBF3; --muted:#8b93a7; --faint:#5b6478; --line:rgba(255,255,255,.09);
    --glow1:rgba(76,141,255,.12); --glow2:rgba(176,120,255,.10);
    --common:#8A93A6; --uncommon:#4ac46a; --rare:#4C8DFF; --epic:#B078FF; --legendary:#F5C242;
  }
  .tier-common{--tier:var(--common)} .tier-uncommon{--tier:var(--uncommon)}
  .tier-rare{--tier:var(--rare)} .tier-epic{--tier:var(--epic)} .tier-legendary{--tier:var(--legendary)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{ margin:0;
    background:radial-gradient(1200px 600px at 80% -10%, var(--glow1), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, var(--glow2), transparent 55%), var(--bg);
    color:var(--fg); font-family:var(--body); line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:90px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px }
  .top{ position:sticky; top:0; z-index:15; background:color-mix(in srgb,var(--bg-2) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
  .top .wrap{ display:flex; align-items:center; gap:14px; padding:14px 20px }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0 }
  .brand .mark{ width:30px; height:30px; flex:0 0 auto; color:var(--legendary) }
  .brand b{ font:800 18px/1 var(--display); letter-spacing:.02em }
  .brand span{ font:600 11px/1.3 var(--display); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); display:block }
  .hdr-actions{ margin-left:auto; display:flex; align-items:center; gap:10px }
  .local{ display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font:600 11px var(--display); letter-spacing:.04em; color:var(--muted); background:var(--panel); border:1px solid var(--line); padding:7px 11px; border-radius:999px }
  .local svg{ width:13px; height:13px; color:var(--uncommon) }
  .tbtn{ cursor:pointer; display:grid; place-items:center; width:36px; height:36px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--fg) }
  .tbtn svg{ width:17px; height:17px } .tbtn .moon{display:none}
  :root[data-theme="dark"] .tbtn .sun{display:none} :root[data-theme="dark"] .tbtn .moon{display:block}
  .session{ margin-top:18px; display:flex; align-items:center; gap:12px; background:linear-gradient(120deg, color-mix(in srgb,var(--legendary) 14%, var(--panel)), var(--panel)); border:1px solid color-mix(in srgb,var(--legendary) 32%, transparent); border-radius:14px; padding:13px 16px }
  .session svg{ width:22px; height:22px; flex:0 0 auto; color:var(--legendary) }
  .session p{ margin:0; font-size:13.5px } .session b{ color:var(--legendary); font-weight:700 }
  .stats{ margin-top:14px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 15px }
  .stat .k{ font:600 11.5px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--faint) }
  .stat .v{ font:800 30px/1.05 var(--display); margin-top:7px; font-variant-numeric:tabular-nums }
  .stat .s{ font-size:12.5px; color:var(--muted); margin-top:3px }
  .stat.rarest .v{ color:var(--legendary) }
  .sec{ margin-top:26px }
  .sec-h{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px }
  .sec-h h2{ margin:0; font:700 14.5px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
  .sec-h .rule{ flex:1; height:1px; background:var(--line) }
  .show{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px }
  .card{ --tier:var(--common); position:relative; overflow:hidden; background:linear-gradient(160deg, color-mix(in srgb,var(--tier) 18%, var(--panel-2)), var(--panel)); border:1px solid color-mix(in srgb,var(--tier) 42%, transparent); border-radius:16px; padding:16px }
  .card .emblem{ width:44px; height:44px; color:var(--tier); display:grid; place-items:center }
  .card .emblem img{ width:44px; height:44px; border-radius:9px; object-fit:cover }
  .card .rk{ position:absolute; top:14px; right:14px; font:800 12px var(--display); color:var(--tier); font-variant-numeric:tabular-nums }
  .card .nm{ font:700 17px/1.25 var(--display); margin-top:13px }
  .card .gm{ font-size:13.5px; color:var(--muted); margin-top:4px }
  .card .foot{ display:flex; align-items:center; gap:8px; margin-top:13px }
  .card .pct{ font:800 17px var(--display); color:var(--tier); font-variant-numeric:tabular-nums }
  .card .lab{ font:600 12px var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
  .filters{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px }
  .search{ position:relative; flex:1 1 220px; min-width:0 }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--faint) }
  .search input{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:11px 12px 11px 36px; font:500 14px var(--body) }
  .search input:focus{ outline:none; border-color:color-mix(in srgb,var(--rare) 55%, transparent) }
  .chips{ display:flex; flex-wrap:wrap; gap:7px }
  .chip{ --tier:var(--muted); cursor:pointer; font:600 13.5px var(--display); background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:9px 15px; border-radius:999px }
  .chip.on{ color:var(--tier); background:color-mix(in srgb,var(--tier) 15%, transparent); border-color:color-mix(in srgb,var(--tier) 55%, transparent) }
  .chip.all.on{ color:var(--fg); background:var(--panel-2); border-color:var(--line) }
  .day-h{ font:700 12.5px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:16px 2px 9px }
  .row{ --tier:var(--common); display:flex; align-items:center; gap:15px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--tier); border-radius:12px; padding:14px 16px; margin-bottom:9px }
  .row .ico{ flex:0 0 auto; width:46px; height:46px; display:grid; place-items:center; border-radius:11px; color:var(--tier); background:color-mix(in srgb,var(--tier) 15%, transparent); border:1px solid color-mix(in srgb,var(--tier) 30%, transparent); overflow:hidden }
  .row .ico img{ width:46px; height:46px; object-fit:cover }
  .row .ico svg{ width:23px; height:23px }
  .row .main{ min-width:0; flex:1 }
  .row .nm{ font:700 16px var(--display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .row .sub{ font-size:13.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .row .sub .g{ color:var(--fg) }
  .row .meta{ flex:0 0 auto; display:flex; align-items:center; gap:16px }
  .rar{ text-align:right } .rar .p{ font:800 16.5px var(--display); color:var(--tier); font-variant-numeric:tabular-nums } .rar .l{ font:600 11.5px var(--display); letter-spacing:.07em; text-transform:uppercase; color:var(--muted) }
  .when{ text-align:right; min-width:64px } .when .t{ font:600 13.5px var(--display); font-variant-numeric:tabular-nums }
  .empty{ display:none; text-align:center; color:var(--muted); padding:60px 20px; font-size:14px }
  .empty.show{ display:block }
  .empty .big{ font:700 16px var(--display); color:var(--fg); margin-bottom:8px }
  .year{ background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:10px 14px; font:600 13.5px var(--display); cursor:pointer }
  .year:focus{ outline:none; border-color:color-mix(in srgb,var(--rare) 55%, transparent) }
  .pager{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; align-items:center; justify-content:center; gap:16px;
    padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px)); background:color-mix(in srgb,var(--bg-2) 92%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line) }
  .pager button{ cursor:pointer; background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:10px 20px; font:700 13.5px var(--display) }
  .pager button:hover:not([disabled]){ border-color:color-mix(in srgb,var(--rare) 50%, var(--line)) }
  .pager button[disabled]{ opacity:.4; cursor:default }
  .pager .info{ font:600 12.5px var(--display); color:var(--muted); min-width:130px; text-align:center; font-variant-numeric:tabular-nums }
  .foot-note{ color:var(--faint); font-size:11.5px; text-align:center; padding:26px 0 36px }
  @media (max-width:720px){ .show{ grid-template-columns:1fr } .stats{ grid-template-columns:repeat(2,1fr) } }
  @media (max-width:480px){ .local{display:none} .when{display:none} }
</style></head>
<body>
<div class="top"><div class="wrap">
  <a class="back" id="back" href="home.html?home=1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
    <div><b>Fanfara</b><span id="s-sub">Cronologia</span></div>
  </div>
  <div class="hdr-actions">
    <span class="local"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="s-local">Solo in locale</span></span>
    <button class="tbtn" id="theme" aria-label="Tema">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div></div>

<div class="wrap">
  <div class="session" id="session" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg><p id="session-text"></p></div>
  <div class="stats" id="stats"></div>
  <div class="sec" id="sec-show" style="display:none">
    <div class="sec-h"><h2 id="t-show">In vetrina</h2><span class="rule"></span></div>
    <div class="show" id="show"></div>
  </div>
  <div class="sec" id="sec-all">
    <div class="sec-h"><h2 id="t-all">Tutti gli sblocchi</h2><span class="rule"></span></div>
    <div class="filters">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="text"></label>
      <select id="year" class="year"></select>
      <div class="chips" id="chips"></div>
    </div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
  <div class="empty" id="empty"><div class="big" id="empty-big"></div><div id="empty-sub"></div></div>
  <div class="foot-note" id="foot"></div>
</div>

<script>
  var STR={
    it:{sub:'Cronologia',local:'Solo in locale',show:'In vetrina',all:'Tutti gli sblocchi',search:'Cerca obiettivo o gioco…',
        kUnl:'Sbloccati',kRare:'Più raro',kGames:'Giochi',kWeek:'Settimana',sUnl:'con Fanfara',sLib:'in libreria',sWeek:'ultimi 7 giorni',
        all:'Tutte',today:'Oggi',yday:'Ieri',foot:'La cronologia è salvata sul tuo computer e non lascia mai il dispositivo.',
        emptyBig:'Ancora nessuno sblocco',emptySub:'Gioca con Fanfara attivo, oppure sincronizza lo storico dal menu nella barra delle applicazioni.',
        sess:'Oggi hai sbloccato {n}',sessRare:' — il più raro al {p}',
        allYears:'Tutte le date',pg:'Pagina {c} di {t}',prev:'Indietro',next:'Avanti',noRes:'Nessun risultato per i filtri scelti.'},
    en:{sub:'History',local:'On this device only',show:'Spotlight',all:'All unlocks',search:'Search achievement or game…',
        kUnl:'Unlocked',kRare:'Rarest',kGames:'Games',kWeek:'This week',sUnl:'with Fanfara',sLib:'in library',sWeek:'last 7 days',
        all:'All',today:'Today',yday:'Yesterday',foot:'Your history is stored on your computer and never leaves this device.',
        emptyBig:'No unlocks yet',emptySub:'Play with Fanfara running, or sync your history from the tray menu.',
        sess:'Today you unlocked {n}',sessRare:' — the rarest at {p}',
        allYears:'All dates',pg:'Page {c} of {t}',prev:'Back',next:'Next',noRes:'No results for the chosen filters.'}
  };
  var TIERLAB={ it:['Comune','Non comune','Raro','Epico','Leggendario'], en:['Common','Uncommon','Rare','Epic','Legendary'],
    fr:['Commun','Peu commun','Rare','Épique','Légendaire'], de:['Gewöhnlich','Ungewöhnlich','Selten','Episch','Legendär'],
    es:['Común','Poco común','Raro','Épico','Legendario'] };
  var LANG='it', S=STR.it, TL=TIERLAB.it, LOCALE='it-IT';
  var LOCMAP={it:'it-IT',en:'en-GB',fr:'fr-FR',de:'de-DE',es:'es-ES'};

  function tierIdx(p){ if(p==null) return 0; if(p<1)return 4; if(p<5)return 3; if(p<10)return 2; if(p<40)return 1; return 0; }
  var TIERID=['common','uncommon','rare','epic','legendary'];
  function fmtPct(p){ return p==null ? '—' : p.toLocaleString(LOCALE,{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
  function fmtTime(ep){ if(!ep)return ''; try{ return new Date(ep*1000).toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
  function dayLabel(ep){ if(!ep) return '—'; var d=new Date(ep*1000), n=new Date();
    var a=new Date(d.getFullYear(),d.getMonth(),d.getDate()), b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
    var diff=Math.round((b-a)/86400000);
    if(diff<=0)return S.today; if(diff===1)return S.yday;
    return d.toLocaleDateString(LOCALE,{day:'numeric',month:'long'}); }
  var TROPHY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';

  var DATA=[], active='all', activeYear='all', page=0; var PER=25;

  function setLang(l){ LANG=STR[l]?l:'en'; S=STR[LANG]||STR.en; TL=TIERLAB[LANG]||TIERLAB.en; LOCALE=LOCMAP[LANG]||'en-GB';
    document.documentElement.lang=LANG;
    document.getElementById('s-sub').textContent=S.sub; document.getElementById('s-local').textContent=S.local;
    document.getElementById('t-show').textContent=S.show; document.getElementById('t-all').textContent=S.all;
    document.getElementById('q').placeholder=S.search; document.getElementById('foot').textContent=S.foot;
    document.getElementById('empty-big').textContent=S.emptyBig; document.getElementById('empty-sub').textContent=S.emptySub;
    updateBack();
  }
  function updateBack(){
    var t=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    document.getElementById('back').setAttribute('href','home.html?home=1&theme='+t+'&lang='+LANG);
  }

  // called by the app with { theme, lang, items:[{name,game,desc,p,unlock,api,appid,icon}] }
  window.fanfaraInit=function(payload){
    try{
      if(payload.theme==='dark') document.documentElement.setAttribute('data-theme','dark');
      else if(payload.theme==='light') document.documentElement.removeAttribute('data-theme');
      setLang(payload.lang||'it');
      DATA=(payload.items||[]).map(function(r){
        var ti=tierIdx(r.p);
        return { name:r.name||'', game:r.game||'', desc:r.desc||'', p:(r.p==null?null:r.p),
          unlock:r.unlock||0, icon:r.icon||'', tier:TIERID[ti], tlab:TL[ti] };
      });
      DATA.sort(function(a,b){ return b.unlock-a.unlock; });
      renderAll();
    }catch(e){}
  };

  function renderAll(){ stats(); session(); showcase(); chips(); buildYears(); render(); }

  function buildYears(){
    var years={};
    DATA.forEach(function(d){ if(d.unlock){ years[new Date(d.unlock*1000).getFullYear()]=1; } });
    var list=Object.keys(years).sort(function(a,b){return b-a;});
    var sel=document.getElementById('year');
    sel.innerHTML='<option value="all">'+S.allYears+'</option>'+list.map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('');
    sel.value=activeYear;
  }

  function stats(){
    var el=document.getElementById('stats');
    var total=DATA.length;
    var withP=DATA.filter(function(d){return d.p!=null;});
    var rarest=withP.length?withP.reduce(function(a,b){return b.p<a.p?b:a;}):null;
    var games={}; DATA.forEach(function(d){ if(d.game) games[d.game]=1; });
    var weekAgo=Math.floor(Date.now()/1000)-7*86400;
    var week=DATA.filter(function(d){return d.unlock>=weekAgo;}).length;
    el.innerHTML=
      '<div class="stat"><div class="k">'+S.kUnl+'</div><div class="v">'+total+'</div><div class="s">'+S.sUnl+'</div></div>'
      +'<div class="stat rarest"><div class="k">'+S.kRare+'</div><div class="v">'+(rarest?fmtPct(rarest.p):'—')+'</div><div class="s">'+(rarest?esc(rarest.name):'')+'</div></div>'
      +'<div class="stat"><div class="k">'+S.kGames+'</div><div class="v">'+Object.keys(games).length+'</div><div class="s">'+S.sLib+'</div></div>'
      +'<div class="stat"><div class="k">'+S.kWeek+'</div><div class="v">'+week+'</div><div class="s">'+S.sWeek+'</div></div>';
  }
  function session(){
    var box=document.getElementById('session');
    var today=DATA.filter(function(d){ return dayLabel(d.unlock)===S.today; });
    if(!today.length){ box.style.display='none'; return; }
    var withP=today.filter(function(d){return d.p!=null;});
    var rarest=withP.length?withP.reduce(function(a,b){return b.p<a.p?b:a;}):null;
    var txt=S.sess.replace('{n}','<b>'+today.length+'</b>');
    if(rarest) txt+=S.sessRare.replace('{p}','<b>'+fmtPct(rarest.p)+'</b>');
    document.getElementById('session-text').innerHTML=txt;
    box.style.display='flex';
  }
  function showcase(){
    var sec=document.getElementById('sec-show');
    var withP=DATA.filter(function(d){return d.p!=null;}).slice().sort(function(a,b){return a.p-b.p;}).slice(0,3);
    if(withP.length<3){ sec.style.display='none'; return; }
    sec.style.display='';
    document.getElementById('show').innerHTML=withP.map(function(d,i){
      var em = d.icon ? '<img src="'+esc(d.icon)+'" alt="" onerror="this.style.display=\'none\'">' : TROPHY;
      return '<div class="card tier-'+d.tier+'"><div class="rk">#'+(i+1)+'</div><div class="emblem">'+em+'</div>'
        +'<div class="nm">'+esc(d.name)+'</div><div class="gm">'+esc(d.game)+'</div>'
        +'<div class="foot"><span class="pct">'+fmtPct(d.p)+'</span><span class="lab">'+d.tlab+'</span></div></div>';
    }).join('');
  }
  var ORDER=['all','legendary','epic','rare','uncommon','common'];
  function chips(){
    document.getElementById('chips').innerHTML=ORDER.map(function(id){
      var lab = id==='all'?S.all:TL[TIERID.indexOf(id)];
      return '<button class="chip tier-'+id+(id==='all'?' all':'')+(id===active?' on':'')+'" data-f="'+id+'">'+lab+'</button>';
    }).join('');
  }
  function render(){
    var q=document.getElementById('q').value.trim().toLowerCase();
    // filter the whole list (rarity + search + year)
    var filtered=DATA.filter(function(d){
      if(active!=='all' && d.tier!==active) return false;
      if(q && d.name.toLowerCase().indexOf(q)<0 && d.game.toLowerCase().indexOf(q)<0) return false;
      if(activeYear!=='all'){ if(!d.unlock) return false; if(String(new Date(d.unlock*1000).getFullYear())!==activeYear) return false; }
      return true;
    });
    var total=filtered.length, pages=Math.max(1,Math.ceil(total/PER));
    if(page>=pages) page=pages-1; if(page<0) page=0;
    var slice=filtered.slice(page*PER, page*PER+PER);

    // group the current page's items by day
    var days={}, order=[];
    slice.forEach(function(d){ var day=dayLabel(d.unlock); if(!days[day]){days[day]=[];order.push(day);} days[day].push(d); });

    var listEl=document.getElementById('list');
    if(total===0){ listEl.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:13.5px">'+(DATA.length?S.noRes:'')+'</div>'; }
    else listEl.innerHTML=order.map(function(day){
      return '<div class="day"><div class="day-h">'+esc(day)+'</div>'+days[day].map(function(d){
        var ico = d.icon ? '<img src="'+esc(d.icon)+'" alt="" onerror="this.style.display=\'none\'">' : TROPHY;
        return '<div class="row tier-'+d.tier+'"><div class="ico">'+ico+'</div>'
          +'<div class="main"><div class="nm">'+esc(d.name)+'</div>'
          +'<div class="sub"><span class="g">'+esc(d.game)+'</span>'+(d.desc?' · '+esc(d.desc):'')+'</div></div>'
          +'<div class="meta"><div class="rar"><div class="p">'+fmtPct(d.p)+'</div><div class="l">'+d.tlab+'</div></div>'
          +'<div class="when"><div class="t">'+fmtTime(d.unlock)+'</div></div></div></div>';
      }).join('')+'</div>';
    }).join('');

    // pager
    var pager=document.getElementById('pager');
    if(total>PER){
      pager.style.display='flex';
      pager.innerHTML='<button id="prev"'+(page<=0?' disabled':'')+'>‹ '+S.prev+'</button>'
        +'<span class="info">'+S.pg.replace('{c}',page+1).replace('{t}',pages)+'</span>'
        +'<button id="next"'+(page>=pages-1?' disabled':'')+'>'+S.next+' ›</button>';
      document.getElementById('prev').onclick=function(){ if(page>0){page--; render(); window.scrollTo(0,0);} };
      document.getElementById('next').onclick=function(){ if(page<pages-1){page++; render(); window.scrollTo(0,0);} };
    } else pager.style.display='none';

    document.getElementById('empty').className = DATA.length? 'empty' : 'empty show';
    document.getElementById('sec-all').style.display = DATA.length? '' : 'none';
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  (function(){
    var root=document.documentElement;
    document.getElementById('theme').addEventListener('click',function(){
      var dark=root.getAttribute('data-theme')==='dark';
      if(dark){ root.removeAttribute('data-theme'); try{localStorage.setItem('fanfara-theme','light');}catch(e){} }
      else { root.setAttribute('data-theme','dark'); try{localStorage.setItem('fanfara-theme','dark');}catch(e){} }
      try{ window.chrome.webview.postMessage(JSON.stringify({action:'theme', theme:(root.getAttribute('data-theme')==='dark'?'dark':'light')})); }catch(e){}
      updateBack();
    });
    document.getElementById('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b)return; active=b.dataset.f; page=0; chips(); render(); });
    document.getElementById('q').addEventListener('input',function(){ page=0; render(); });
    document.getElementById('year').addEventListener('change',function(e){ activeYear=e.target.value; page=0; render(); });
  })();

  // Render an empty state immediately so the window never looks blank before data arrives.
  (function(){ var m=location.search.match(/[?&]lang=([a-z]{2})/); setLang(m?m[1]:'it'); renderAll(); })();
</script>
</body></html>
