name: Build

on:
  push:
    tags: ["v*"]        # a tag like v0.1.0 builds and publishes a ready-to-use Release
  workflow_dispatch: {} # or run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained)
        run: dotnet publish src/Fanfara.csproj -c Release -o publish

      - name: Package into a ready-to-use zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Fanfara.zip -Force

      - name: Upload build artifact (download from the run)
        uses: actions/upload-artifact@v4
        with:
          name: Fanfara
          path: Fanfara.zip

      - name: Attach the zip to the Release (on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Fanfara.zip
