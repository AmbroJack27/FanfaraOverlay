name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -notmatch '^\d') { $ver = "0.1.9" }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver"

      - name: Publish (self-contained)
        run: dotnet publish src/Fanfara.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.ver }}

      - name: Package the portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Fanfara.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.ver }}" "Fanfara.iss"

      - name: Upload build artifacts (download from the run)
        uses: actions/upload-artifact@v4
        with:
          name: Fanfara
          path: |
            Fanfara.zip
            installer_output/FanfaraSetup.exe

      - name: Attach files to the Release (on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fanfara.zip
            installer_output/FanfaraSetup.exe
            build: versione agganciata al tag
