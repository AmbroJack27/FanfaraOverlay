name: Build

on:
  push:
    tags: ["v*"]        # a tag like v0.1.2 builds and publishes a ready-to-use Release
  workflow_dispatch: {} # or run it manually from the Actions tab

permissions:
  contents: write        # allow attaching files to the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained)
        run: dotnet publish src/Fanfara.csproj -c Release -o publish

      - name: Package the portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Fanfara.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          # Use the tag (v0.1.2 -> 0.1.2) as the installer version when present.
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -notmatch '^\d') { $ver = "0.1.2" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "Fanfara.iss"

      - name: Upload build artifacts (download from the run)
        uses: actions/upload-artifact@v4
        with:
          name: Fanfara
          path: |
            Fanfara.zip
            installer_output/FanfaraSetup.exe

      - name: Attach files to the Release (on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fanfara.zip
            installer_output/FanfaraSetup.exe
